<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070B1C">
<title>Checkpoint Papers · EICT</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#070B1C;--panel:#0d1433;--wire:rgba(142,164,255,.18);--paper:#EAF0FF;--dim:#93A0C8;--cyan:#38E1FF;--gold:#FFC93C;--ok:#7CF29B;--bad:#FF4D6D;--d:'Chakra Petch','Noto Sans Sinhala',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--paper);font:15px/1.6 'Nunito','Noto Sans Sinhala',system-ui,sans-serif;
  background:radial-gradient(ellipse at 15% -10%,#1b2a66 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#2a1650 0,transparent 50%),var(--ink)}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 70px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
header h1{font:700 22px var(--d);margin:0;flex:1;letter-spacing:.02em}
header h1 small{display:block;font:600 11px var(--d);color:var(--gold);letter-spacing:.24em}
a{color:var(--cyan)}
.btn{font:700 14px var(--d);letter-spacing:.03em;border:1px solid var(--wire);background:#151f4a;color:#fff;border-radius:11px;padding:10px 15px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center;justify-content:center;
  transition:transform .12s,filter .15s,background .2s;-webkit-tap-highlight-color:transparent}
.btn:hover{filter:brightness(1.15)}.btn:active:not(:disabled){transform:scale(.95)}.btn:disabled{opacity:.4;cursor:not-allowed}
.b1{background:linear-gradient(135deg,var(--cyan),#2a8cff);color:#04202B;border-color:transparent}
.b2{background:linear-gradient(135deg,#ffe28a,var(--gold));color:#2b1d00;border-color:transparent}
.ghost{background:transparent}
.btn.busy{pointer-events:none;opacity:.85}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite;vertical-align:-3px}
.b1 .spin,.b2 .spin{border-color:rgba(0,0,0,.18);border-top-color:#2b1d00}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.did{background:linear-gradient(135deg,#9df7b8,#2fbf6e)!important;color:#03281a!important;animation:did .9s ease-out}
@keyframes did{0%{box-shadow:0 0 0 0 rgba(124,242,155,.9)}100%{box-shadow:0 0 0 16px rgba(124,242,155,0)}}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.card{position:relative;background:linear-gradient(160deg,#111a42,#0b1230);border:1px solid var(--wire);border-radius:18px;padding:18px;margin:12px 0}
.cp{border-color:rgba(255,201,60,.45);box-shadow:0 0 0 1px rgba(56,225,255,.12) inset,0 14px 40px -18px rgba(56,225,255,.35)}
.k{font:600 11px var(--d);letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
h2{font:700 22px var(--d);margin:4px 0 6px}h3{font:700 16px var(--d);margin:16px 0 8px;letter-spacing:.02em}
.muted{color:var(--dim);font-size:13.5px}
.pill{display:inline-block;font:700 11.5px var(--d);letter-spacing:.06em;padding:3px 10px;border-radius:99px;border:1px solid currentColor}
.pill.c{color:var(--cyan)}.pill.g{color:var(--gold)}.pill.o{color:var(--ok)}.pill.r{color:var(--bad)}.pill.d{color:var(--dim)}
.pill.live{color:#ff8080;animation:glow 1.4s infinite}@keyframes glow{50%{box-shadow:0 0 12px rgba(255,90,90,.8)}}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.item .n{font:700 26px var(--d);color:var(--gold);min-width:46px;text-align:center}
.item .t{flex:1}
.item b{font:700 16px var(--d);display:block}
textarea,input{font:inherit;background:#0a1029;color:var(--paper);border:1px solid var(--wire);border-radius:10px;padding:10px 12px;width:100%}
.tl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-size:14px;margin:8px 0}
.tl b{font-family:var(--d)}
.big{font:700 30px var(--d);color:var(--cyan);letter-spacing:.03em}
.part{border:1px solid var(--wire);border-radius:14px;padding:14px;margin:10px 0;background:#0a1029}
.part.live{border-color:rgba(56,225,255,.6);box-shadow:0 0 22px -8px rgba(56,225,255,.6)}
.link{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center;margin:6px 0}
.link .i{font:700 13px var(--d);color:var(--dim);min-width:28px}
.link button{padding:7px 9px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.res div{background:#0a1029;border:1px solid var(--wire);border-radius:12px;padding:10px;text-align:center;animation:rise .5s both}
.res div:nth-child(2){animation-delay:.08s}.res div:nth-child(3){animation-delay:.16s}.res div:nth-child(4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.res b{display:block;font:700 24px var(--d);color:var(--gold)}
.badge{font-size:42px;line-height:1;animation:pop .6s both}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.note{background:rgba(255,201,60,.08);border:1px solid rgba(255,201,60,.35);border-radius:12px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-weight:700}.okc{color:var(--ok);font-weight:700}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,30px);opacity:0;background:#111a42;border:1.5px solid var(--cyan);border-radius:12px;padding:11px 16px;font-weight:800;z-index:9;max-width:92vw;text-align:center;transition:transform .3s,opacity .3s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}.toast.bad{border-color:var(--bad)}.toast.ok{border-color:var(--ok)}
.gate{max-width:380px;margin:40px auto;text-align:center}.gate input{margin:6px 0}
.hide{display:none!important}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 0}.steps span{font:600 11px var(--d);padding:3px 8px;border-radius:99px;border:1px solid #ffffff1a;color:var(--dim)}
.steps span.on{color:var(--gold);border-color:var(--gold)}.steps span.done{color:var(--ok);border-color:rgba(124,242,155,.4)}

/* uploading the answer sheet */
.bigup{width:100%;padding:16px;font-size:16px}
.files{display:grid;gap:6px;margin:8px 0}
.file{display:flex;gap:10px;align-items:center;background:#0d1740;border:1px solid var(--wire);border-radius:11px;padding:9px 11px;animation:rise .35s both}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.file .x{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:2px 6px}
.prog{height:7px;border-radius:7px;background:#1b2550;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:7px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.got{display:flex;gap:12px;align-items:center;background:rgba(124,242,155,.08);border:1.5px solid rgba(124,242,155,.5);border-radius:14px;padding:12px 14px;margin:8px 0}
.got svg{width:40px;height:40px;flex:none}.got path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s .1s forwards}
.got.fresh{animation:pulse 1.2s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,242,155,.8)}100%{box-shadow:0 0 0 18px rgba(124,242,155,0)}}
@keyframes draw{to{stroke-dashoffset:0}}
details summary{cursor:pointer;color:var(--dim);font-weight:700;margin-top:10px}
@media(max-width:560px){.link{grid-template-columns:auto 1fr auto auto}.link .dn{display:none}.big{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>EICT · A/L ICT</small>Checkpoint Papers</h1>
    <a class="btn ghost" id="backPlan" href="../Journey.html">← Study plan</a>
  </header>

  <section class="card gate hide" id="gate">
    <h2>Sign in</h2>
    <p class="muted">Use the same email and password as your class page.</p>
    <form id="gform"><input id="em" type="email" placeholder="Email" autocomplete="username" required>
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn b1" style="width:100%;margin-top:8px">Sign in</button></form>
    <p class="err" id="gerr"></p>
  </section>

  <main id="app"><p class="muted" id="loading">Loading…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../firebase-config.js"></script>
<script src="../press.js" defer></script>
<script type="module">
/* ============================================================
   Checkpoint Papers — the student side.
   Your exam time and Zoom link → the question paper, which opens
   at its start time → upload your answer sheet (CamScanner PDF or
   photos) straight to sir before the upload time closes → your
   marks, marked sheet, note and place, as soon as sir sends them.
   What a student may read or write, and when, is enforced by the
   Firestore rules against the server clock; the times shown here
   are corrected to the server's clock as well.
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ms=t=>t&&t.toMillis?t.toMillis():t instanceof Date?t.getTime():+t||0;
const fmt=(t,o)=>t?new Date(ms(t)).toLocaleString('en-GB',Object.assign({timeZone:'Asia/Colombo',weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit'},o||{})):'—';
const fmtT=t=>t?new Date(ms(t)).toLocaleTimeString('en-GB',{timeZone:'Asia/Colombo',hour:'numeric',minute:'2-digit'}):'—';
const MEDN={si:'Sinhala',en:'English'};
const dur=m=>m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'');
let FB=null,db=null,auth=null,U=null,ME=null,CPS=[],CUR=null,SKEW=0,tick=null,UPURL='';
const now=()=>Date.now()+SKEW;
const D=(...p)=>FB.doc(db,...p);
let tt;const toast=(t,k)=>{const e=$('#toast');e.textContent=t;e.className='toast on '+(k||'');clearTimeout(tt);tt=setTimeout(()=>e.className='toast '+(k||''),3200);};
const left=t=>{let s=Math.max(0,Math.round((ms(t)-now())/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return d?`${d}d ${h}h ${m}m`:h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}:${String(x).padStart(2,'0')}`;};
/* a button's job: spinner while it works, green when done, a shake and the reason if not */
async function act(btn,fn,okText){
  if(btn&&btn.classList.contains('busy')) return;
  const html=btn&&btn.innerHTML;
  if(btn){btn.style.minWidth=btn.offsetWidth+'px';btn.classList.add('busy');btn.innerHTML='<span class="spin"></span> Please wait…';}
  const back=()=>{if(btn){btn.classList.remove('busy','did');btn.innerHTML=html;btn.style.minWidth='';}};
  try{const r=await fn();
    if(btn&&r!==false&&btn.isConnected){btn.classList.remove('busy');btn.classList.add('did');btn.innerHTML='✓ Done';setTimeout(back,1300);}else back();
    if(r!==false&&okText) toast(okText,'ok');return r;}
  catch(e){back();if(btn){btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');}toast(e.user?e.message:'Could not do that. Check your internet and try again.','bad');}
}
const stop=m=>{const e=new Error(m);e.user=1;throw e;};

/* the server's clock, from the Date header of this very site */
async function syncClock(){try{const t0=Date.now(),r=await fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store'}),t1=Date.now(),d=Date.parse(r.headers.get('date'));
  if(d){const sk=d-(t0+t1)/2;SKEW=Math.abs(sk)>2000?sk:0;}}catch(e){}}

async function boot(){
  const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.projectId){$('#loading').textContent='Cannot reach the class database.';return;}
  const G='https://www.gstatic.com/firebasejs/11.0.2/firebase-';
  try{const [A,F,Au]=await Promise.all([import(G+'app.js'),import(G+'firestore.js'),import(G+'auth.js')]);
    const app=A.initializeApp(cfg);FB={...F,...Au};db=F.getFirestore(app);auth=Au.getAuth(app);
    try{await Au.setPersistence(auth,Au.browserLocalPersistence);}catch(e){}}
  catch(e){$('#loading').textContent='Cannot reach the class database. Check your internet and reload.';return;}
  syncClock();
  FB.onAuthStateChanged(auth,async u=>{U=u;
    if(!u){$('#gate').classList.remove('hide');$('#app').classList.add('hide');return;}
    $('#gate').classList.add('hide');$('#app').classList.remove('hide');
    try{const d=await FB.getDoc(D('students',u.uid));
      if(!d.exists()){$('#app').innerHTML='<div class="card"><p class="err">This account has no student record. Ask sir to add you.</p></div>';return;}
      ME={uid:u.uid,...d.data()};
      if(ME.batch==='AL-27-SI') $('#backPlan').href='../JourneySin.html';
      else if(ME.batch!=='AL-27') $('#backPlan').href=ME.batch==='AL-28'?'../Class2.html':'../EICT.html';
      await loadList();
    }catch(e){$('#app').innerHTML='<div class="card"><p class="err">Could not load: '+esc(e.code||e.message)+'</p></div>';}
  });
}
$('#gform').onsubmit=async e=>{e.preventDefault();
  await act(e.submitter||$('#gform button'),async()=>{try{await FB.signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value);$('#gerr').textContent='';}
    catch(x){stop(/invalid|wrong|not-found/.test(x.code||'')?'Wrong email or password.':(x.code||x.message));}});};

async function loadList(){
  const s=await FB.getDocs(FB.collection(db,'cp'));CPS=[];UPURL='';
  s.forEach(d=>{const c={id:d.id,...d.data()};
    if(d.id==='_settings'){UPURL=c.uploadUrl||'';return;}
    if(c.stage!=='draft'&&((c.batches||[]).includes(ME.batch)||(c.extra||[]).includes(ME.uid))) CPS.push(c);});
  CPS.sort((a,b)=>(a.n||0)-(b.n||0));
  const want=location.hash.slice(1);
  if(want&&CPS.find(c=>c.id===want)) return openCp(want);
  if(CPS.length===1) return openCp(CPS[0].id);
  drawList();
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(!h){CUR=null;drawList();}else if(!CUR||CUR.id!==h) openCp(h);});

/* ---------- my state in a checkpoint ---------- */
let A=null,S={},R=null;
const twoParts=c=>!!(c.secB&&c.secB.on!==false);
const startOf=c=>c.at||(c.sessions&&c.sessions[0]&&c.sessions[0].at)||null;
function myStage(c,a,r){
  if(c.stage==='cancelled') return ['Cancelled','r'];
  if(c.stage==='postponed') return ['Postponed','r'];
  if(r) return [r.absent?'Absent':'Marks are out','o'];
  if(!a) return ['Coming soon','d'];
  const t=now();
  if(t<ms(a.openA)) return ['Coming up','c'];
  if(t<=ms(twoParts(c)?a.dueB:a.dueA)) return ['● Live now','live'];
  return [S.A?'Sent · waiting for marks':'Exam over','o'];
}
function drawList(){
  if(!CPS.length){$('#app').innerHTML='<div class="card"><div class="k">Checkpoint papers</div><h2>Nothing yet</h2><p class="muted">A checkpoint paper appears here when sir opens one for your class — usually after weeks 8, 16, 24 and 32 of the study plan.</p></div>';return;}
  $('#app').innerHTML='<div class="list">'+CPS.map(c=>{const st=startOf(c);return `<button class="card cp item" data-id="${c.id}"><span class="n">${String(c.n||'?').padStart(2,'0')}</span>
    <span class="t"><b>${esc(c.title)}</b><span class="muted">${st?'📅 '+fmt(st,{weekday:'short',month:'short'}):esc(c.coverage||'')}</span></span>
    <span class="pill ${['cancelled','postponed'].includes(c.stage)?'r':'c'}">${c.stage==='cancelled'?'Cancelled':c.stage==='postponed'?'Postponed':'Open'}</span></button>`;}).join('')+'</div>';
  $('#app').onclick=e=>{const b=e.target.closest('[data-id]');if(b) location.hash=b.dataset.id;};
}
async function openCp(id){
  CUR=CPS.find(c=>c.id===id);if(!CUR) return drawList();
  if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
  $('#app').onclick=null;$('#app').innerHTML='<p class="muted">Loading…</p>';
  const g=p=>FB.getDoc(p).then(d=>d.exists()?d.data():null).catch(()=>null);
  [A,S.A,S.B]=await Promise.all([g(D('cp',id,'assign',U.uid)),g(D('cp',id,'subs',U.uid+'_A')),g(D('cp',id,'subs',U.uid+'_B'))]);
  R=null;if(ME.code){const m=await g(D('marks',ME.code));R=m&&m.cp&&m.cp[id]||null;}
  draw();clearInterval(tick);tick=setInterval(()=>{if(!document.hidden&&!document.activeElement.matches('input,textarea'))drawLive();},1000);
}

/* ---------- drawing ---------- */
function draw(){
  const c=CUR,[st,cl]=myStage(c,A,R),two=twoParts(c);
  const steps=['Your exam',c.secA.title,...(two?[c.secB.title]:[]),'Marks'],t=now();
  const at=R?steps.length-1:!A||t<ms(A.openA)?0:t<=ms(A.dueA)&&(!two||t<ms(A.openB))?1:two&&t<=ms(A.dueB)?2:steps.length-1;
  $('#app').innerHTML=`${CPS.length>1?'<a href="#" class="muted">← All checkpoints</a>':''}
    <div class="card cp"><div class="k">Checkpoint ${String(c.n||'?').padStart(2,'0')}${c.afterWeek?' · after week '+c.afterWeek:''}</div>
      <h2>${esc(c.title)}</h2><span class="pill ${cl}">${esc(st)}</span>
      ${c.coverage?`<p style="margin:10px 0 0"><b>Covers:</b> ${esc(c.coverage)}</p>`:''}
      <div class="steps">${steps.map((s,i)=>`<span class="${i<at?'done':i===at?'on':''}">${i+1}. ${esc(s)}</span>`).join('')}</div></div>
    ${['postponed','cancelled'].includes(c.stage)?`<div class="card"><p class="note">This checkpoint has been ${c.stage}.${c.notice?' '+esc(c.notice):''} The paper and uploads are closed for now.</p></div>`:''}
    <div id="body"></div>`;
  if(R) drawResult();
  else if(A) drawExam();
  else $('#body').innerHTML='<div class="card"><p class="muted">Your exam time will appear here soon. If the date has already been announced, please contact sir.</p></div>';
}

/* the exam itself */
const PARTS=()=>[['A',CUR.secA,'openA','endA','dueA'],...(twoParts(CUR)?[['B',CUR.secB,'openB','endB','dueB']]:[])];
const LINKS={A:null,B:null};
function drawExam(){
  const c=CUR,a=A,two=twoParts(c);
  $('#body').innerHTML=`<div class="card"><div class="k">Your exam</div>
      <h3 style="margin-top:4px">📅 ${fmt(a.start)}</h3>
      <div class="tl">${PARTS().map(([p,s,o,e])=>`<b>${esc(s.title)}</b><span>${fmtT(a[o])} – ${fmtT(a[e])}</span><span class="muted">${dur(s.min)}</span>${p==='A'&&two&&c.breakMin?`<b>Break</b><span>${fmtT(a.endA)} – ${fmtT(a.openB)}</span><span class="muted">${c.breakMin} min</span>`:''}`).join('')}</div>
      <p class="muted">Sri Lanka time · ${MEDN[a.medium]||''} medium paper · you have ${c.graceMin} minutes after each part to scan and upload your answers.</p>
      <div id="cd" style="margin:10px 0"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${a.zoom?`<a class="btn b1" href="${esc(a.zoom)}" target="_blank" rel="noopener">🎥 Join Zoom</a>`:'<span class="muted">The Zoom link will appear here.</span>'}
        ${a.ack?'<span class="pill o" style="align-self:center">✓ You confirmed this time</span>':'<button class="btn b2" id="ack">✓ I will be there</button>'}</div>
      ${a.ack?'':'<p class="muted">Cannot make it? Tell sir now.</p>'}</div>
    <div class="card"><div class="k">Rules</div>
      <p style="white-space:pre-line;margin:6px 0">${esc(c.instructions||'')}</p>${c.materials?`<p><b>Allowed:</b> ${esc(c.materials)}</p>`:''}
      <p class="muted">Keep your camera on during the Zoom session so sir can supervise. If you need an accommodation, tell sir before the exam.</p></div>
    ${PARTS().map(([p,s],i)=>`<div class="part" id="part${p}"><div class="k">Step ${i+2} · ${esc(s.title)}</div><div id="pb${p}"></div></div>`).join('')}`;
  if($('#ack')) $('#ack').onclick=e=>act(e.currentTarget,async()=>{await FB.updateDoc(D('cp',c.id,'assign',U.uid),{ack:true,ackAt:FB.serverTimestamp()});A.ack=true;drawExam();},'✓ See you there');
  PARTS().forEach(([p])=>{LINKS[p]=(S[p]&&S[p].links||[]).slice();if(!LINKS[p].length)LINKS[p]=[''];drawPart(p);});
  drawLive();
}
function partState(p){const a=A,t=now(),[o,e,d]=p==='A'?['openA','endA','dueA']:['openB','endB','dueB'];
  if(['postponed','cancelled'].includes(CUR.stage)) return 'closed';
  return t<ms(a[o])?'soon':t<ms(a[e])?'writing':t<=ms(a[d])?'upload':'closed';}
const lastState={A:'',B:''},BUSY={A:false,B:false},FRESH={A:false,B:false};
function drawPart(p){
  if(!$('#pb'+p)) return;
  const a=A,st=partState(p),[o,e,d]=p==='A'?['openA','endA','dueA']:['openB','endB','dueB'],sub=S[p];lastState[p]=st;
  $('#part'+p).classList.toggle('live',st==='writing'||st==='upload');
  const canEdit=st==='writing'||st==='upload',title=esc(p==='A'?CUR.secA.title:CUR.secB.title);
  const got=sub?`<div class="got ${FRESH[p]?'fresh':''}"><svg viewBox="0 0 48 48"><path d="M13 25l8 8 16-17"/></svg>
      <div><b class="okc">Sir has your ${title} answers</b><div class="muted">Sent ${fmt(sub.at,{weekday:undefined})} · ${sub.links.length} file${sub.links.length>1?'s':''}</div></div></div>
    <div class="files">${sub.links.map((l,i)=>`<div class="file"><span>📄</span><span class="nm">File ${i+1}</span><a href="${esc(l)}" target="_blank" rel="noopener">Open ↗</a>${canEdit&&sub.links.length>1?`<button class="x" data-del="${p},${i}" title="Remove this file">✕</button>`:''}</div>`).join('')}</div>`:'';
  FRESH[p]=false;
  $('#pb'+p).innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:6px">
      <span>${st==='soon'?`Opens <b>${fmt(a[o])}</b>`:st==='writing'?`<b class="okc">Writing now</b> · ends ${fmtT(a[e])}`:st==='upload'?`<b style="color:var(--gold)">Scan and upload now</b> · closes ${fmtT(a[d])}`:`Closed ${fmt(a[d],{weekday:undefined})}`}</span>
      <span class="muted" data-left="${p}"></span></div>
    <div style="margin:10px 0"><button class="btn b1" data-paper="${p}" ${st==='soon'?'disabled':''}>📄 ${st==='soon'?'Paper opens at '+fmtT(a[o]):'Open the question paper'}</button></div>
    <h3>Your answer sheet</h3>
    ${got}${!sub&&st==='closed'?'<p class="err">Nothing was sent for this part.</p>':''}
    ${canEdit?(UPURL?`<div id="ul${p}"></div>
        <button class="btn b2 bigup" data-pick="${p}">${sub?'➕ Add another file':'📷 Upload my answer sheet'}</button>
        <input type="file" class="hide" id="fi${p}" accept="application/pdf,image/*" multiple>
        <p class="muted">CamScanner → scan every page in order → <b>Share → PDF</b> → save → choose it here. Photos work too. It goes straight to sir.</p>
        <details><summary>Upload not working? Send a Google Drive link instead</summary>${linkEditor(p,sub)}</details>`
      :`<p class="muted">Scan every page in order with CamScanner → save as <b>one PDF</b> → Google Drive → Share → <b>Anyone with the link</b> → Copy link → paste below.</p>${linkEditor(p,sub)}`)
    :''}`;
}
function linkEditor(p,sub){
  return `<div id="lk${p}">${LINKS[p].map((l,i)=>`<div class="link"><span class="i">${i+1}.</span><input data-l="${p}" data-i="${i}" value="${esc(l)}" placeholder="https://drive.google.com/…" inputmode="url">
      <button class="btn ghost" data-up="${p},${i}" title="Move up" ${i?'':'disabled'}>↑</button><button class="btn ghost dn" data-dn="${p},${i}" title="Move down" ${i<LINKS[p].length-1?'':'disabled'}>↓</button><button class="btn ghost" data-rm="${p},${i}" title="Remove">✕</button></div>`).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn ghost" data-add="${p}">+ Add another link</button>
      <button class="btn b2" data-send="${p}">${sub?'Replace with these links':'Send these links'}</button></div>`;
}
function drawLive(){
  if(!CUR||!A||!$('#cd')) return;
  const a=A,t=now(),two=twoParts(CUR),ev=[[a.openA,CUR.secA.title+' starts'],[a.endA,CUR.secA.title+' ends'],[a.dueA,'Upload closes'],
    ...(two?[[a.openB,CUR.secB.title+' starts'],[a.endB,CUR.secB.title+' ends'],[a.dueB,'Upload closes']]:[])].find(x=>ms(x[0])>t);
  $('#cd').innerHTML=ev?`<div class="muted">${esc(ev[1])} in</div><div class="big">${left(ev[0])}</div>`:'<div class="okc">This exam is over. Your marks appear here as soon as sir sends them.</div>';
  PARTS().forEach(([p])=>{if(partState(p)!==lastState[p]&&!BUSY[p]) drawPart(p);const el=document.querySelector(`[data-left="${p}"]`);if(!el)return;
    const st=partState(p),k=p==='A'?{soon:'openA',writing:'endA',upload:'dueA'}:{soon:'openB',writing:'endB',upload:'dueB'};el.textContent=k[st]?left(a[k[st]])+' left':'';});
}

/* ---------- sending the answer sheet ---------- */
async function saveSub(p,links){
  const v={uid:U.uid,code:ME.code||'',part:p,session:A.session,links,at:FB.serverTimestamp()};
  for(let k=0;k<3;k++){
    try{await FB.setDoc(D('cp',CUR.id,'subs',U.uid+'_'+p),v);S[p]={...v,at:FB.Timestamp.now()};LINKS[p]=links.slice();return;}
    catch(x){if(/permission/.test(x.code||'')) stop('The upload time for this part has closed. If something went wrong, tell sir now.');
      await new Promise(r=>setTimeout(r,1500*(k+1)));}}
  stop('Could not send — check your internet and try again.');
}
/* big phone photos are shrunk before they go, so they upload fast on mobile data */
async function shrink(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<1.5*1048576) return f;
  try{const bm=await createImageBitmap(f),k=Math.min(1,2200/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f;}
  catch(e){return f;}
}
const UPERR={closed:'The upload time for this part has closed. Tell sir now.',assign:'You are not on the list for this paper. Contact sir.',type:'Only PDF files or photos can be uploaded.',
  big:'That file is too big (over 20 MB). Save it from CamScanner as a smaller PDF.',signin:'Please sign in again and retry.',empty:'That file is empty.',checkpoint:'This paper is not open. Reload the page.'};
async function uploadFiles(p,files){
  const box=$('#ul'+p),pickBtn=document.querySelector(`[data-pick="${p}"]`);
  files=[...files];if(!files.length) return;
  const have=(S[p]&&S[p].links)||[];
  if(have.length+files.length>20) return toast('At most 20 files — put the pages into one PDF.','bad');
  for(const f of files) if(!/^(application\/pdf|image\/)/.test(f.type||'')) return toast(f.name+' is not a PDF or a photo.','bad');
  BUSY[p]=true;pickBtn.disabled=true;
  box.innerHTML=files.map((f,i)=>`<div class="file" id="u${p}${i}"><span>⏫</span><div class="nm">${esc(f.name)}<div class="muted">${(f.size/1048576).toFixed(1)} MB · uploading…</div><div class="prog"><i></i></div></div></div>`).join('');
  const urls=[];let fail='';
  for(let i=0;i<files.length;i++){
    const row=$(`#u${p}${i}`);
    try{
      const f=await shrink(files[i]);
      if(f.size>20*1048576) stop(UPERR.big);
      const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f);});
      const token=await U.getIdToken();
      let j=null;
      for(let k=0;k<2&&!j;k++){try{j=await (await fetch(UPURL,{method:'POST',body:JSON.stringify({token,cp:CUR.id,part:p,mime:f.type,data})})).json();}catch(x){if(k) stop('The upload did not get through. Check your internet and try again.');}}
      if(!j.ok) stop(UPERR[j.error]||'Upload refused: '+j.error);
      urls.push(j.url);row.innerHTML=`<span>✅</span><span class="nm">${esc(files[i].name)}</span><span class="okc">Uploaded</span>`;
    }catch(e){fail=e.user?e.message:'The upload did not get through. Check your internet and try again.';row.innerHTML=`<span>⚠️</span><span class="nm">${esc(files[i].name)}</span><span class="err">Failed</span>`;break;}
  }
  let saved=false;
  try{if(urls.length){await saveSub(p,[...have,...urls]);FRESH[p]=true;saved=true;}}catch(e){fail=e.message;}
  BUSY[p]=false;
  if(saved) toast(fail?'Some files went through. '+fail:'✓ Sent! Sir has your answer sheet.',fail?'bad':'ok');
  else toast(fail,'bad');
  if(saved||!fail) drawPart(p);else pickBtn.disabled=false;
}
const tidy=v=>String(v||'').replace(/[​-‍﻿]/g,'').trim();
$('#app').addEventListener('input',e=>{const i=e.target;if(i.dataset.l) LINKS[i.dataset.l][+i.dataset.i]=i.value;});
$('#app').addEventListener('change',e=>{const i=e.target;if(/^fi[AB]$/.test(i.id||'')){const fs=[...i.files];i.value='';uploadFiles(i.id[2],fs);}});
$('#app').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!A) return;
  const sp=k=>b.dataset[k].split(','),pl=(p,i)=>[p,+i];
  if(b.dataset.pick){$('#fi'+b.dataset.pick).click();}
  else if(b.dataset.add){LINKS[b.dataset.add].push('');drawPart(b.dataset.add);}
  else if(b.dataset.rm){const [p,i]=pl(...sp('rm'));LINKS[p].splice(i,1);if(!LINKS[p].length)LINKS[p]=[''];drawPart(p);}
  else if(b.dataset.up){const [p,i]=pl(...sp('up'));[LINKS[p][i-1],LINKS[p][i]]=[LINKS[p][i],LINKS[p][i-1]];drawPart(p);}
  else if(b.dataset.dn){const [p,i]=pl(...sp('dn'));[LINKS[p][i+1],LINKS[p][i]]=[LINKS[p][i],LINKS[p][i+1]];drawPart(p);}
  else if(b.dataset.del){const [p,i]=pl(...sp('del'));
    if(!confirm('Remove file '+(i+1)+' from what sir receives?')) return;
    act(b,async()=>{await saveSub(p,S[p].links.filter((_,k)=>k!==i));drawPart(p);},'File removed.');}
  else if(b.dataset.paper){
    const p=b.dataset.paper;
    act(b,async()=>{let d;
      try{d=await FB.getDoc(D('cp',CUR.id,'papers',`${A.session}_${p}_${A.medium}`));}
      catch(x){stop(/permission/.test(x.code||'')?'The paper opens at '+fmtT(p==='A'?A.openA:A.openB)+'.':'Could not open. Check your internet.');}
      if(!d.exists()) stop('The paper is not uploaded yet. Tell sir on Zoom.');
      window.open(d.data().link,'_blank','noopener');});
  }
  else if(b.dataset.send){
    const p=b.dataset.send;
    act(b,async()=>{const links=LINKS[p].map(tidy).filter(Boolean);
      if(!links.length) stop('Paste the link to your answer file first.');
      const bad=links.find(l=>!/^https?:\/\/\S+$/i.test(l));if(bad) stop('This is not a link: '+bad.slice(0,60));
      if(links.length>20) stop('At most 20 links — put the pages into one PDF.');
      await saveSub(p,links);FRESH[p]=true;drawPart(p);},'✓ Sent! Sir has your answer sheet.');
  }
});

/* marks, as soon as sir sends them */
function drawResult(){
  const r=R,c=CUR,B={gold:['🥇','Gold badge'],silver:['🥈','Silver badge'],bronze:['🥉','Bronze badge']}[r.badge],two=twoParts(c);
  const note=r.note||(A&&A.feedback)||'';
  $('#body').innerHTML=`<div class="card cp"><div class="k">Your marks</div>
    ${r.absent?'<h3>You were marked absent for this checkpoint.</h3><p class="muted">Talk to sir if this is wrong.</p>':`
    <div class="res"><div><b>${r.total}/${r.max}</b><span class="muted">Total</span></div><div><b>${r.pct}%</b><span class="muted">Score</span></div>
      <div><b>${r.rank?'#'+r.rank:'—'}</b><span class="muted">of ${r.of}${r.of>1?' so far':''}</span></div><div><b>+${r.coins}</b><span class="muted">coins</span></div></div>
    <div class="tl"><b>${esc(c.secA.title)}</b><span>${r.a} / ${c.secA.marks}</span><span></span>${two&&r.b!=null?`<b>${esc(c.secB.title)}</b><span>${r.b} / ${c.secB.marks}</span><span></span>`:''}</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px">
      ${B?`<div style="text-align:center"><div class="badge">${B[0]}</div><b>${B[1]}</b></div>`:''}
      ${r.trophy?`<div style="text-align:center"><div class="badge">🏆</div><b>${r.trophy} place</b></div>`:''}
      ${!B&&!r.trophy?'<p class="muted">Keep going — the next checkpoint is another chance at a badge.</p>':''}</div>`}
    ${r.sheet?`<div style="margin-top:14px"><a class="btn b1" href="${esc(r.sheet)}" target="_blank" rel="noopener">📝 See your marked answer sheet</a></div>`:''}
    ${note?`<h3>Note from sir</h3><p class="note" style="white-space:pre-line">${esc(note)}</p>`:''}
    <p class="muted">Your place can move while sir marks the others. Your result is also in My Marks and the Hall of Fame on the study plan.</p></div>`;
}
boot();
