<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Checkpoint Manager · EICT</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#070B1C;--panel2:#0a1029;--wire:rgba(142,164,255,.2);--paper:#E9EDFF;--dim:#9AA3D6;--gold:#FFC24B;--cyan:#38E1FF;--ok:#35E08F;--bad:#FF4D6D}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 20% 0%,#16245a 0,transparent 55%),var(--ink);color:var(--paper);font:15px/1.55 'Nunito','Noto Sans Sinhala',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:23px;margin:0;flex:1;min-width:220px}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:16px 0 8px}
a{color:var(--cyan)}
.card{background:linear-gradient(160deg,#121b44,#0b1230);border:1px solid var(--wire);border-radius:16px;padding:16px;margin:12px 0}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3d2600;font-weight:900;font-size:14px;margin-right:6px}

/* buttons, and what they do when pressed */
button,.btn{font:inherit;font-weight:800;border:1px solid var(--wire);background:#18245a;color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;
  position:relative;transition:transform .12s,filter .15s,background .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:hover,.btn:hover{filter:brightness(1.18)}
button:active:not(:disabled),.btn:active{transform:scale(.95)}
button:disabled{opacity:.45;cursor:not-allowed}
.gold{background:linear-gradient(#ffe18a,#ffb52e);color:#3d2600;border-color:#fff6}
.cyan{background:linear-gradient(#5feaff,#1aa9d6);color:#03222c;border-color:#fff6}
.green{background:linear-gradient(#6ff5ad,#1fb36a);color:#03281a;border-color:#fff6}
.danger{background:#5e1430;border-color:#ff7a9a66}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:13px}
button.busy{pointer-events:none;opacity:.85}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite;vertical-align:-3px}
.gold .spin,.green .spin,.cyan .spin{border-color:rgba(0,0,0,.18);border-top-color:#3d2600}
button.did{background:linear-gradient(#6ff5ad,#1fb36a)!important;color:#03281a!important}
@keyframes spin{to{transform:rotate(360deg)}}
button.did{animation:did .9s ease-out}
@keyframes did{0%{box-shadow:0 0 0 0 rgba(53,224,143,.9);filter:brightness(1.4)}100%{box-shadow:0 0 0 16px rgba(53,224,143,0);filter:none}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

input,select,textarea{font:inherit;background:#0a1029;color:var(--paper);border:1px solid var(--wire);border-radius:9px;padding:9px 11px;max-width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,255,.18)}
input.bad{border-color:var(--bad);box-shadow:0 0 0 3px rgba(255,77,109,.2)}
textarea{width:100%;min-height:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:800;color:var(--dim)}
label.f input,label.f select,label.f textarea{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--dim);font-size:13px}
.hide{display:none!important}
.ok{color:var(--ok)}.bad-t{color:var(--bad)}.warn{color:var(--gold)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:99px;background:#1b2550;color:#c9d4ff;white-space:nowrap}

/* tick boxes that show they were ticked */
.pick{position:relative;display:flex;gap:10px;align-items:center;background:var(--panel2);border:1.5px solid var(--wire);padding:9px 11px;border-radius:11px;cursor:pointer;font-weight:700;font-size:14px;
  transition:background .25s,border-color .25s,transform .12s;user-select:none}
.pick:active{transform:scale(.97)}
.pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pick .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #5b67a8;display:grid;place-items:center;transition:background .2s,border-color .2s}
.pick .box::after{content:'';width:6px;height:11px;border:solid #3d2600;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .2s}
.pick.on{background:rgba(255,194,75,.14);border-color:var(--gold)}
.pick.on .box{background:var(--gold);border-color:var(--gold);animation:pop .35s}
.pick.on .box::after{transform:rotate(45deg) scale(1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.pick .t{flex:1;min-width:0}.pick small{display:block;color:var(--dim);font-weight:600;font-size:12px}
.pick.big{padding:12px 14px;font-size:15px}
.picks{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.count{display:inline-block;font-weight:900;color:var(--gold);transition:transform .2s}
.count.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.5)}}
.seg{display:inline-flex;border:1px solid var(--wire);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;font-size:12.5px;background:transparent;color:var(--dim)}
.seg button.on{background:#2a3a7a;color:#fff}

/* paper list */
.cps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cpc{background:var(--panel2);border:1.5px solid var(--wire);border-radius:14px;padding:13px;text-align:left;color:var(--paper);display:block;width:100%}
.cpc:hover{border-color:var(--gold)}
.cpc .n{font-size:12px;font-weight:900;color:var(--gold);letter-spacing:.12em}
.cpc b{display:block;font-size:16.5px;margin:2px 0}
.pill{display:inline-block;font-size:11.5px;font-weight:900;padding:2px 9px;border-radius:99px;background:#2a3a7a;color:#dfe6ff;letter-spacing:.3px}
.pill.draft{background:#3a3f5c}.pill.up{background:#127a8a}.pill.live{background:#b8322e;animation:glow 1.4s infinite}.pill.mark{background:#8a5a12}.pill.done{background:#147a42}.pill.stop{background:#7a1838}
@keyframes glow{50%{box-shadow:0 0 12px rgba(255,90,90,.9)}}
.badge-n{display:inline-block;background:var(--bad);color:#fff;font-weight:900;border-radius:99px;padding:0 8px;font-size:12px;margin-left:6px;animation:pop .4s}

/* summary */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}
.sum div{background:var(--panel2);border:1px solid var(--wire);border-radius:11px;padding:10px 12px;font-size:14px}
.sum b{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

/* answer sheets, like the weekly papers */
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filt button{background:transparent;color:var(--dim)}
.filt button.on{background:#2a3a7a;color:#fff;border-color:#8ea4ff66}
.jw{background:var(--panel2);border:1.5px solid var(--wire);border-radius:14px;padding:12px;margin:8px 0;transition:border-color .3s}
.jw.new{animation:arrive 2.4s ease-out;border-color:var(--cyan)}
@keyframes arrive{0%{box-shadow:0 0 0 0 rgba(56,225,255,.9);transform:translateY(-6px)}20%{transform:none}100%{box-shadow:0 0 0 18px rgba(56,225,255,0)}}
.jw.sent{border-color:rgba(53,224,143,.45)}
.jw-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#2a8cff,#38E1FF);color:#04202B;flex:none}
.jw-n{flex:1;min-width:150px}.jw-n b{display:block}.jw-n span{color:var(--dim);font-size:12.5px}
.jw-t{font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:99px;letter-spacing:.04em}
.jw-t.on{background:rgba(53,224,143,.15);color:var(--ok)}.jw-t.late{background:rgba(255,194,75,.15);color:var(--gold)}.jw-t.none{background:rgba(255,77,109,.13);color:var(--bad)}
.files{display:flex;gap:6px 14px;flex-wrap:wrap;margin:8px 0 2px;font-size:13.5px}
.files a{background:#16224f;border:1px solid var(--wire);border-radius:8px;padding:4px 9px;text-decoration:none;font-weight:800}
.jw-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px;align-items:end}
.jw-b .wide{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.jw-b .wide input{flex:1;min-width:200px}
.mk{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--dim)}
.mk input{width:80px;font-size:17px;font-weight:900;text-align:center}
.tot{font-weight:900;font-size:17px;color:var(--gold)}
.jw-done{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--ok);font-weight:800}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px;border-bottom:1px solid #ffffff14;vertical-align:top}
th{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.tblw{overflow-x:auto}
.gate{max-width:380px;margin:60px auto;text-align:center}.gate input{width:100%;margin:6px 0}
.foot{position:sticky;bottom:10px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;background:#0b1230f2;border:1px solid var(--wire);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);margin-top:12px}
.tl{background:#0a1029;border:1px dashed #8ea4ff55;border-radius:10px;padding:9px 12px;font-size:13.5px;margin-top:10px}
details summary{cursor:pointer;font-weight:800;color:var(--dim);padding:6px 0}
pre.code{background:#050817;border:1px solid var(--wire);border-radius:10px;padding:12px;max-height:260px;overflow:auto;font-size:12px;white-space:pre-wrap}
ol.how li{margin:5px 0}

/* toast and the sent pop */
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,30px);opacity:0;background:#111a42;border:1.5px solid var(--cyan);border-radius:12px;padding:11px 18px;font-weight:800;z-index:50;max-width:92vw;text-align:center;transition:transform .3s,opacity .3s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}
.sentpop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#0d1a3a;border:2px solid var(--ok);border-radius:20px;padding:22px 30px;text-align:center;z-index:60;transition:all .35s cubic-bezier(.2,1.6,.4,1);box-shadow:0 20px 60px #000a}
.sentpop.go{transform:translate(-50%,-50%) scale(1);opacity:1}
.sentpop b{display:block;font-size:19px;margin-top:8px}.sentpop span{color:var(--dim)}
.sentpop svg{width:64px;height:64px}.sentpop path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:5px;animation:glow2 1.6s infinite}
@keyframes glow2{50%{box-shadow:0 0 0 5px rgba(53,224,143,.25)}}
@media(max-width:600px){.foot{justify-content:stretch}.foot button{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏁 Checkpoint Papers</h1>
    <a class="btn" href="./" target="_blank">Student view ↗</a>
    <a class="btn" href="../Admin.html">Admin</a>
    <button id="outBtn" class="hide">Sign out</button>
  </header>

  <section class="card gate" id="gate">
    <h2>Teacher sign in</h2>
    <p class="muted">The same account you use for Admin.</p>
    <form id="gform"><input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="gold" style="width:100%;margin-top:6px">Sign in</button></form>
    <p class="warn" id="gerr" style="font-weight:800"></p>
  </section>

  <main id="app" class="hide">
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">Your checkpoint papers</h2>
        <span class="row"><button id="bDrive" class="small"></button><button id="bNew" class="gold">➕ Add a checkpoint paper</button></span></div>
      <div class="cps" id="cpList" style="margin-top:12px"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../firebase-config.js"></script>
<script src="../press.js" defer></script>
<script type="module">
/* ============================================================
   Checkpoint Manager.
   1. Add a paper: name, date and time, Zoom link, the question
      papers and who sits it. Publish → students see it.
   2. Answer sheets arrive by themselves (students upload from
      CamScanner straight into your Drive) — enter the marks, the
      marked sheet and a note, and send. The ranking, badges and
      coins update for everyone at once.

   Firestore (rules in firestore-rules.txt):
     cp/_settings            the Drive upload link
     cp/{id}                 the paper (students read it)
     cp/{id}/assign/{uid}    each student's Zoom link and exact times
     cp/{id}/papers/S1_{A|B}_{si|en}  question paper, opens at its time
     cp/{id}/subs/{uid}_{A|B} the student's answer files
     cp/{id}/grade/{uid}     marks, marked sheet, note (yours)
     cp/{id}/grade/_private  Zoom link and each student's medium
     marks/{code}.cp.{id}    what the student sees (My Marks, Hall of Fame)
   All times are Sri Lanka time (UTC+5:30).
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OWNER='ushithasamudaya@gmail.com';
const SL=5.5*3600e3;
const ms=t=>t&&t.toMillis?t.toMillis():t&&t.seconds!=null?t.seconds*1e3:t instanceof Date?t.getTime():+t||0;
const toInput=t=>{const v=ms(t);return v?new Date(v+SL).toISOString().slice(0,16):'';};
const fromInput=v=>v?Date.parse(v+':00Z')-SL:0;
const fmt=(t,o)=>t?new Date(ms(t)).toLocaleString('en-GB',Object.assign({timeZone:'Asia/Colombo',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'},o||{})):'—';
const fmtT=t=>t?new Date(ms(t)).toLocaleTimeString('en-GB',{timeZone:'Asia/Colombo',hour:'numeric',minute:'2-digit'}):'—';
const BATCHES=[['AL-27','2027 A/L · English medium'],['AL-27-SI','2027 A/L · Sinhala medium'],['AL-28','2028 A/L']];
const FIXED={'AL-27':'en','AL-27-SI':'si'};
const MEDN={si:'Sinhala',en:'English'};
const WEEKS=[8,16,24,32,36];
const BADGE={gold:'🥇 Gold',silver:'🥈 Silver',bronze:'🥉 Bronze'};

let FB=null,db=null,auth=null,STU={},CPS=[],SET={},CUR=null,VIEW='';
let ASG={},SUBS={},GRADE={},PRIV={zoom:{},plan:{}},LOG=[],FILT='',FILTU=false,NEWU=new Set(),stopSubs=null,pendingDraw=false;
const DRAFT={};

/* ---------- feedback ---------- */
let tt;
function toast(t,k){const e=$('#toast');e.textContent=t;e.className='toast on '+(k||'');clearTimeout(tt);tt=setTimeout(()=>e.className='toast '+(k||''),3200);}
/* runs a button's job: spinner while it works, a green pulse when done, a shake and the reason if not */
async function act(btn,fn,okText){
  if(btn&&btn.classList.contains('busy')) return;
  const html=btn&&btn.innerHTML;
  if(btn){btn.style.minWidth=btn.offsetWidth+'px';btn.classList.add('busy');btn.innerHTML='<span class="spin"></span> Working…';}
  const back=()=>{if(btn){btn.classList.remove('busy','did');btn.innerHTML=html;btn.style.minWidth='';}};
  try{
    const r=await fn();
    if(btn&&r!==false&&btn.isConnected){btn.classList.remove('busy');btn.classList.add('did');btn.innerHTML='✓ Done';setTimeout(back,1300);}
    else back();
    if(r!==false&&okText) toast(okText,'ok');
    return r;
  }catch(e){
    back();
    if(btn){btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');}
    toast(e.user?e.message:'Could not do that: '+(e.code||e.message)+(/permission/.test(e.code||'')?' — publish firestore-rules.txt in the Firebase console.':''),'bad');
  }
}
const stop=(m,el)=>{if(el){el.classList.add('bad');el.focus();setTimeout(()=>el.classList.remove('bad'),1800);}const e=new Error(m);e.user=1;throw e;};
function sentPop(name,line){
  const b=document.createElement('div');b.className='sentpop';
  b.innerHTML='<svg viewBox="0 0 48 48"><path d="M13 25l8 8 16-17"/></svg><b>'+esc(name)+'</b><span>'+esc(line)+'</span>';
  document.body.appendChild(b);requestAnimationFrame(()=>b.classList.add('go'));
  setTimeout(()=>{b.classList.remove('go');setTimeout(()=>b.remove(),400);},1900);
}

/* ---------- firebase ---------- */
async function boot(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.projectId){$('#gerr').textContent='firebase-config.js is missing.';return;}
  const G='https://www.gstatic.com/firebasejs/11.0.2/firebase-';
  try{
    const [A,F,Au]=await Promise.all([import(G+'app.js'),import(G+'firestore.js'),import(G+'auth.js')]);
    const app=A.initializeApp(cfg);FB={...F,...Au};db=F.getFirestore(app);auth=Au.getAuth(app);
    try{await Au.setPersistence(auth,Au.browserLocalPersistence);}catch(e){}
  }catch(e){$('#gerr').textContent='Cannot reach the database. Check your internet.';return;}
  FB.onAuthStateChanged(auth,async u=>{
    if(!u){$('#gate').classList.remove('hide');$('#app').classList.add('hide');$('#outBtn').classList.add('hide');return;}
    if(u.email!==OWNER){$('#gerr').textContent='This page is for the teacher account only.';await FB.signOut(auth);return;}
    $('#gerr').textContent='Loading…';
    try{await Promise.all([loadStudents(),loadList()]);}
    catch(e){$('#gerr').textContent='Could not load: '+(e.code||e.message)+(/permission/.test(e.code||'')?' — publish firestore-rules.txt in the Firebase console first.':'');return;}
    $('#gerr').textContent='';$('#gate').classList.add('hide');$('#app').classList.remove('hide');$('#outBtn').classList.remove('hide');
    const want=location.hash.slice(1);
    if(want==='drive') showDrive(); else if(want&&CPS.find(c=>c.id===want)) openPaper(want);
  });
}
$('#gform').onsubmit=async e=>{e.preventDefault();if(!FB){$('#gerr').textContent='Still connecting…';return;}
  const b=e.submitter||$('#gform button');
  await act(b,async()=>{try{await FB.signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value);}
    catch(x){stop(/invalid|wrong|not-found/.test(x.code||'')?'Wrong email or password.':(x.code||x.message));}});};
$('#outBtn').onclick=()=>FB.signOut(auth);
const D=(...p)=>FB.doc(db,...p), C=(...p)=>FB.collection(db,...p);
async function logIt(what){try{await FB.addDoc(C('cp',CUR.id,'log'),{what,at:FB.serverTimestamp()});LOG.unshift({what,at:Date.now()});}catch(e){}}

async function loadStudents(){
  STU={};const s=await FB.getDocs(C('students'));
  s.forEach(d=>{const v=d.data();STU[d.id]={uid:d.id,name:v.name||'(no name)',code:v.code||'',batch:v.batch||'',track:v.track||'',whatsapp:v.whatsapp||''};});
}
async function loadList(){
  const s=await FB.getDocs(C('cp'));SET={};
  CPS=[];s.forEach(d=>{if(d.id==='_settings')SET=d.data();else CPS.push({id:d.id,...d.data()});});
  CPS.sort((a,b)=>(a.n||0)-(b.n||0)||ms(a.createdAt)-ms(b.createdAt));
  drawList();countWaiting();
}

/* ---------- times ---------- */
const startOf=c=>c.at||(c.sessions&&c.sessions[0]&&c.sessions[0].at)||null;
const twoParts=c=>!!(c.secB&&c.secB.on!==false);
function times(c){
  const a=ms(startOf(c));if(!a) return null;const M=60e3,g=(+c.graceMin||0)*M,endA=a+c.secA.min*M;
  if(!twoParts(c)) return {openA:a,endA,dueA:endA+g,openB:endA,endB:endA,dueB:endA+g};
  const openB=endA+(+c.breakMin||0)*M,endB=openB+c.secB.min*M;
  return {openA:a,endA,dueA:endA+g,openB,endB,dueB:endB+g};
}
function status(c){
  if(c.stage==='draft') return ['Draft — students cannot see it','draft'];
  if(c.stage==='postponed'||c.stage==='cancelled') return [c.stage==='postponed'?'Postponed':'Cancelled','stop'];
  const t=times(c),n=Date.now();
  if(!t||n<t.openA) return ['Upcoming','up'];
  if(n<=t.dueB) return ['● Live now','live'];
  return ['Marking','mark'];
}

/* ---------- ranking: worked out again after every mark sent ---------- */
function results(){
  const c=CUR,max=maxOf(c),bd=c.badges,cn=c.coins,two=twoParts(c);
  const rows=eligible(c).filter(s=>{const g=GRADE[s.uid];return g&&(g.sent||g.absent);}).map(s=>{const g=GRADE[s.uid],ab=!!g.absent;
    const tot=ab?0:(+g.a||0)+(two?(+g.b||0):0),pct=max?Math.round(1000*tot/max)/10:0;
    return {s,g,absent:ab,a:ab?null:+g.a,b:ab||!two?null:+g.b,total:tot,pct,badge:ab?'':pct>=bd.gold?'gold':pct>=bd.silver?'silver':pct>=bd.bronze?'bronze':''};});
  const ranked=rows.filter(r=>!r.absent).sort((x,y)=>y.total-x.total||x.s.name.localeCompare(y.s.name));
  ranked.forEach((r,i)=>{r.rank=i&&r.total===ranked[i-1].total?ranked[i-1].rank:i+1;});   /* ties share a place: 1, 2, 2, 4 */
  rows.forEach(r=>{r.trophy=r.rank===1?'1st':r.rank===2?'2nd':r.rank===3?'3rd':'';
    r.coins=r.absent?0:(+cn.part||0)+(+cn[r.badge]||0)+(r.rank===1?+cn.r1:r.rank===2?+cn.r2:r.rank===3?+cn.r3:0)||0;});
  return {rows,ranked,max,of:ranked.length};
}

      rank:r.rank||null,of,badge:r.badge,trophy:r.trophy,coins:r.coins,absent:r.absent,session:'A',medium:medOf(r.s),sheet:r.g.sheet||'',note:r.g.note||'',at:FB.serverTimestamp()}}}]);}
  for(let i=0;i<ops.length;i+=400){const b=FB.writeBatch(db);ops.slice(i,i+400).forEach(([ref,v])=>b.set(ref,v,{merge:true}));await b.commit();}
}

async function syncAssign(c){
  const t=times(c),el=eligible(c),T=v=>FB.Timestamp.fromMillis(v),ops=[],keep=new Set(el.map(s=>s.uid));
  const old=await FB.getDocs(C('cp',c.id,'assign'));const OLD={};old.forEach(d=>OLD[d.id]=d.data());
  for(const s of el){const o=OLD[s.uid],same=o&&ms(o.start)===t.openA,ext=same&&o.ext;
    ops.push(['set',D('cp',c.id,'assign',s.uid),{uid:s.uid,code:s.code,name:s.name,batch:s.batch,medium:medOf(s),session:'S1',label:'Your exam',
      start:T(t.openA),openA:T(t.openA),endA:T(t.endA),dueA:ext?o.dueA:T(t.dueA),openB:T(t.openB),endB:T(t.endB),dueB:ext?o.dueB:T(t.dueB),
      zoom:PRIV.zoom.S1||'',ack:same?!!o.ack:false,ackAt:same?(o.ackAt||null):null,ext:!!ext,feedback:'',publishedAt:FB.serverTimestamp()}]);}
  for(const u in OLD) if(!keep.has(u)) ops.push(['del',D('cp',c.id,'assign',u)]);
  for(let i=0;i<ops.length;i+=400){const b=FB.writeBatch(db);ops.slice(i,i+400).forEach(([k,r,v])=>k==='del'?b.delete(r):b.set(r,v));await b.commit();}
  ASG={};const a=await FB.getDocs(C('cp',c.id,'assign'));a.forEach(d=>ASG[d.id]=d.data());
}

  $('#dCopy').onclick=e=>act(e.currentTarget,async()=>{try{await navigator.clipboard.writeText(code);}catch(x){const t=document.createElement('textarea');t.value=code;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}},'📋 Copied. Paste it into script.google.com');
  $('#dSave').onclick=e=>act(e.currentTarget,async()=>{const u=$('#dUrl').value.trim();
    if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)) stop('That is not a web app URL. It looks like https://script.google.com/macros/s/…/exec',$('#dUrl'));
    await FB.setDoc(D('cp','_settings'),{uploadUrl:u,updatedAt:FB.serverTimestamp()},{merge:true});SET.uploadUrl=u;drawList();},'💾 Saved.');
  $('#dTest').onclick=e=>act(e.currentTarget,async()=>{const u=$('#dUrl').value.trim()||stop('Paste the web app URL first.',$('#dUrl'));
    let j;try{j=await (await fetch(u)).json();}catch(x){stop('No answer from that URL. Check “Who has access: Anyone” and that you copied the /exec link.');}
    if(!j||j.app!=='eict-cp-upload') stop('That URL answered, but it is not the EICT upload script.');
    $('#dOut').innerHTML='<span class="ok">✓ Working.</span> Answer sheets go to <a href="'+esc(j.folder)+'" target="_blank" rel="noopener">this folder in your Drive ↗</a>';},'🔌 The upload is working.');
}
/* a file into your Drive through the upload script; returns its link */
async function upload(file,meta){
  if(!SET.uploadUrl) stop('Set up the Drive upload first.');
  if(file.size>20*1048576) stop('That file is over 20 MB.');
  const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(file);});
  const token=await auth.currentUser.getIdToken();
  const res=await fetch(SET.uploadUrl,{method:'POST',body:JSON.stringify({token,cp:CUR.id,mime:file.type||'application/pdf',data,...meta})});
  const j=await res.json();
  if(!j.ok) stop('Upload refused: '+j.error);
  return j.url;
}

window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='drive'&&VIEW!=='drive') showDrive();else if(h&&h!=='drive'&&(!CUR||CUR.id!==h)&&CPS.find(c=>c.id===h)) openPaper(h);});
boot();
</script>
