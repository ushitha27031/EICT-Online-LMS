<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Checkpoint Manager · EICT</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#070B1C;--panel2:#0a1029;--wire:rgba(142,164,255,.2);--paper:#E9EDFF;--dim:#9AA3D6;--gold:#FFC24B;--cyan:#38E1FF;--ok:#35E08F;--bad:#FF4D6D}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 20% 0%,#16245a 0,transparent 55%),var(--ink);color:var(--paper);font:15px/1.55 'Nunito','Noto Sans Sinhala',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 90px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:23px;margin:0;flex:1;min-width:220px}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px;margin:16px 0 8px}
a{color:var(--cyan)}
.card{background:linear-gradient(160deg,#121b44,#0b1230);border:1px solid var(--wire);border-radius:16px;padding:16px;margin:12px 0}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3d2600;font-weight:900;font-size:14px;margin-right:6px}

/* buttons, and what they do when pressed */
button,.btn{font:inherit;font-weight:800;border:1px solid var(--wire);background:#18245a;color:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center;
  position:relative;transition:transform .12s,filter .15s,background .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
button:hover,.btn:hover{filter:brightness(1.18)}
button:active:not(:disabled),.btn:active{transform:scale(.95)}
button:disabled{opacity:.45;cursor:not-allowed}
.gold{background:linear-gradient(#ffe18a,#ffb52e);color:#3d2600;border-color:#fff6}
.cyan{background:linear-gradient(#5feaff,#1aa9d6);color:#03222c;border-color:#fff6}
.green{background:linear-gradient(#6ff5ad,#1fb36a);color:#03281a;border-color:#fff6}
.danger{background:#5e1430;border-color:#ff7a9a66}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:13px}
button.busy{pointer-events:none;opacity:.85}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .7s linear infinite;vertical-align:-3px}
.gold .spin,.green .spin,.cyan .spin{border-color:rgba(0,0,0,.18);border-top-color:#3d2600}
button.did{background:linear-gradient(#6ff5ad,#1fb36a)!important;color:#03281a!important}
@keyframes spin{to{transform:rotate(360deg)}}
button.did{animation:did .9s ease-out}
@keyframes did{0%{box-shadow:0 0 0 0 rgba(53,224,143,.9);filter:brightness(1.4)}100%{box-shadow:0 0 0 16px rgba(53,224,143,0);filter:none}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

input,select,textarea{font:inherit;background:#0a1029;color:var(--paper);border:1px solid var(--wire);border-radius:9px;padding:9px 11px;max-width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(56,225,255,.18)}
input.bad{border-color:var(--bad);box-shadow:0 0 0 3px rgba(255,77,109,.2)}
textarea{width:100%;min-height:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:800;color:var(--dim)}
label.f input,label.f select,label.f textarea{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--dim);font-size:13px}
.hide{display:none!important}
.ok{color:var(--ok)}.bad-t{color:var(--bad)}.warn{color:var(--gold)}
.tag{font-size:11.5px;padding:1px 7px;border-radius:99px;background:#1b2550;color:#c9d4ff;white-space:nowrap}

/* tick boxes that show they were ticked */
.pick{position:relative;display:flex;gap:10px;align-items:center;background:var(--panel2);border:1.5px solid var(--wire);padding:9px 11px;border-radius:11px;cursor:pointer;font-weight:700;font-size:14px;
  transition:background .25s,border-color .25s,transform .12s;user-select:none}
.pick:active{transform:scale(.97)}
.pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pick .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #5b67a8;display:grid;place-items:center;transition:background .2s,border-color .2s}
.pick .box::after{content:'';width:6px;height:11px;border:solid #3d2600;border-width:0 3px 3px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .2s}
.pick.on{background:rgba(255,194,75,.14);border-color:var(--gold)}
.pick.on .box{background:var(--gold);border-color:var(--gold);animation:pop .35s}
.pick.on .box::after{transform:rotate(45deg) scale(1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.pick .t{flex:1;min-width:0}.pick small{display:block;color:var(--dim);font-weight:600;font-size:12px}
.pick.big{padding:12px 14px;font-size:15px}
.picks{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.count{display:inline-block;font-weight:900;color:var(--gold);transition:transform .2s}
.count.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.5)}}
.seg{display:inline-flex;border:1px solid var(--wire);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;font-size:12.5px;background:transparent;color:var(--dim)}
.seg button.on{background:#2a3a7a;color:#fff}

/* paper list */
.cps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cpc{background:var(--panel2);border:1.5px solid var(--wire);border-radius:14px;padding:13px;text-align:left;color:var(--paper);display:block;width:100%}
.cpc:hover{border-color:var(--gold)}
.cpc .n{font-size:12px;font-weight:900;color:var(--gold);letter-spacing:.12em}
.cpc b{display:block;font-size:16.5px;margin:2px 0}
.pill{display:inline-block;font-size:11.5px;font-weight:900;padding:2px 9px;border-radius:99px;background:#2a3a7a;color:#dfe6ff;letter-spacing:.3px}
.pill.draft{background:#3a3f5c}.pill.up{background:#127a8a}.pill.live{background:#b8322e;animation:glow 1.4s infinite}.pill.mark{background:#8a5a12}.pill.done{background:#147a42}.pill.stop{background:#7a1838}
@keyframes glow{50%{box-shadow:0 0 12px rgba(255,90,90,.9)}}
.badge-n{display:inline-block;background:var(--bad);color:#fff;font-weight:900;border-radius:99px;padding:0 8px;font-size:12px;margin-left:6px;animation:pop .4s}

/* summary */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}
.sum div{background:var(--panel2);border:1px solid var(--wire);border-radius:11px;padding:10px 12px;font-size:14px}
.sum b{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

/* answer sheets, like the weekly papers */
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filt button{background:transparent;color:var(--dim)}
.filt button.on{background:#2a3a7a;color:#fff;border-color:#8ea4ff66}
.jw{background:var(--panel2);border:1.5px solid var(--wire);border-radius:14px;padding:12px;margin:8px 0;transition:border-color .3s}
.jw.new{animation:arrive 2.4s ease-out;border-color:var(--cyan)}
@keyframes arrive{0%{box-shadow:0 0 0 0 rgba(56,225,255,.9);transform:translateY(-6px)}20%{transform:none}100%{box-shadow:0 0 0 18px rgba(56,225,255,0)}}
.jw.sent{border-color:rgba(53,224,143,.45)}
.jw-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#2a8cff,#38E1FF);color:#04202B;flex:none}
.jw-n{flex:1;min-width:150px}.jw-n b{display:block}.jw-n span{color:var(--dim);font-size:12.5px}
.jw-t{font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:99px;letter-spacing:.04em}
.jw-t.on{background:rgba(53,224,143,.15);color:var(--ok)}.jw-t.late{background:rgba(255,194,75,.15);color:var(--gold)}.jw-t.none{background:rgba(255,77,109,.13);color:var(--bad)}
.files{display:flex;gap:6px 14px;flex-wrap:wrap;margin:8px 0 2px;font-size:13.5px}
.files a{background:#16224f;border:1px solid var(--wire);border-radius:8px;padding:4px 9px;text-decoration:none;font-weight:800}
.jw-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px;align-items:end}
.jw-b .wide{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.jw-b .wide input{flex:1;min-width:200px}
.mk{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--dim)}
.mk input{width:80px;font-size:17px;font-weight:900;text-align:center}
.tot{font-weight:900;font-size:17px;color:var(--gold)}
.jw-done{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--ok);font-weight:800}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px;border-bottom:1px solid #ffffff14;vertical-align:top}
th{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.tblw{overflow-x:auto}
.gate{max-width:380px;margin:60px auto;text-align:center}.gate input{width:100%;margin:6px 0}
.foot{position:sticky;bottom:10px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;background:#0b1230f2;border:1px solid var(--wire);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);margin-top:12px}
.tl{background:#0a1029;border:1px dashed #8ea4ff55;border-radius:10px;padding:9px 12px;font-size:13.5px;margin-top:10px}
details summary{cursor:pointer;font-weight:800;color:var(--dim);padding:6px 0}
pre.code{background:#050817;border:1px solid var(--wire);border-radius:10px;padding:12px;max-height:260px;overflow:auto;font-size:12px;white-space:pre-wrap}
ol.how li{margin:5px 0}

/* toast and the sent pop */
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,30px);opacity:0;background:#111a42;border:1.5px solid var(--cyan);border-radius:12px;padding:11px 18px;font-weight:800;z-index:50;max-width:92vw;text-align:center;transition:transform .3s,opacity .3s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}
.sentpop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:#0d1a3a;border:2px solid var(--ok);border-radius:20px;padding:22px 30px;text-align:center;z-index:60;transition:all .35s cubic-bezier(.2,1.6,.4,1);box-shadow:0 20px 60px #000a}
.sentpop.go{transform:translate(-50%,-50%) scale(1);opacity:1}
.sentpop b{display:block;font-size:19px;margin-top:8px}.sentpop span{color:var(--dim)}
.sentpop svg{width:64px;height:64px}.sentpop path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sit{background:var(--panel2);border:1.5px solid var(--wire);border-radius:14px;padding:12px;margin:8px 0}
.sit-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sit-h b{font-size:16px}
.sit-w{font-size:13.5px;color:var(--dim);margin-top:6px}
.sit-ed{border:1.5px dashed var(--gold);border-radius:14px;padding:14px;margin-top:12px;background:rgba(255,194,75,.05)}
.pill.done{background:#147a42}
.chipf{display:inline-block;font-size:11.5px;font-weight:900;padding:2px 8px;border-radius:99px;background:#2a3a7a;color:#dfe6ff;margin-left:6px}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:5px;animation:glow2 1.6s infinite}
@keyframes glow2{50%{box-shadow:0 0 0 5px rgba(53,224,143,.25)}}
@media(max-width:600px){.foot{justify-content:stretch}.foot button{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏁 Checkpoint Papers</h1>
    <a class="btn" href="./" target="_blank">Student view ↗</a>
    <a class="btn" href="../Admin.html">Admin</a>
    <button id="outBtn" class="hide">Sign out</button>
  </header>

  <section class="card gate" id="gate">
    <h2>Teacher sign in</h2>
    <p class="muted">The same account you use for Admin.</p>
    <form id="gform"><input id="em" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="gold" style="width:100%;margin-top:6px">Sign in</button></form>
    <p class="warn" id="gerr" style="font-weight:800"></p>
  </section>

  <main id="app" class="hide">
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">Your checkpoint papers</h2>
        <span class="row"><button id="bDrive" class="small"></button><button id="bNew" class="gold">➕ Add a checkpoint paper</button></span></div>
      <div class="cps" id="cpList" style="margin-top:12px"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../firebase-config.js"></script>
<script src="../press.js" defer></script>
<script type="module">
/* ============================================================
   Checkpoint Manager.
   1. Add a paper: name, timetable, Zoom link, the question papers
      (or printed ones) and who sits it.
   2. Sittings: a date and the students who write on it → Save &
      activate; those students see their date and countdown. Add
      another sitting for another day.
   3. Answer sheets arrive by themselves (students upload from
      CamScanner straight into your Drive) — enter the marks, the
      marked sheet and a note, and send. The ranking, badges and
      coins update for everyone at once.

   Firestore (rules in firestore-rules.txt):
     cp/_settings            the Drive upload link
     cp/{id}                 the paper (students read it)
     cp/{id}/assign/{uid}    each student's Zoom link and exact times
     cp/{id}/papers/{sitting}_{A|B}_{si|en}  question paper, opens at its sitting's time
     cp/{id}/subs/{uid}_{A|B|C} the student's answer files (C: the essay, sent after part B)
     cp/{id}/grade/{uid}     marks, marked sheet, note (yours)
     cp/{id}/grade/_private  Zoom link, paper links, each student's sitting and medium
     marks/{code}.cp.{id}    what the student sees (My Marks, Hall of Fame)
   All times are Sri Lanka time (UTC+5:30).
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OWNER='ushithasamudaya@gmail.com';
const SL=5.5*3600e3;
const ms=t=>t&&t.toMillis?t.toMillis():t&&t.seconds!=null?t.seconds*1e3:t instanceof Date?t.getTime():+t||0;
const toInput=t=>{const v=ms(t);return v?new Date(v+SL).toISOString().slice(0,16):'';};
const fromInput=v=>v?Date.parse(v+':00Z')-SL:0;
const fmt=(t,o)=>t?new Date(ms(t)).toLocaleString('en-GB',Object.assign({timeZone:'Asia/Colombo',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'},o||{})):'—';
const fmtT=t=>t?new Date(ms(t)).toLocaleTimeString('en-GB',{timeZone:'Asia/Colombo',hour:'numeric',minute:'2-digit'}):'—';
const BATCHES=[['AL-27','2027 A/L · English medium'],['AL-27-SI','2027 A/L · Sinhala medium'],['AL-28','2028 A/L']];
const FIXED={'AL-27':'en','AL-27-SI':'si'};
const MEDN={si:'Sinhala',en:'English'};
const WEEKS=[8,16,24,32,36];
const BADGE={gold:'🥇 Gold',silver:'🥈 Silver',bronze:'🥉 Bronze'};

let FB=null,db=null,auth=null,STU={},CPS=[],SET={},CUR=null,VIEW='';
let ASG={},SUBS={},GRADE={},PRIV={zoom:{},plan:{}},LOG=[],FILT='',FILTU=false,NEWU=new Set(),stopSubs=null,pendingDraw=false;
const DRAFT={};

/* ---------- feedback ---------- */
let tt;
function toast(t,k){const e=$('#toast');e.textContent=t;e.className='toast on '+(k||'');clearTimeout(tt);tt=setTimeout(()=>e.className='toast '+(k||''),3200);}
/* runs a button's job: spinner while it works, a green pulse when done, a shake and the reason if not */
async function act(btn,fn,okText){
  if(btn&&btn.classList.contains('busy')) return;
  const html=btn&&btn.innerHTML;
  if(btn){btn.style.minWidth=btn.offsetWidth+'px';btn.classList.add('busy');btn.innerHTML='<span class="spin"></span> Working…';}
  const back=()=>{if(btn){btn.classList.remove('busy','did');btn.innerHTML=html;btn.style.minWidth='';}};
  try{
    const r=await fn();
    if(btn&&r!==false&&btn.isConnected){btn.classList.remove('busy');btn.classList.add('did');btn.innerHTML='✓ Done';setTimeout(back,1300);}
    else back();
    if(r!==false&&okText) toast(okText,'ok');
    return r;
  }catch(e){
    back();
    if(btn){btn.classList.remove('shake');void btn.offsetWidth;btn.classList.add('shake');}
    toast(e.user?e.message:'Could not do that: '+(e.code||e.message)+(/permission/.test(e.code||'')?' — publish firestore-rules.txt in the Firebase console.':''),'bad');
  }
}
const stop=(m,el)=>{if(el){el.classList.add('bad');el.focus();setTimeout(()=>el.classList.remove('bad'),1800);}const e=new Error(m);e.user=1;throw e;};
function sentPop(name,line){
  const b=document.createElement('div');b.className='sentpop';
  b.innerHTML='<svg viewBox="0 0 48 48"><path d="M13 25l8 8 16-17"/></svg><b>'+esc(name)+'</b><span>'+esc(line)+'</span>';
  document.body.appendChild(b);requestAnimationFrame(()=>b.classList.add('go'));
  setTimeout(()=>{b.classList.remove('go');setTimeout(()=>b.remove(),400);},1900);
}

/* ---------- firebase ---------- */
async function boot(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.projectId){$('#gerr').textContent='firebase-config.js is missing.';return;}
  const G='https://www.gstatic.com/firebasejs/11.0.2/firebase-';
  try{
    const [A,F,Au]=await Promise.all([import(G+'app.js'),import(G+'firestore.js'),import(G+'auth.js')]);
    const app=A.initializeApp(cfg);FB={...F,...Au};db=F.getFirestore(app);auth=Au.getAuth(app);
    try{await Au.setPersistence(auth,Au.browserLocalPersistence);}catch(e){}
  }catch(e){$('#gerr').textContent='Cannot reach the database. Check your internet.';return;}
  FB.onAuthStateChanged(auth,async u=>{
    if(!u){$('#gate').classList.remove('hide');$('#app').classList.add('hide');$('#outBtn').classList.add('hide');return;}
    if(u.email!==OWNER){$('#gerr').textContent='This page is for the teacher account only.';await FB.signOut(auth);return;}
    $('#gerr').textContent='Loading…';
    try{await Promise.all([loadStudents(),loadList()]);}
    catch(e){$('#gerr').textContent='Could not load: '+(e.code||e.message)+(/permission/.test(e.code||'')?' — publish firestore-rules.txt in the Firebase console first.':'');return;}
    $('#gerr').textContent='';$('#gate').classList.add('hide');$('#app').classList.remove('hide');$('#outBtn').classList.remove('hide');
    const want=location.hash.slice(1);
    if(want==='drive') showDrive(); else if(want&&CPS.find(c=>c.id===want)) openPaper(want);
  });
}
$('#gform').onsubmit=async e=>{e.preventDefault();if(!FB){$('#gerr').textContent='Still connecting…';return;}
  const b=e.submitter||$('#gform button');
  await act(b,async()=>{try{await FB.signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value);}
    catch(x){stop(/invalid|wrong|not-found/.test(x.code||'')?'Wrong email or password.':(x.code||x.message));}});};
$('#outBtn').onclick=()=>FB.signOut(auth);
const D=(...p)=>FB.doc(db,...p), C=(...p)=>FB.collection(db,...p);
async function logIt(what){try{await FB.addDoc(C('cp',CUR.id,'log'),{what,at:FB.serverTimestamp()});LOG.unshift({what,at:Date.now()});}catch(e){}}

async function loadStudents(){
  STU={};const s=await FB.getDocs(C('students'));
  s.forEach(d=>{const v=d.data();STU[d.id]={uid:d.id,name:v.name||'(no name)',code:v.code||'',batch:v.batch||'',track:v.track||'',whatsapp:v.whatsapp||''};});
}
async function loadList(){
  const s=await FB.getDocs(C('cp'));SET={};
  CPS=[];s.forEach(d=>{if(d.id==='_settings')SET=d.data();else CPS.push({id:d.id,...d.data()});});
  CPS.sort((a,b)=>(a.n||0)-(b.n||0)||ms(a.createdAt)-ms(b.createdAt));
  drawList();countWaiting();
}

/* ---------- times ---------- */
const startOf=c=>c.at||(c.sessions&&c.sessions[0]&&c.sessions[0].at)||null;
const twoParts=c=>!!(c.secB&&c.secB.on!==false);
/* a sitting is one day the paper is written, with the students who write it then.
   A paper from before sittings, with one date, has one sitting S1 for everyone. */
const sittingsOf=c=>(c.sittings&&c.sittings.length)?c.sittings:(startOf(c)?[{id:'S1',at:startOf(c),legacy:true}]:[]);
const sitOf=(c,uid)=>{const p=(PRIV.plan||{})[uid]||{},S=sittingsOf(c);
  if(p.s&&S.some(x=>x.id===p.s)) return p.s;
  return S.length===1&&S[0].legacy?'S1':'';};
const sitName=x=>x&&x.at?new Date(ms(x.at)).toLocaleDateString('en-GB',{timeZone:'Asia/Colombo',weekday:'long',day:'numeric',month:'long'}):'No date';
const sitShort=x=>x&&x.at?new Date(ms(x.at)).toLocaleDateString('en-GB',{timeZone:'Asia/Colombo',weekday:'short',day:'numeric',month:'short'}):'—';
const UPL={A:'MCQ answer sheet',B:'Structured questions (on the question paper)',C:'Essay (on separate sheets)'};
const upl=(c,k)=>(c.upl&&c.upl[k])||UPL[k];
const essayOn=c=>twoParts(c)&&c.essay!==false;
function times(c,sid){
  const S=sittingsOf(c),x=sid?S.find(y=>y.id===sid):S.slice().sort((p,q)=>ms(p.at)-ms(q.at))[0];
  const a=ms(x&&x.at);if(!a) return null;const M=60e3,g=(+c.graceMin||0)*M,endA=a+c.secA.min*M;
  if(!twoParts(c)) return {openA:a,endA,dueA:endA+g,openB:endA,endB:endA,dueB:endA+g};
  const openB=endA+(+c.breakMin||0)*M,endB=openB+c.secB.min*M;
  return {openA:a,endA,dueA:endA+g,openB,endB,dueB:endB+g};
}
function status(c){
  if(c.stage==='draft') return ['Draft — students cannot see it','draft'];
  if(c.stage==='postponed'||c.stage==='cancelled') return [c.stage==='postponed'?'Postponed':'Cancelled','stop'];
  const n=Date.now(),T=sittingsOf(c).map(x=>times(c,x.id)).filter(Boolean);
  if(!T.length) return ['No date yet','up'];
  if(T.some(t=>n>=t.openA&&n<=t.dueB)) return ['● Live now','live'];
  if(T.some(t=>n<t.openA)) return [T.some(t=>n>t.dueB)?'Next sitting coming':'Upcoming','up'];
  return ['Marking','mark'];
}
const maxOf=c=>(+c.secA.marks||0)+(twoParts(c)?(+c.secB.marks||0):0);

/* an older paper's single date becomes a real sitting the first time sittings change */
function realSittings(c){
  const S=sittingsOf(c).map(x=>({id:x.id,at:x.at}));
  if(!(c.sittings&&c.sittings.length)&&S.length) for(const s of eligible(c)){const p=PRIV.plan[s.uid]=PRIV.plan[s.uid]||{};if(!p.s) p.s='S1';}

async function saveSittings(S,what){
  const c=CUR,first=S.slice().sort((a,b)=>ms(a.at)-ms(b.at))[0],f={sittings:S,at:first?first.at:null,updatedAt:FB.serverTimestamp()};

  await FB.updateDoc(D('cp',c.id),f);Object.assign(c,{sittings:S,at:f.at},activate?{stage:'confirmed'}:{});
  await FB.setDoc(D('cp',c.id,'grade','_private'),PRIV);
  await writePapers(c);await syncAssign(c);
  logIt(what);SITED=null;showPaper();drawList();
}
async function saveSitting(){
  const c=CUR,at=fromInput(sitVal());
  if(!at) stop('Pick the date and start time.',$('#sitD'));
  if(!SITED.uids.size) stop('Tick the students who write on this day.');
  let S=realSittings(c);
  const id=SITED.id||('S'+(Math.max(0,...S.map(x=>+String(x.id).slice(1)||0))+1)),T=FB.Timestamp.fromMillis(at);
  S=SITED.id?S.map(x=>x.id===id?{id,at:T}:x):[...S,{id,at:T}];
  const moved=[...SITED.uids].filter(u=>{const p=(PRIV.plan||{})[u]||{};return p.s&&p.s!==id&&(SUBS[u+'_A']||SUBS[u+'_B']||SUBS[u+'_C']);});
  if(moved.length&&!confirm(moved.length+' of the ticked students already sent answers in another sitting. Move them anyway? Their answers stay.')) return false;
  if(c.stage==='draft'&&!confirm(`Activate “${c.title}”?\n${SITED.uids.size} students see ${sitName({at})} straight away, with a countdown on their study plan.`)) return false;
  for(const s of eligible(c)){const p=PRIV.plan[s.uid]=PRIV.plan[s.uid]||{};
    if(SITED.uids.has(s.uid)) p.s=id; else if(p.s===id) p.s='';}
  await saveSittings(S,`${SITED.id?'Changed':'Added'} the sitting on ${sitName({at})} (${SITED.uids.size} students)`);
}
async function deleteSitting(id){
  const c=CUR,x=sittingsOf(c).find(y=>y.id===id),who=eligible(c).filter(s=>sitOf(c,s.uid)===id);
  const sent=who.filter(s=>SUBS[s.uid+'_A']||SUBS[s.uid+'_B']||SUBS[s.uid+'_C']).length;
  if(!confirm(`Remove the sitting on ${sitName(x)}?\n${who.length} students lose this date${sent?` (${sent} already sent answers — those stay)`:''}. You can put them in another sitting.`)) return false;
  let S=realSittings(c).filter(y=>y.id!==id);

}

/* answer sheets: one card per student, like the weekly papers */
let SITF='';
function rowsFor(){
  const el=eligible(CUR).filter(s=>(ASG[s.uid]||GRADE[s.uid])&&(!SITF||sitOf(CUR,s.uid)===SITF));
  const has=s=>!!(SUBS[s.uid+'_A']||SUBS[s.uid+'_B']||SUBS[s.uid+'_C']), done=s=>{const g=GRADE[s.uid]||{};return !!(g.sent||g.absent);};
  return {all:el,wait:el.filter(s=>has(s)&&!done(s)),sent:el.filter(done),none:el.filter(s=>!has(s)&&!done(s))};
}
function drawAnswers(){
  const box=$('#ans');if(!box) return;
  const c=CUR,R=rowsFor(),two=twoParts(c);
  if(!FILT) FILT=R.wait.length?'wait':R.sent.length?'sent':'none';

  WAIT[c.id]=R.wait.length;drawList();
  box.innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">✍️ Answer sheets</h2><span class="muted"><span class="live-dot"></span>New sheets appear here by themselves</span></div>
    <div class="filt" style="margin-top:10px">
      <button data-f="wait" class="${FILT==='wait'?'on':''}">📥 To mark <span class="count">${R.wait.length}</span></button>
      <button data-f="sent" class="${FILT==='sent'?'on':''}">✅ Sent <span class="count">${R.sent.length}</span></button>
      <button data-f="none" class="${FILT==='none'?'on':''}">⏳ No answer yet <span class="count">${R.none.length}</span></button></div>
    ${sittingsOf(c).length>1?`<div class="filt"><span class="muted" style="align-self:center">Sitting:</span><button data-sf="" class="${SITF?'':'on'}">All</button>${sittingsOf(c).slice().sort((x,y)=>ms(x.at)-ms(y.at)).map(x=>`<button data-sf="${x.id}" class="${SITF===x.id?'on':''}">${esc(sitShort(x))}</button>`).join('')}</div>`:''}
    ${c.stage==='draft'&&!R.all.length?'<p class="muted">Publish the paper first. Each student’s answer sheet will appear here when they upload it.</p>':''}
    ${list.map(s=>card(s,two)).join('')||`<p class="muted">${FILT==='wait'?'Nothing waiting. 🎉':FILT==='sent'?'No marks sent yet.':'Everyone has sent something.'}</p>`}`;
  drawRank();
}
function fileLinks(sub){
  if(!sub) return '<span class="muted">no file</span>';

function card(s,two){
  const c=CUR,g=GRADE[s.uid]||{},d=DRAFT[s.uid]||{},sa=SUBS[s.uid+'_A'],sb=SUBS[s.uid+'_B'],sc=SUBS[s.uid+'_C'],a=ASG[s.uid]||{};
  const any=sa||sb||sc,late=a.ext,done=(g.sent||g.absent)&&!d.editing,sx=sittingsOf(c).find(x=>x.id===sitOf(c,s.uid));
  const ini=s.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const first=esc(s.name.split(' ')[0]);
  const val=(k,gk)=>esc(d[k]!=null?d[k]:g[gk]!=null?g[gk]:'');
  const tot=(+(d.a!=null?d.a:g.a)||0)+(two?(+(d.b!=null?d.b:g.b)||0):0);
  return `<div class="jw ${NEWU.has(s.uid)?'new':''} ${done?'sent':''}" data-u="${s.uid}">

function results(){
  const c=CUR,max=maxOf(c),bd=c.badges,cn=c.coins,two=twoParts(c);
  const rows=eligible(c).filter(s=>{const g=GRADE[s.uid];return g&&(g.sent||g.absent);}).map(s=>{const g=GRADE[s.uid],ab=!!g.absent;
    const tot=ab?0:(+g.a||0)+(two?(+g.b||0):0),pct=max?Math.round(1000*tot/max)/10:0;
    return {s,g,absent:ab,a:ab?null:+g.a,b:ab||!two?null:+g.b,total:tot,pct,badge:ab?'':pct>=bd.gold?'gold':pct>=bd.silver?'silver':pct>=bd.bronze?'bronze':''};});
  const ranked=rows.filter(r=>!r.absent).sort((x,y)=>y.total-x.total||x.s.name.localeCompare(y.s.name));
  ranked.forEach((r,i)=>{r.rank=i&&r.total===ranked[i-1].total?ranked[i-1].rank:i+1;});   /* ties share a place: 1, 2, 2, 4 */
  rows.forEach(r=>{r.trophy=r.rank===1?'1st':r.rank===2?'2nd':r.rank===3?'3rd':'';
    r.coins=r.absent?0:(+cn.part||0)+(+cn[r.badge]||0)+(r.rank===1?+cn.r1:r.rank===2?+cn.r2:r.rank===3?+cn.r3:0)||0;});
  return {rows,ranked,max,of:ranked.length};
}
async function pushResults(){

  for(let i=0;i<ops.length;i+=400){const b=FB.writeBatch(db);ops.slice(i,i+400).forEach(([ref,v])=>b.set(ref,v,{merge:true}));await b.commit();}

async function syncAssign(c){
  const el=eligible(c),S=sittingsOf(c),T=v=>FB.Timestamp.fromMillis(v),ops=[],keep=new Set();
  const old=await FB.getDocs(C('cp',c.id,'assign'));const OLD={};old.forEach(d=>OLD[d.id]=d.data());
  for(const s of el){const sid=sitOf(c,s.uid),x=S.find(y=>y.id===sid),t=x&&times(c,sid);if(!t) continue;keep.add(s.uid);
    const o=OLD[s.uid],same=o&&ms(o.start)===t.openA&&o.session===sid,ext=same&&o.ext;
    ops.push(['set',D('cp',c.id,'assign',s.uid),{uid:s.uid,code:s.code,name:s.name,batch:s.batch,medium:medOf(s),session:sid,label:sitName(x),
      start:T(t.openA),openA:T(t.openA),endA:T(t.endA),dueA:ext?o.dueA:T(t.dueA),openB:T(t.openB),endB:T(t.endB),dueB:ext?o.dueB:T(t.dueB),
      zoom:PRIV.zoom.S1||'',ack:same?!!o.ack:false,ackAt:same?(o.ackAt||null):null,ext:!!ext,feedback:'',publishedAt:FB.serverTimestamp()}]);}
  for(const u in OLD) if(!keep.has(u)) ops.push(['del',D('cp',c.id,'assign',u)]);
  for(let i=0;i<ops.length;i+=400){const b=FB.writeBatch(db);ops.slice(i,i+400).forEach(([k,r,v])=>k==='del'?b.delete(r):b.set(r,v));await b.commit();}
  ASG={};const a=await FB.getDocs(C('cp',c.id,'assign'));a.forEach(d=>ASG[d.id]=d.data());
}

/* question papers: one copy per sitting, each opening at its own sitting's times */
async function writePapers(c){
  const want={},S=sittingsOf(c),links=c.printed?{}:(PRIV.links||{});
  for(const x of S){const t=times(c,x.id);if(!t) continue;
    for(const k in links){if(!links[k]) continue;const part=k[0];if(part==='B'&&!twoParts(c)) continue;
      want[x.id+'_'+k]={session:x.id,part,medium:k.slice(2),link:links[k],openAt:FB.Timestamp.fromMillis(part==='A'?t.openA:t.openB),updatedAt:FB.serverTimestamp()};}}
  const have=await FB.getDocs(C('cp',c.id,'papers')),b=FB.writeBatch(db);
  have.forEach(d=>{if(!want[d.id]) b.delete(d.ref);});
  for(const id in want) b.set(D('cp',c.id,'papers',id),want[id]);
  await b.commit();
}

    <input id="fZoom" style="width:100%" placeholder="https://us02web.zoom.us/j/…" value="${esc(PRIV.zoom.S1||'')}">

    <h3><span class="step">4</span>Question papers and answer sheets</h3>
    <label class="pick ${c.printed?'on':''}" style="margin:0 0 10px;max-width:520px"><input type="checkbox" id="fPrinted" ${c.printed?'checked':''}><span class="box"></span><span class="t">Students have printed papers<small>No question paper online — students write on the papers you gave them</small></span></label>
    <div id="fPapersBox" ${c.printed?'style="display:none"':''}><p class="muted" style="margin-top:-4px">Google Drive links (Anyone with the link · Viewer). Students can open their paper only when that part starts — the link stays hidden until then.</p>
    <div class="grid" id="fPapers"></div></div>
    <p class="muted" style="margin:12px 0 4px">What students upload after each part — each is scanned or uploaded on its own</p>
    <div class="grid">
      <label class="f">After the first part<input id="fUA" value="${esc(upl(c,'A'))}"></label>
      <label class="f" data-two>After the second part<input id="fUB" value="${esc(upl(c,'B'))}"></label>
      <label class="f" data-two>…and also<input id="fUC" value="${esc(upl(c,'C'))}" ${c.essay===false?'disabled':''}></label></div>
    <label class="pick ${c.essay!==false?'on':''}" data-two style="margin:8px 0 0;max-width:520px"><input type="checkbox" id="fEssay" ${c.essay!==false?'checked':''}><span class="box"></span><span class="t">The essay is uploaded separately<small>Students send the structured part and the essay as two uploads</small></span></label>

    <h3><span class="step">5</span>Who sits it <span class="muted">· <span class="count" id="fCount">0</span> students</span></h3>
    <div class="picks">${BATCHES.map(([id,l])=>{const n=Object.values(STU).filter(s=>s.batch===id).length;
      return `<label class="pick big ${FORMB.has(id)?'on':''}"><input type="checkbox" class="fB" value="${id}" ${FORMB.has(id)?'checked':''}><span class="box"></span><span class="t">${l}<small>${n} students · whole class</small></span></label>`;}).join('')}</div>
    <h3 style="font-size:14.5px">Individual students <span class="muted">(one-to-one, or anyone outside the classes ticked above)</span></h3>
    <div class="row" style="margin-bottom:8px"><input id="fFind" placeholder="🔍 Search name or number" style="flex:1;min-width:200px">
      <button class="small" id="fSolo" type="button">Tick all one-to-one students</button><button class="small ghost" id="fNone" type="button">Untick all</button></div>
    <div class="picks" id="fInd" style="max-height:300px;overflow:auto"></div>
    <div id="fMed"></div>

    <details style="margin-top:14px"><summary>More options — rules for students, badges and coins</summary>
      <label class="f" style="margin-top:8px">Instructions for students<textarea id="fIns">${esc(c.instructions||'')}</textarea></label>
      <label class="f" style="margin-top:8px">Allowed materials<input id="fMat" value="${esc(c.materials||'')}"></label>
      <div class="grid" style="margin-top:8px">
        <label class="f">🥇 Gold from %<input id="bgG" type="number" value="${c.badges.gold}"></label><label class="f">🥈 Silver from %<input id="bgS" type="number" value="${c.badges.silver}"></label><label class="f">🥉 Bronze from %<input id="bgB" type="number" value="${c.badges.bronze}"></label>
        <label class="f">Coins for sitting it<input id="cnP" type="number" min="0" value="${c.coins.part}"></label>
        <label class="f">Coins · Gold<input id="cnG" type="number" min="0" value="${c.coins.gold}"></label><label class="f">Coins · Silver<input id="cnS" type="number" min="0" value="${c.coins.silver}"></label><label class="f">Coins · Bronze<input id="cnB" type="number" min="0" value="${c.coins.bronze}"></label>
        <label class="f">Coins · 1st place<input id="cn1" type="number" min="0" value="${c.coins.r1}"></label><label class="f">Coins · 2nd place<input id="cn2" type="number" min="0" value="${c.coins.r2}"></label><label class="f">Coins · 3rd place<input id="cn3" type="number" min="0" value="${c.coins.r3}"></label>
      </div></details>

    <div class="foot">
      <button class="ghost" id="fBack" type="button">Cancel</button>
      ${CUR&&CUR.stage!=='draft'?'<button class="gold" id="fSave" type="button">💾 Save changes</button>'
        :'<button id="fDraft" type="button">💾 Save as draft</button><button class="gold" id="fPub" type="button">🚀 Save and publish to students</button>'}
    </div></div>`;
  const PAPERS=P;
  const sel=()=>Object.values(STU).filter(s=>FORMB.has(s.batch)||EXTRA.has(s.uid));
  const meds=()=>{const m=new Set(sel().map(s=>FIXED[s.batch]||MED[s.uid]||'si'));return m.size?['si','en'].filter(x=>m.has(x)):['si','en'];};
  const drawPapers=()=>{const two=$('#fTwo').checked,cur={};$$('#fPapers input').forEach(i=>cur[i.dataset.id]=i.value);
    $$('[data-two]').forEach(x=>x.style.display=two?'':'none');
    $('#fPapers').innerHTML=(two?['A','B']:['A']).flatMap(p=>meds().map(m=>{const id=`${p}_${m}`,v=cur[id]!=null?cur[id]:PAPERS[id]||'';
      return `<label class="f">${esc(p==='A'?$('#fAt1').value:$('#fBt').value)} · ${MEDN[m]}<input data-id="${id}" placeholder="https://drive.google.com/…" value="${esc(v)}"></label>`;})).join('');};
  const drawInd=()=>{const q=($('#fFind').value||'').toLowerCase();
    const list=Object.values(STU).filter(s=>!FORMB.has(s.batch)).sort((a,b)=>(EXTRA.has(b.uid)-EXTRA.has(a.uid))||a.name.localeCompare(b.name));
    $('#fInd').innerHTML=list.filter(s=>!q||(s.name+' '+s.code).toLowerCase().includes(q)).map(s=>`<label class="pick ${EXTRA.has(s.uid)?'on':''}"><input type="checkbox" class="fX" value="${s.uid}" ${EXTRA.has(s.uid)?'checked':''}><span class="box"></span>
      <span class="t">${esc(s.name)}<small>${esc(s.code||'no number')} · ${esc(s.batch||'no class')}${s.track==='solo'?' · one-to-one':''}</small></span></label>`).join('')||'<p class="muted">Nobody else.</p>';};
  const drawMed=()=>{const free=sel().filter(s=>!FIXED[s.batch]);
    $('#fMed').innerHTML=free.length?`<h3 style="font-size:14.5px">Paper language for these students</h3><div class="picks">${free.map(s=>{const m=MED[s.uid]||'si';
      return `<div class="pick" style="cursor:default"><span class="t">${esc(s.name)}<small>${esc(s.batch||'no class')}</small></span><span class="seg"><button type="button" data-m="si" data-u="${s.uid}" class="${m==='si'?'on':''}">Sinhala</button><button type="button" data-m="en" data-u="${s.uid}" class="${m==='en'?'on':''}">English</button></span></div>`;}).join('')}</div>`:'';};
  const count=()=>{const e=$('#fCount');e.textContent=sel().length;e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');};
  const tl=()=>{const st=$('#fStart').value||'18:00',at=fromInput(new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10)+'T'+st),two=$('#fTwo').checked,n=id=>Math.max(0,+$(id).value||0);
    const t=times({at,secA:{min:n('#fAm')},secB:{min:n('#fBm'),on:two},breakMin:n('#fBrk'),graceMin:n('#fGr')});
    $('#fTl').innerHTML=`🕕 <b>Every sitting</b><br>${esc($('#fAt1').value)} ${fmtT(t.openA)}–${fmtT(t.endA)} · upload until ${fmtT(t.dueA)}`+
      (two?`<br>Break ${fmtT(t.endA)}–${fmtT(t.openB)}<br>${esc($('#fBt').value)} ${fmtT(t.openB)}–${fmtT(t.endB)} · upload until ${fmtT(t.dueB)}`:'');};
  /* exam days: one row per sitting — a date box and a time box (works on phones too) */
  const dayRow=(sid,d,t)=>`<div class="row fday" data-sid="${esc(sid||'')}" style="gap:8px;margin-bottom:8px;align-items:flex-end">
      <label class="f" style="margin:0">Date<input type="date" class="fdD" value="${esc(d||'')}"></label>
      <label class="f" style="margin:0">Starts at<input type="time" class="fdT" value="${esc(t||$('#fStart').value||'18:00')}"></label>
      <button class="small ghost fdX" type="button" title="Remove this day">✕</button></div>`;
  const S0=sittingsOf(c).slice().sort((a,b)=>ms(a.at)-ms(b.at));
  $('#fDays').innerHTML=S0.length?S0.map(x=>{const iv=toInput(x.at);return dayRow(x.id,iv.slice(0,10),iv.slice(11,16));}).join(''):dayRow('','','');
  $('#fDayAdd').onclick=()=>{$('#fDays').insertAdjacentHTML('beforeend',dayRow('','',''));$('#fDays').lastElementChild.querySelector('.fdD').focus();};
  $('#fDays').onclick=e=>{const x=e.target.closest('.fdX');if(!x) return;if($$('#fDays .fday').length>1) x.closest('.fday').remove();else{x.closest('.fday').querySelector('.fdD').value='';}};
  drawPapers();drawInd();drawMed();count();tl();
  const v=$('#view');
  v.onchange=e=>{const t=e.target;
    if(t.matches('.fB,.fX,#fTwo,#fPrinted,#fEssay')) t.closest('.pick').classList.toggle('on',t.checked);
    if(t.matches('#fPrinted')) $('#fPapersBox').style.display=t.checked?'none':'';
    if(t.matches('#fEssay')) $('#fUC').disabled=!t.checked;
    if(t.matches('.fB')){t.checked?FORMB.add(t.value):FORMB.delete(t.value);drawInd();drawMed();drawPapers();count();}
    if(t.matches('.fX')){t.checked?EXTRA.add(t.value):EXTRA.delete(t.value);drawMed();drawPapers();count();}
    if(t.matches('#fTwo')){$('#fBrow').style.display=t.checked?'':'none';drawPapers();tl();}};
  v.oninput=e=>{if(e.target.matches('#fStart,#fAm,#fBm,#fBrk,#fGr,#fAt1,#fBt')) tl();if(e.target.matches('#fAt1,#fBt')) drawPapers();if(e.target.matches('#fFind')) drawInd();};
  v.onclick=e=>{const m=e.target.closest('[data-m]');if(m){MED[m.dataset.u]=m.dataset.m;drawMed();drawPapers();}};
  $('#fSolo').onclick=()=>{let n=0;Object.values(STU).forEach(s=>{if(s.track==='solo'&&!FORMB.has(s.batch)){EXTRA.add(s.uid);n++;}});drawInd();drawMed();drawPapers();count();toast(n?'✓ Ticked '+n+' one-to-one students':'No one-to-one students found',n?'ok':'');};
  $('#fNone').onclick=()=>{EXTRA.clear();drawInd();drawMed();drawPapers();count();};
  $('#fBack').onclick=()=>{v.onchange=v.oninput=v.onclick=null;if(CUR) openPaper(CUR.id);else $('#view').innerHTML='';};
  if($('#fSave')) $('#fSave').onclick=e=>act(e.currentTarget,()=>saveForm(false),'💾 Saved. Students see the changes now.');
  if($('#fDraft')) $('#fDraft').onclick=e=>act(e.currentTarget,()=>saveForm(false),'💾 Saved as a draft.');
  if($('#fPub')) $('#fPub').onclick=e=>act(e.currentTarget,()=>saveForm(true),'🚀 Published. Students can see it now.');
}
async function saveForm(publish){
  const v=id=>$(id).value.trim(),n=id=>Math.max(0,Math.round(+$(id).value||0)),two=$('#fTwo').checked;
  const title=v('#fTitle')||stop('Give the paper a name.',$('#fTitle'));
  const startTime=$('#fStart').value||'18:00',printed=$('#fPrinted').checked;
  if(n('#fAm')<10) stop('The first part needs at least 10 minutes.',$('#fAm'));
  if(!n('#fAk')) stop('How many marks is the first part out of?',$('#fAk'));
  if(two&&n('#fBm')<10) stop('The second part needs at least 10 minutes.',$('#fBm'));
  if(two&&!n('#fBk')) stop('How many marks is the second part out of?',$('#fBk'));
  const zoom=v('#fZoom');if(zoom&&!/^https?:\/\//i.test(zoom)) stop('The Zoom link must start with https://',$('#fZoom'));
  const badges={gold:n('#bgG'),silver:n('#bgS'),bronze:n('#bgB')};
  if(!(badges.gold>badges.silver&&badges.silver>badges.bronze)) stop('Badge levels must go Gold > Silver > Bronze (More options).');
  const papers={};for(const i of $$('#fPapers input')){const x=i.value.trim();if(x&&!/^https?:\/\//i.test(x)) stop('A question paper link must start with https://',i);papers[i.dataset.id]=x;}
  const doc={title,afterWeek:+$('#fWeek').value||0,coverage:v('#fCov'),startTime,printed,essay:two&&$('#fEssay').checked,
    upl:{A:v('#fUA')||UPL.A,B:v('#fUB')||UPL.B,C:v('#fUC')||UPL.C},
    secA:{title:v('#fAt1')||'Part A',min:n('#fAm'),marks:n('#fAk')},secB:{title:v('#fBt')||'Part B',min:n('#fBm')||10,marks:n('#fBk')||1,on:two},
    breakMin:n('#fBrk'),graceMin:Math.max(5,n('#fGr')),batches:[...FORMB],extra:[...EXTRA].filter(u=>STU[u]&&!FORMB.has(STU[u].batch)),
    instructions:v('#fIns'),materials:v('#fMat'),badges,coins:{part:n('#cnP'),gold:n('#cnG'),silver:n('#cnS'),bronze:n('#cnB'),r1:n('#cn1'),r2:n('#cn2'),r3:n('#cn3')},
    updatedAt:FB.serverTimestamp()};
  /* exam days → sittings (a day you keep keeps its students; a new day starts with nobody) */
  const old=CUR?sittingsOf(CUR):[],legacy=CUR&&!(CUR.sittings&&CUR.sittings.length)&&old.length;
  let nx=Math.max(0,...old.map(x=>+String(x.id).slice(1)||0));
  const days=[];
  for(const r of $$('#fDays .fday')){const d=r.querySelector('.fdD').value,t=r.querySelector('.fdT').value||startTime;
    if(!d) continue;
    const at=fromInput(d+'T'+t);if(!at) stop('That date does not look right.',r.querySelector('.fdD'));
    if(days.some(x=>x.ms===at)) stop('Two days have the same date and time.',r.querySelector('.fdD'));
    days.push({id:r.dataset.sid&&old.some(x=>x.id===r.dataset.sid)?r.dataset.sid:'S'+(++nx),ms:at});}
  days.sort((a,b)=>a.ms-b.ms);
  doc.sittings=days.map(x=>({id:x.id,at:FB.Timestamp.fromMillis(x.ms)}));
  doc.at=days.length?FB.Timestamp.fromMillis(days[0].ms):null;
  const isNew=!CUR,id=isNew?'cp'+Date.now().toString(36):CUR.id,c={...(CUR||blank()),...doc,id};
  const el=eligible(c);
  if(publish&&!el.length) stop('Tick at least one class or student (step 5).');
  if(publish&&!zoom&&!confirm('There is no Zoom link yet. Publish anyway?')) return false;
  if(publish&&!confirm(`Publish “${title}” to ${el.length} students?\n`+(sittingsOf(c).length?'Students in a sitting see their date straight away.':'They see “date coming soon” until you add a sitting.'))) return false;
  if(isNew){doc.n=c.n;doc.stage='draft';doc.createdAt=FB.serverTimestamp();}
  if(publish){doc.stage='confirmed';doc.notice='';doc.publishedAt=FB.serverTimestamp();}
  await FB.setDoc(D('cp',id),doc,{merge:true});
  CUR={...c,stage:doc.stage||c.stage};
  /* each student keeps their sitting; only those outside the two fixed-medium classes carry a medium */
  const ids=new Set(days.map(x=>x.id));
  const plan={};for(const s of el){const o=(PRIV.plan||{})[s.uid]||{};
    let sid=o.s||(legacy?'S1':'');if(!ids.has(sid)) sid='';
    if(!sid&&days.length===1) sid=days[0].id;               /* only one day: everybody writes on it */
    plan[s.uid]={s:sid,...(FIXED[s.batch]?{}:{m:MED[s.uid]||o.m||'si'})};}
  PRIV={...PRIV,zoom:{...PRIV.zoom,S1:zoom},plan,links:papers};
  await FB.setDoc(D('cp',id,'grade','_private'),PRIV);
  await writePapers(CUR);
  if(CUR.stage!=='draft') await syncAssign(CUR);
  if(Object.values(GRADE).some(g=>g.sent||g.absent)) await pushResults();   /* new name or badge levels reach the students too */
  logIt(isNew?'Added the paper':publish?'Published to '+el.length+' students':'Saved changes');
  if(days.length>1&&el.some(s=>!plan[s.uid].s)) setTimeout(()=>toast('Now tick who writes on each day in 📅 Sittings below.','ok'),1600);
  $('#view').onchange=$('#view').oninput=$('#view').onclick=null;
  await loadList();await openPaper(id);
}

/* ---------- Drive upload ---------- */
async function showDrive(){
  closeLive();VIEW='drive';CUR=null;$('#view').onchange=$('#view').oninput=$('#view').onclick=null;location.hash='drive';drawList();
  let code='';try{code=await (await fetch('drive-upload.gs.txt',{cache:'no-store'})).text();}catch(e){code='(Could not load the script — open cp/drive-upload.gs.txt in the repository.)';}
  $('#view').innerHTML=`<div class="card"><h2>📤 Drive upload</h2>
    <p>Students press <b>Upload my answer sheet</b>, choose the CamScanner PDF (or photos), and it lands in <b>your Google Drive</b> and in your answer-sheet list here — no links to copy. Your marked sheets upload the same way.</p>
    <div class="sum"><div><b>Status</b>${SET.uploadUrl?'<span class="ok">● Connected</span>':'<span class="warn">Not set up yet — students paste Drive links instead</span>'}</div>
      <div><b>Folder in your Drive</b>EICT Checkpoint Answers</div></div>
    <h3>Set it up once (about 5 minutes)</h3>
    <ol class="how">
      <li>Open <a href="https://script.google.com/home/projects/create" target="_blank" rel="noopener">script.google.com → New project</a> with the Google account whose Drive should keep the answer sheets.</li>
      <li>Delete what is in the editor, press <b>Copy the script</b> below and paste it in. Press 💾 Save.</li>
      <li><b>Deploy → New deployment</b> → ⚙ <b>Web app</b>. Execute as: <b>Me</b>. Who has access: <b>Anyone</b>. Press <b>Deploy</b>.</li>
      <li><b>Authorize access</b> → your account → <i>Advanced</i> → <i>Go to … (unsafe)</i> → <b>Allow</b>. (It is your own script — Google shows this for every new one.)</li>
      <li>Copy the <b>Web app URL</b> (ends in <code>/exec</code>), paste it below, press <b>Save</b> and then <b>Test</b>.</li>
    </ol>
    <div class="row"><button class="cyan" id="dCopy">📋 Copy the script</button></div>
    <details><summary>See the script</summary><pre class="code">${esc(code)}</pre></details>
    <h3>Web app URL</h3>
    <div class="row"><input id="dUrl" style="flex:1;min-width:260px" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(SET.uploadUrl||'')}">
      <button class="gold" id="dSave">💾 Save</button><button id="dTest">🔌 Test</button></div>
    <p class="muted" id="dOut"></p>
    <p class="muted">Changed the script later? Deploy → Manage deployments → ✏️ → Version: New version → Deploy. The URL stays the same.</p></div>`;
  $('#dCopy').onclick=e=>act(e.currentTarget,async()=>{try{await navigator.clipboard.writeText(code);}catch(x){const t=document.createElement('textarea');t.value=code;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}},'📋 Copied. Paste it into script.google.com');
  $('#dSave').onclick=e=>act(e.currentTarget,async()=>{const u=$('#dUrl').value.trim();
    if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u)) stop('That is not a web app URL. It looks like https://script.google.com/macros/s/…/exec',$('#dUrl'));
    await FB.setDoc(D('cp','_settings'),{uploadUrl:u,updatedAt:FB.serverTimestamp()},{merge:true});SET.uploadUrl=u;drawList();},'💾 Saved.');
  $('#dTest').onclick=e=>act(e.currentTarget,async()=>{const u=$('#dUrl').value.trim()||stop('Paste the web app URL first.',$('#dUrl'));
    let j;try{j=await (await fetch(u)).json();}catch(x){stop('No answer from that URL. Check “Who has access: Anyone” and that you copied the /exec link.');}
    if(!j||j.app!=='eict-cp-upload') stop('That URL answered, but it is not the EICT upload script.');
    $('#dOut').innerHTML='<span class="ok">✓ Working.</span> Answer sheets go to <a href="'+esc(j.folder)+'" target="_blank" rel="noopener">this folder in your Drive ↗</a>';},'🔌 The upload is working.');
}
/* a file into your Drive through the upload script; returns its link */
async function upload(file,meta){
  if(!SET.uploadUrl) stop('Set up the Drive upload first.');
  if(file.size>20*1048576) stop('That file is over 20 MB.');
  const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(file);});
  const token=await auth.currentUser.getIdToken();
  const res=await fetch(SET.uploadUrl,{method:'POST',body:JSON.stringify({token,cp:CUR.id,mime:file.type||'application/pdf',data,...meta})});
  const j=await res.json();
  if(!j.ok) stop('Upload refused: '+j.error);
  return j.url;
}

window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h==='drive'&&VIEW!=='drive') showDrive();else if(h&&h!=='drive'&&(!CUR||CUR.id!==h)&&CPS.find(c=>c.id===h)) openPaper(h);});
boot();
