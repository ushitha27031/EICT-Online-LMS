<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EICT — Mission Control</title>
<meta name="version" content="3.9.0">
<meta name="theme-color" content="#070B1F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --space:#070B1F;--deep:#0D1430;--panel:#141C3D;--raise:#1C2652;
  --cyan:#38E1FF;--gold:#FFC93C;--lime:#7CF29B;--rose:#FF4D6D;--violet:#A87BFF;
  --ink:#EAF0FF;--dim:#93A0C8;--dimmer:#6A77A0;
  --edge:rgba(120,150,255,.20);--edge2:rgba(120,150,255,.42);
  --d:'Chakra Petch',system-ui,sans-serif;--b:'IBM Plex Sans',system-ui,sans-serif;--m:'IBM Plex Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--space);color:var(--ink);font-family:var(--b);font-size:16px;
  line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}

#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.neb{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(760px 540px at 14% 4%,rgba(168,123,255,.20),transparent 62%),
             radial-gradient(820px 560px at 86% 0%,rgba(56,225,255,.15),transparent 64%),
             radial-gradient(1100px 700px at 50% 104%,rgba(255,107,53,.22),transparent 60%)}
/* storm light rolling across the sky */
.storm{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:radial-gradient(620px 320px at 30% 22%,rgba(180,200,255,.16),transparent 70%);
  animation:roll 17s ease-in-out infinite alternate}
@keyframes roll{0%{transform:translate3d(-8%,0,0) scale(1)}100%{transform:translate3d(10%,4%,0) scale(1.18)}}
/* ridgeline, drawn not photographed */
.ridge{position:fixed;left:0;right:0;bottom:0;z-index:0;pointer-events:none;width:100%;height:52vh}
.ridge svg{width:100%;height:100%;display:block}
.r-far{fill:#0B1128;opacity:.92}
.r-mid{fill:#080C1E}
.r-near{fill:#04060F}
.r-glow{fill:url(#emberGlow)}
.blade{transform-origin:center;animation:sway 9s ease-in-out infinite alternate}
@keyframes sway{0%{transform:rotate(-1.2deg)}100%{transform:rotate(1.2deg)}}
.rune{animation:rune 3.4s ease-in-out infinite}
@keyframes rune{0%,100%{opacity:.35}50%{opacity:1}}

.splash{position:fixed;inset:0;z-index:70;display:grid;place-items:center;gap:20px;
  align-content:center;background:var(--space);transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.splash p{font-family:var(--m);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dim);margin:0}
.gate{position:relative;z-index:3;min-height:100svh;display:grid;place-items:center;padding:24px}
.gbox{width:min(420px,100%);text-align:center}
.badge{width:112px;height:112px;margin:0 auto 22px;position:relative}
.badge svg{position:absolute;inset:0}
.badge .r{fill:none;transform-origin:50% 50%}
.badge .a{animation:spin 20s linear infinite}
.badge .b{animation:spin 13s linear infinite reverse}
.badge .core{fill:var(--cyan);animation:beat 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
.gate h1{font-family:var(--d);font-weight:700;font-size:clamp(28px,6.4vw,40px);margin:0 0 8px;
  letter-spacing:.04em;text-transform:uppercase}
.gate p{color:var(--dim);margin:0 0 26px;font-size:15px}
.idrow{display:flex;gap:10px}
.fld1{width:100%;margin-bottom:10px;}
.idrow input,.fld1{flex:1;padding:15px 16px;border-radius:13px;background:rgba(20,28,61,.9);
  border:1px solid var(--edge);color:var(--ink);font-family:var(--m);font-size:17px;
  letter-spacing:.16em;text-align:center;text-transform:uppercase}
.idrow input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(56,225,255,.14)}
.go{padding:15px 24px;border-radius:13px;font-family:var(--d);font-weight:700;font-size:15px;
  letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(180deg,var(--cyan),#1EA9CC);
  color:#04202B;box-shadow:0 12px 28px -12px var(--cyan)}
.go:hover{transform:translateY(-2px)}
.gerr{color:var(--rose);font-family:var(--m);font-size:13px;min-height:18px;margin-top:14px}

.warp{position:fixed;inset:0;z-index:80;display:none;background:var(--space)}
.warp.on{display:block}
.warp{clip-path:circle(150% at 50% 50%);will-change:clip-path}
.warp.go{clip-path:circle(0% at 50% 50%);
  transition:clip-path 1.5s cubic-bezier(.66,0,.34,1)}
.warp svg{position:absolute;left:50%;top:50%;width:min(66vmin,420px);height:min(66vmin,420px);
  transform:translate(-50%,-50%)}
.warp svg{will-change:opacity,transform}
.warp.go svg{opacity:0;transform:translate(-50%,-50%) scale(1.55);
  transition:opacity .55s ease,transform 1.2s cubic-bezier(.66,0,.34,1)}

.hud{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:11px clamp(12px,2.6vw,24px);
  background:linear-gradient(180deg,rgba(7,11,31,.97),rgba(7,11,31,.82));
  border-bottom:1px solid var(--edge);backdrop-filter:blur(12px)}
.av{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;
  font-family:var(--d);font-weight:700;font-size:17px;color:#04202B;
  background:linear-gradient(150deg,var(--cyan),var(--violet));box-shadow:0 0 0 2px rgba(255,255,255,.12) inset}
.nm{min-width:0}
.nm b{display:block;font-family:var(--d);font-size:16px;line-height:1.2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.nm span{font-family:var(--m);font-size:10.5px;color:var(--dim);letter-spacing:.12em}
.xpwrap{flex:1;min-width:120px;max-width:260px}
.xpbar{height:9px;border-radius:5px;background:rgba(255,255,255,.10);overflow:hidden;border:1px solid var(--edge)}
.xpbar i{display:block;height:100%;border-radius:5px;transition:width .9s cubic-bezier(.2,.7,.2,1);
  background:linear-gradient(90deg,var(--cyan),var(--violet))}
.xptx{font-family:var(--m);font-size:10px;color:var(--dimmer);margin-top:3px;letter-spacing:.1em}
.chip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;
  border:1px solid var(--edge);background:rgba(28,38,82,.7);font-family:var(--d);font-weight:700;font-size:15px}
.chip small{font-family:var(--m);font-size:9.5px;color:var(--dim);letter-spacing:.14em;font-weight:400}
.coin{width:19px;height:19px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 34% 30%,#FFE79A,var(--gold) 62%,#B67F00);
  box-shadow:0 0 9px rgba(255,201,60,.6)}
.grade{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;
  font-family:var(--d);font-weight:700;font-size:24px;position:relative;
  border:2px solid currentColor;background:rgba(0,0,0,.32)}
.grade s{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);text-decoration:none;
  font-family:var(--m);font-size:8.5px;letter-spacing:.14em;padding:1px 6px;border-radius:6px;
  background:var(--space);color:var(--dim);white-space:nowrap}
.gA{color:var(--lime)}.gB{color:var(--cyan)}.gC{color:var(--gold)}.gS{color:#FF9A3C}.gW{color:var(--rose)}
.out{font-family:var(--m);font-size:10.5px;color:var(--dimmer);letter-spacing:.12em}
.out:hover{color:var(--rose)}

.tabs{display:flex;gap:8px;padding:14px clamp(12px,2.6vw,24px) 0;position:relative;z-index:3;
  max-width:1160px;margin:0 auto;overflow-x:auto}
.tab{padding:11px 20px;border-radius:12px 12px 0 0;font-family:var(--d);font-weight:700;font-size:14px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border:1px solid transparent;
  border-bottom:0;white-space:nowrap}
.tab.on{color:var(--ink);background:var(--panel);border-color:var(--edge)}
.wrap{position:relative;z-index:3;max-width:1160px;margin:0 auto;padding:0 clamp(12px,2.6vw,24px) 80px}
.stage{background:var(--panel);border:1px solid var(--edge);border-radius:0 16px 16px 16px;
  padding:clamp(16px,2.6vw,26px)}

.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.node{position:relative;border-radius:16px;padding:15px 14px;text-align:left;
  border:1px solid var(--edge);background:linear-gradient(165deg,var(--raise),var(--deep));
  transition:transform .18s,border-color .18s,box-shadow .18s}
.node:hover{transform:translateY(-4px);border-color:var(--edge2)}
.node .num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--d);font-weight:700;font-size:17px;margin-bottom:10px;
  border:1px solid var(--edge2);background:rgba(0,0,0,.28)}
.node.done{border-color:rgba(124,242,155,.45);background:linear-gradient(165deg,rgba(124,242,155,.14),var(--deep))}
.node.done .num{color:var(--lime);border-color:var(--lime)}
.node.now{border-color:var(--cyan);box-shadow:0 0 0 0 rgba(56,225,255,.45);animation:ping 2.6s infinite}
.node.now .num{color:var(--cyan);border-color:var(--cyan)}
.node.lock{opacity:.55}
.node.lock .num{color:var(--dimmer)}
@keyframes ping{70%{box-shadow:0 0 0 12px rgba(56,225,255,0)}100%{box-shadow:0 0 0 0 rgba(56,225,255,0)}}
.node b{display:block;font-family:var(--d);font-size:14.5px;line-height:1.25}
.node span{display:block;font-family:var(--m);font-size:10.5px;color:var(--dim);margin-top:4px}
.stars{display:flex;gap:3px;margin-top:9px}
.stars i{width:13px;height:13px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  background:rgba(255,255,255,.16)}
.stars i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,201,60,.7)}
.node .mk{position:absolute;top:12px;right:12px;font-family:var(--d);font-weight:700;font-size:15px}

.ov{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:16px;
  background:rgba(4,7,20,.88);backdrop-filter:blur(10px)}
.ov.on{display:grid}
.ov.big{padding:10px}
.ov.big .sheet{width:min(1180px,100%);max-height:95svh}
.wsHead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.wsHead h3{margin:0}
.wsHead span{font-family:var(--m);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.twocol{grid-template-columns:1fr}}
.pane{border:1px solid var(--edge);border-radius:12px;background:rgba(0,0,0,.26);padding:14px}
.pane h5{font-family:var(--d);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin:0 0 10px}
.code{width:100%;min-height:300px;padding:14px;border-radius:11px;background:#060A18;
  border:1px solid var(--edge);color:#DCE6FF;font-family:var(--m);font-size:14px;
  line-height:1.75;resize:vertical;tab-size:2}
.code:focus{outline:none;border-color:var(--cyan)}
.bigin{width:100%;padding:14px 16px;border-radius:11px;background:rgba(0,0,0,.35);
  border:1px solid var(--edge);color:var(--ink);font-family:var(--m);font-size:16px}
.bigin:focus{outline:none;border-color:var(--cyan)}
table.tt{width:100%;border-collapse:collapse;font-family:var(--m);font-size:13.5px}
table.tt th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--edge2);
  color:var(--gold);font-weight:500;white-space:nowrap}
table.tt td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
table.tt tr:hover td{background:rgba(56,225,255,.07)}
table.tt td.one{color:var(--lime);font-weight:600}
table.tt td.zero{color:var(--dimmer)}
.baserow{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.baserow b{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.baseval{font-family:var(--m);font-size:21px;color:var(--cyan);word-break:break-all}
.step{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.step i{font-style:normal;width:26px;height:26px;flex:none;border-radius:8px;display:grid;
  place-items:center;font-family:var(--m);font-size:12px;background:rgba(56,225,255,.15);color:var(--cyan)}
.step b{display:block;font-family:var(--m);font-size:15px;color:var(--ink)}
.step span{display:block;font-size:12.5px;color:var(--dim);margin-top:3px}
.pins{display:flex;gap:10px;align-items:center;margin:12px 0}
.pin{padding:11px 18px;border-radius:10px;border:1px solid var(--edge2);font-family:var(--m);font-size:15px}
.pin.hi{background:var(--lime);color:#04240F;border-color:var(--lime)}
.lamp{width:42px;height:42px;border-radius:50%;border:2px solid var(--edge2);display:grid;
  place-items:center;font-family:var(--d);font-weight:700;font-size:17px;transition:.2s}
.lamp.hi{background:var(--lime);color:#04240F;border-color:var(--lime);box-shadow:0 0 20px rgba(124,242,155,.7)}
.prev{width:100%;height:420px;border-radius:11px;border:1px solid var(--edge);background:#fff}
.openTool{width:100%;margin-top:12px}
.sheet{width:min(680px,100%);max-height:90svh;overflow:auto;border-radius:18px;position:relative;
  border:1px solid var(--edge2);background:linear-gradient(165deg,var(--raise),var(--deep));
  padding:clamp(20px,3.4vw,30px);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}}
.sheet h3{font-family:var(--d);font-weight:700;font-size:24px;margin:8px 0 3px;text-transform:uppercase}
.k{font-family:var(--m);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.x{position:absolute;top:14px;right:18px;font-size:26px;line-height:1;color:var(--dim)}
.x:hover{color:var(--rose)}
.sec{margin-top:20px}
.sec h4{font-family:var(--d);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin:0 0 9px;display:flex;align-items:center;gap:9px}
.sec h4::after{content:'';flex:1;height:1px;background:var(--edge)}
.lnk{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:11px;margin-bottom:8px;
  border:1px solid var(--edge);background:rgba(0,0,0,.22);font-size:14.5px}
.lnk:hover{border-color:var(--cyan)}
.lnk i{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-style:normal;font-size:13px;background:rgba(56,225,255,.16);color:var(--cyan)}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;
  border-top:1px solid rgba(255,255,255,.07);cursor:pointer}
.task:first-of-type{border-top:0}
.bx{width:23px;height:23px;flex:none;border-radius:7px;border:1.5px solid var(--edge2);
  background:rgba(0,0,0,.3);display:grid;place-items:center;transition:.18s;margin-top:1px}
.task.on .bx{background:var(--lime);border-color:var(--lime)}
.bx svg{width:12px;height:12px;fill:none;stroke:#04240F;stroke-width:3.6;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22}
.task.on .bx svg{stroke-dashoffset:0;transition:stroke-dashoffset .3s}
.task span{font-size:14.8px;line-height:1.45}
.task.on span{color:var(--dimmer);text-decoration:line-through}
.pbox{border:1px solid var(--gold);border-radius:13px;padding:15px;
  background:linear-gradient(150deg,rgba(255,201,60,.13),transparent)}
.pbox b{font-family:var(--d);font-size:16px}
.pbox .due{font-family:var(--m);font-size:11.5px;color:var(--gold);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;
  border-radius:12px;font-family:var(--d);font-weight:700;font-size:14.5px;letter-spacing:.06em;
  text-transform:uppercase;transition:.16s}
.b1{background:linear-gradient(180deg,var(--cyan),#1EA9CC);color:#04202B}
.b2{border:1px solid var(--edge2);color:var(--ink)}
.btn:hover{transform:translateY(-2px)}

.mk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.mk-t{border:1px solid var(--edge);border-radius:14px;padding:15px;background:rgba(0,0,0,.2)}
.mk-t b{display:block;font-family:var(--d);font-size:30px;line-height:1}
.mk-t span{display:block;font-family:var(--m);font-size:10.5px;color:var(--dim);
  letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.chartbox{border:1px solid var(--edge);border-radius:14px;padding:16px;background:rgba(0,0,0,.2)}

.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.item{border:1px solid var(--edge);border-radius:16px;padding:18px;text-align:left;
  background:linear-gradient(165deg,var(--raise),var(--deep));transition:.18s}
.item:hover{border-color:var(--edge2)}
.item.owned{border-color:var(--lime)}
.item .ic{font-size:28px;margin-bottom:10px}
.item b{display:block;font-family:var(--d);font-size:16px}
.item p{font-size:13.5px;color:var(--dim);margin:6px 0 12px;line-height:1.5}
.price{display:inline-flex;align-items:center;gap:7px;font-family:var(--d);font-weight:700;
  font-size:15px;color:var(--gold)}
.owned .price{color:var(--lime)}
.tool{margin-top:14px;border-top:1px solid var(--edge);padding-top:14px}
.tool input{padding:11px 13px;border-radius:10px;background:rgba(0,0,0,.35);
  border:1px solid var(--edge);color:var(--ink);font-family:var(--m);font-size:15px;width:100%}
.tool input:focus{outline:none;border-color:var(--cyan)}
.out2{font-family:var(--m);font-size:14px;color:var(--cyan);margin-top:10px;word-break:break-all;line-height:1.9}
.gates{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.gates button{padding:9px 14px;border-radius:9px;border:1px solid var(--edge);font-family:var(--m);font-size:13px}
.gates button.on{background:var(--cyan);color:#04202B;border-color:var(--cyan)}
.burst{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:96;pointer-events:none;
  text-align:center;opacity:0}
.burst.on{animation:burst 2.4s cubic-bezier(.2,.8,.2,1) forwards}
.burst b{display:block;font-family:var(--d);font-weight:700;font-size:clamp(44px,10vw,76px);
  color:#FFC93C;text-shadow:0 0 34px rgba(255,201,60,.85),0 6px 22px rgba(0,0,0,.6)}
.burst span{display:block;font-family:var(--m);font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:#EAF0FF;margin-top:6px}
@keyframes burst{
  0%{opacity:0;transform:translateX(-50%) scale(.5)}
  16%{opacity:1;transform:translateX(-50%) scale(1.14)}
  28%{transform:translateX(-50%) scale(1)}
  74%{opacity:1;transform:translateX(-50%) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-42px) scale(.96)}}
.spark{position:fixed;z-index:95;pointer-events:none;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FFE79A,#FFC93C 62%,#B67F00);box-shadow:0 0 11px #FFC93C}
.chip.pop{animation:chippop .6s cubic-bezier(.2,.9,.2,1)}

<script type="module">
(async()=>{
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.projectId) return null;
  try{
    const {initializeApp}=await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js');
    const {getFirestore,doc,getDoc,setDoc,onSnapshot,collection,addDoc}=
      await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js');
    const {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,
           setPersistence,browserLocalPersistence}=
      await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js');
    const app=initializeApp(cfg);
    const auth=getAuth(app);
    /* remember the sign-in on this device, so reloading does not ask again */
    try{ await setPersistence(auth,browserLocalPersistence); }catch(e){}
    return {db:getFirestore(app),auth,doc,getDoc,setDoc,onSnapshot,collection,addDoc,
            onAuthStateChanged,signInWithEmailAndPassword,signOut};
  }catch(e){ console.warn('offline',e.message); return null; }
})().then(window.__fbDone);

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FB=null, CODE='', ROAD={weeks:[]}, DONE=new Set(), OWNED=new Set(), MARKS={}, SPENT=0, tab='map';
let SENT={}, BONUS=0;

(function(){const c=$('#sky');if(!c)return;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){c.style.display='none';return;}
 const x=c.getContext('2d');let st=[],W,H,dpr;
 function build(){dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;
  c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
  const n=Math.min(150,Math.round(innerWidth*innerHeight/11000));
  st=Array.from({length:n},(_,i)=>({
   x:Math.random()*W, y:Math.random()*H, r:(Math.random()*1.3+.3)*dpr,
   a:Math.random(), s:.005+Math.random()*.014,
   ember:i<n*0.34,                                   /* a third drift upward, glowing */
   vy:-(0.08+Math.random()*0.32)*dpr, vx:(Math.random()-.5)*0.14*dpr}));}
 function step(){x.clearRect(0,0,W,H);
  for(const s of st){
   s.a+=s.s;
   if(s.ember){
     s.y+=s.vy; s.x+=s.vx+Math.sin(s.a*1.6)*0.25*dpr;
     if(s.y<-12){ s.y=H+10; s.x=Math.random()*W; }
     const o=.35+Math.abs(Math.sin(s.a))*.65;
     x.globalAlpha=o;
     const g=x.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5);
     g.addColorStop(0,'#FFC08A'); g.addColorStop(.4,'#FF6B35'); g.addColorStop(1,'rgba(255,107,53,0)');
     x.fillStyle=g; x.beginPath(); x.arc(s.x,s.y,s.r*5,0,6.2832); x.fill();
     x.globalAlpha=Math.min(1,o+.2); x.fillStyle='#FFE0B0';
     x.beginPath(); x.arc(s.x,s.y,s.r*.8,0,6.2832); x.fill();
   } else {
     const o=.18+Math.abs(Math.sin(s.a))*.8; x.globalAlpha=o;
     x.fillStyle=o>.86?'#FFC93C':'#CFE6FF';
     x.beginPath(); x.arc(s.x,s.y,s.r,0,6.2832); x.fill();
   }}
  x.globalAlpha=1;requestAnimationFrame(step);}
 addEventListener('resize',build);build();step();})();

const coinsFor=m=>m>=75?60:m>=65?48:m>=50?36:m>=35?24:12;
function totals(){
  let c=DONE.size*5;
  for(const k in MARKS){ const r=MARKS[k]; c+=coinsFor(+r.mark||0); if(r.onTime) c+=25; }
  c+=BONUS;                                   /* coins sir has added by hand */
  return {earned:c, coins:c-SPENT};
}
const paperList=()=>Object.keys(MARKS).map(k=>({w:+k,...MARKS[k]})).sort((a,b)=>a.w-b.w);
function average(){ const p=paperList(); if(!p.length) return null;
  return Math.round(p.reduce((a,x)=>a+(+x.mark||0),0)/p.length); }
const gradeOf=a=>a===null?['\u2013','gW','no papers']:a>74?['A','gA','excellent']:a>64?['B','gB','very good']
  :a>49?['C','gC','credit']:a>34?['S','gS','pass']:['W','gW','weak'];
const rankOf=e=>[...RANKS].reverse().find(r=>e>=r[0]);
const nextRank=e=>RANKS.find(r=>e<r[0]);

let NAME='', UID='', PROFILE={};

let READY=false;
function showGate(){
  const sp=$('#splash'); if(sp){ sp.classList.add('out'); setTimeout(()=>sp.remove(),500); }
  $('#gate').classList.remove('hide');
}
async function boot(){
  $('#goBtn').disabled=true; $('#goBtn').style.opacity='.6';
  $('#gerr').textContent='Connecting…';
  FB=await window.FB_READY;
  if(!FB){ showGate();
    $('#gerr').innerHTML='Cannot reach the database.<br>'
    +'<span style="color:#93A0C8">firebase-config.js may be missing next to this page.</span>'; return; }
  READY=true;
  $('#goBtn').disabled=false; $('#goBtn').style.opacity='';
  $('#gerr').textContent='';
  FB.onAuthStateChanged(FB.auth, async u=>{
    if(!u){ showGate(); return; }
    const sp=$('#splashTx'); if(sp) sp.textContent='Welcome back\u2026';
    UID=u.uid;
    try{
      const d=await FB.getDoc(FB.doc(FB.db,'students',u.uid));
      if(!d.exists()){ $('#gerr').textContent='No student record found for this account.'; return; }
      PROFILE=d.data();
      CODE=PROFILE.code||'';
      NAME=PROFILE.name||'Student';
      if(!CODE){ $('#goBtn').disabled=false;
        showGate(); $('#gerr').textContent='Your account has no student number yet. Ask sir to add one.'; return; }
    }catch(e){
      $('#goBtn').disabled=false;
      showGate();
      $('#gerr').innerHTML=/permission/i.test(e.code||'')
        ? 'Your account cannot read its own record.<br><span style="color:#93A0C8">Sir needs to update the database rules.</span>'
        : 'Could not read your record: '+(e.code||e.message);
      return; }
    await loadAll();
    launch();
  });
}
boot();

async function loadAll(){
  try{ const d=await FB.getDoc(FB.doc(FB.db,'site','roadmap'));
       if(d.exists()&&d.data().json) ROAD=JSON.parse(d.data().json); }catch(e){}
  try{ const j=await FB.getDoc(FB.doc(FB.db,'journey',CODE));
       if(j.exists()){ DONE=new Set(j.data().done||[]); OWNED=new Set(j.data().owned||[]);
                       SPENT=+j.data().spent||0; SENT=j.data().sent||{}; } }catch(e){}
  try{ FB.onSnapshot(FB.doc(FB.db,'marks',CODE),s=>{
         const d=s.exists()?s.data():{};
         const before=BONUS, hadMarks=Object.keys(MARKS).length;
         MARKS=d.weeks||{}; BONUS=+d.bonus||0;
         const live=!$('#app').classList.contains('hide');
         if(live && BONUS>before) coinBurst(BONUS-before,'from sir');
         else if(live && Object.keys(MARKS).length>hadMarks) coinBurst(0,'a paper was marked');
         if(live) paint(); }); }catch(e){}
}
function launch(){

  $('#gate').classList.add('hide');
  const app=$('#app');

  requestAnimationFrame(()=>{ app.style.opacity='1'; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    setTimeout(()=>w.classList.add('go'),420);
  }));
  setTimeout(()=>{ w.classList.remove('on','go'); },2100);
}
async function enter(){
  if(!READY){                       /* clicked before Firebase finished loading */

}

/* a gain worth noticing */
function coinBurst(n,why){
  const b=$('#burst'); if(!b) return;
  b.querySelector('b').textContent=(n>0?'+':'')+n;
  b.querySelector('span').textContent=why||'coins';
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
  const chip=$('.chip'); if(chip){ chip.classList.remove('pop'); void chip.offsetWidth; chip.classList.add('pop'); }
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) sparks();
  try{ const A=new (window.AudioContext||window.webkitAudioContext)();
    [880,1320,1760].forEach((f,i)=>{ const o=A.createOscillator(), g=A.createGain();
      o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0,A.currentTime+i*.07);
      g.gain.linearRampToValueAtTime(.22,A.currentTime+i*.07+.02);
      g.gain.exponentialRampToValueAtTime(.001,A.currentTime+i*.07+.3);
      o.connect(g); g.connect(A.destination);
      o.start(A.currentTime+i*.07); o.stop(A.currentTime+i*.07+.32); });
  }catch(e){}
}
function sparks(){
  const cx=innerWidth/2, cy=innerHeight*0.36;
  for(let i=0;i<18;i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.left=cx+'px'; s.style.top=cy+'px'; document.body.appendChild(s);
    const a=Math.random()*Math.PI*2, d=90+Math.random()*190;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+120}px) scale(.2)`,opacity:0}],
      {duration:1100+Math.random()*700,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}
/* count up rather than jumping */
let shownCoins=null, rollT=null;
function rollCoins(to){
  const el=$('#coinN'); if(!el) return;
  if(shownCoins===null){ shownCoins=to; el.textContent=to; return; }
  const from=shownCoins; shownCoins=to;
  if(from===to){ el.textContent=to; return; }
  clearInterval(rollT); const t0=performance.now(), dur=900;
  rollT=setInterval(()=>{
    const k=Math.min(1,(performance.now()-t0)/dur);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    if(k>=1) clearInterval(rollT);
  },30);
}

const weekNow=()=>{ const t=Date.now();
  for(let i=0;i<ROAD.weeks.length;i++){ const w=ROAD.weeks[i];
    if(!w.to || t < new Date(w.to).getTime()+864e5) return i; }
  return Math.max(0,ROAD.weeks.length-1); };

function paint(){

  const rk=rankOf(t.earned), nx=nextRank(t.earned);
  $('#av').textContent=(NAME||'?').trim().charAt(0).toUpperCase();

  rollCoins(t.coins);

  const lo=rk[0], hi=nx?nx[0]:rk[0]+1;

function runGate(g){

           NOR:(a,b)=>!(a||b),XOR:(a,b)=>a!==b}[g];

    .map(p=>p[0]+' '+p[1]+' \u2192 '+(f(!!p[0],!!p[1])?1:0)).join('<br>');
}

/* ===== Boolean algebra: parse, then simplify by named laws ===== */
const V=n=>({t:'v',n}), C=k=>({t:'c',k}),
      NOT=a=>({t:'not',a}), AND=g=>({t:'and',g}), OR=g=>({t:'or',g});

function parseBool(src){
  let s=String(src||'').replace(/\s+/g,'').replace(/\u2019/g,"'").toUpperCase();
  if(!s) throw 'empty';
  if(!/^[A-D01.+'!^()~]+$/.test(s)) throw 'Use only A to D and . + \u2019 ! ^ ( )';
  let i=0;
  const peek=()=>s[i], eat=c=>{ if(s[i]===c){i++;return true;} return false; };
  function primary(){
    let node;
    if(eat('(')){ node=orExpr(); if(!eat(')')) throw 'missing )'; }
    else if(eat('!')||eat('~')){ return NOT(primary()); }
    else if(/[A-D]/.test(peek()||'')){ node=V(s[i++]); }
    else if(peek()==='0'||peek()==='1'){ node=C(s[i++]==='1'?1:0); }
    else throw 'unexpected '+(peek()||'end');
    while(eat("'")) node=NOT(node);
    return node;
  }
  function andExpr(){ const g=[primary()];
    while(true){ if(eat('.')) g.push(primary());
      else if(/[A-D(!~]/.test(peek()||'')) g.push(primary());   /* AB means A.B */
      else break; }
    return g.length>1?AND(g):g[0]; }
  function xorExpr(){ let l=andExpr();
    while(eat('^')){ const r=andExpr();
      l=OR([AND([l,NOT(r)]),AND([NOT(l),r])]); }        /* expand XOR */
    return l; }
  function orExpr(){ const g=[xorExpr()];
    while(eat('+')) g.push(xorExpr());
    return g.length>1?OR(g):g[0]; }
  const out=orExpr();
  if(i<s.length) throw 'cannot read from "'+s.slice(i)+'"';
  return out;
}

function show(n,top){
  if(n.t==='v') return n.n;
  if(n.t==='c') return String(n.k);
  if(n.t==='not'){ const a=n.a;
    return (a.t==='v'||a.t==='c')? show(a)+'\u2019' : '('+show(a,true)+')\u2019'; }
  if(n.t==='and') return n.g.map(x=>x.t==='or'?'('+show(x,true)+')':show(x)).join('.');
  if(n.t==='or'){ const b=n.g.map(show).join(' + '); return b; }
  return '?';
}
const key=n=>{
  if(n.t==='v') return n.n;
  if(n.t==='c') return '#'+n.k;
  if(n.t==='not') return '!'+key(n.a);
  return n.t+'('+n.g.map(key).sort().join(',')+')';
};
const same=(a,b)=>key(a)===key(b);
const isNotOf=(a,b)=>(a.t==='not'&&same(a.a,b))||(b.t==='not'&&same(b.a,a));

/* flatten nested AND/AND and OR/OR */
function flat(n){
  if(n.t==='not') return NOT(flat(n.a));
  if(n.t==='and'||n.t==='or'){
    const g=[];
    n.g.map(flat).forEach(x=>{ if(x.t===n.t) g.push(...x.g); else g.push(x); });
    return g.length===1?g[0]:(n.t==='and'?AND(g):OR(g));
  }
  return n;
}

/* one pass of the laws; returns {node,rule,was,now} or null */
function stepOnce(n){
  let hit=null;
  const walk=node=>{
    if(hit) return node;
    node=flat(node);
    if(node.t==='not'){
      const a=walk(node.a); if(hit) return NOT(a);
      if(a.t==='not'){ hit={rule:'Double negation',law:'(x\u2019)\u2019 = x'}; return a.a; }
      if(a.t==='c'){ hit={rule:'Constant',law:'0\u2019 = 1'}; return C(a.k?0:1); }
      if(a.t==='and'){ hit={rule:'De Morgan',law:'(x.y)\u2019 = x\u2019 + y\u2019'};
        return OR(a.g.map(NOT)); }
      if(a.t==='or'){ hit={rule:'De Morgan',law:'(x+y)\u2019 = x\u2019.y\u2019'};
        return AND(a.g.map(NOT)); }
      return NOT(a);
    }
    if(node.t==='and'||node.t==='or'){
      const isAnd=node.t==='and';
      let g=node.g.map(walk); if(hit) return isAnd?AND(g):OR(g);
      g=flat(isAnd?AND(g):OR(g)).g||g;

      /* idempotent  x.x = x   /  x+x = x */
      for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++)
        if(same(g[i],g[j])){ hit={rule:'Idempotent',law:isAnd?'x.x = x':'x+x = x'};
          const h=g.slice(); h.splice(j,1); return h.length===1?h[0]:(isAnd?AND(h):OR(h)); }

      /* complement  x.x\u2019 = 0  /  x+x\u2019 = 1 */
      for(let i=0;i<g.length;i++) for(let j=i+1;j<g.length;j++)
        if(isNotOf(g[i],g[j])){ hit={rule:'Complement',law:isAnd?'x.x\u2019 = 0':'x+x\u2019 = 1'};
          return C(isAnd?0:1); }

      /* identity and domination */
      for(let i=0;i<g.length;i++) if(g[i].t==='c'){
        const k=g[i].k;
        if((isAnd&&k===1)||(!isAnd&&k===0)){
          hit={rule:'Identity',law:isAnd?'x.1 = x':'x+0 = x'};
          const h=g.slice(); h.splice(i,1); return h.length===1?h[0]:(isAnd?AND(h):OR(h)); }
        hit={rule:'Domination',law:isAnd?'x.0 = 0':'x+1 = 1'}; return C(isAnd?0:1);
      }

      /* absorption  x + x.y = x   /  x.(x+y) = x */
      for(let i=0;i<g.length;i++) for(let j=0;j<g.length;j++){
        if(i===j) continue;
        const a=g[i], b=g[j];
        if(b.t===(isAnd?'or':'and') && b.g.some(x=>same(x,a))){
          hit={rule:'Absorption',law:isAnd?'x.(x+y) = x':'x + x.y = x'};
          const h=g.slice(); h.splice(j,1); return h.length===1?h[0]:(isAnd?AND(h):OR(h)); }
      }

      /* x + x\u2019.y = x + y  (and its dual) */
      for(let i=0;i<g.length;i++) for(let j=0;j<g.length;j++){
        if(i===j) continue;
        const a=g[i], b=g[j];
        if(b.t===(isAnd?'or':'and')){
          const idx=b.g.findIndex(x=>isNotOf(x,a));
          if(idx>=0){ hit={rule:'Absorption (second form)',
              law:isAnd?'x.(x\u2019+y) = x.y':'x + x\u2019.y = x + y'};
            const rest=b.g.filter((_,k)=>k!==idx);
            const nb=rest.length===1?rest[0]:(isAnd?OR(rest):AND(rest));
            const h=g.slice(); h[j]=nb; return isAnd?AND(h):OR(h); }
        }
      }

      /* factor out a common term: x.y + x.z = x.(y+z) */
      if(!isAnd){
        const terms=g.filter(x=>x.t==='and');
        if(terms.length>1){
          const counts={};
          terms.forEach(t=>t.g.forEach(f=>{ counts[key(f)]=(counts[key(f)]||0)+1; }));
          const common=Object.keys(counts).find(k=>counts[k]===terms.length&&terms.length===g.length);
          if(common){
            const f=terms[0].g.find(x=>key(x)===common);
            const rest=terms.map(t=>{ const r=t.g.filter(x=>key(x)!==common);
              return r.length===0?C(1):r.length===1?r[0]:AND(r); });
            hit={rule:'Distributive',law:'x.y + x.z = x.(y+z)'};
            return AND([f,OR(rest)]);
          }
        }
      }
      return isAnd?AND(g):OR(g);
    }
    return node;
  };
  const out=walk(n);
  return hit?{node:flat(out),...hit}:null;
}

function simplify(src){
  let n=flat(parseBool(src));
  const steps=[{expr:show(n),rule:'Start',law:''}];
  for(let i=0;i<60;i++){
    const r=stepOnce(n);
    if(!r) break;
    n=r.node;
    const e=show(n);
    if(steps[steps.length-1].expr===e && steps[steps.length-1].rule===r.rule) break;
    steps.push({expr:e,rule:r.rule,law:r.law});
  }
  return {steps,final:show(n),node:n};
}

/* truth table, used to prove the simplification is honest */
function tableOf(node,vars){
  const ev=(n,env)=>{
    if(n.t==='v') return env[n.n]?1:0;
    if(n.t==='c') return n.k;
    if(n.t==='not') return ev(n.a,env)?0:1;
    if(n.t==='and') return n.g.every(x=>ev(x,env))?1:0;
    return n.g.some(x=>ev(x,env))?1:0;
  };
  const rows=[];
  for(let i=0;i<(1<<vars.length);i++){
    const env={}; vars.forEach((v,k)=>env[v]=(i>>(vars.length-1-k))&1);
    rows.push({bits:vars.map(v=>env[v]),q:ev(node,env)});
  }
  return rows;
}
const varsIn=n=>{ const out=new Set();
  (function w(x){ if(x.t==='v') out.add(x.n); else if(x.t==='not') w(x.a);
    else if(x.g) x.g.forEach(w); })(n);
  return [...out].sort(); };

/* ---- base converter across four bases ---- */
function bindBin(){
  const i=document.querySelector('.t-bin');
  const go=()=>{ $('.o-bin').innerHTML=runBases(i.value); };
  i.oninput=go; i.value=i.value||'45'; go();
}
function runBases(v){
  v=String(v||'').trim().toLowerCase().replace(/\s+/g,'');
  if(!v) return '<div class="empty">Type a number.</div>';
  let n=NaN, from='denary';
  if(/^0b[01]+$/.test(v)){ n=parseInt(v.slice(2),2); from='binary'; }
  else if(/^0o[0-7]+$/.test(v)){ n=parseInt(v.slice(2),8); from='octal'; }
  else if(/^0x[0-9a-f]+$/.test(v)){ n=parseInt(v.slice(2),16); from='hexadecimal'; }
  else if(/^[01]{4,}$/.test(v)){ n=parseInt(v,2); from='binary (all ones and noughts)'; }
  else if(/^\d+$/.test(v)) n=parseInt(v,10);
  else if(/^[0-9a-f]+$/.test(v)){ n=parseInt(v,16); from='hexadecimal'; }   /* 2D, FF, ABC */
  else return '<div style="color:#FF4D6D">I cannot read that. Try 45, 2D, 0b101101, 0o55 or 0x2D.</div>';
  if(!isFinite(n)||n<0) return '<div style="color:#FF4D6D">Whole numbers from 0 upward only.</div>';
  if(n>4294967295) return '<div style="color:#FF4D6D">That is larger than 32 bits.</div>';
  const b=n.toString(2), o=n.toString(8), h=n.toString(16).toUpperCase();
  const nib=b.padStart(Math.ceil(b.length/4)*4,'0').replace(/(.{4})/g,'$1 ').trim();
  const place=b.split('').reverse().map((d,k)=>d==='1'?Math.pow(2,k):0).filter(Boolean).reverse();
  const row=(lab,val,note)=>'<div class="baserow"><b>'+lab+'</b><div><div class="baseval">'+val+'</div>'+
    (note?'<div style="font-family:var(--m);font-size:11.5px;color:#6A77A0;margin-top:3px">'+note+'</div>':'')+'</div></div>';
  return '<div style="font-family:var(--m);font-size:11.5px;color:#93A0C8;margin-bottom:6px">'+
      'read as '+from+'</div>'+
    row('Denary',n.toLocaleString(),'base 10')+
    row('Binary',nib,'base 2 \u00b7 '+b.length+' bits \u00b7 '+place.join(' + ')+' = '+n)+
    row('Octal',o,'base 8 \u00b7 three bits to a digit')+
    row('Hex',h,'base 16 \u00b7 four bits to a digit')+
    '<div style="margin-top:16px;font-family:var(--m);font-size:12.5px;color:#93A0C8;line-height:2">'+
      'Binary to hex: split into fours from the right \u2192 <b style="color:#38E1FF">'+nib+'</b> \u2192 '+
      '<b style="color:#38E1FF">'+h+'</b></div>';
}

/* ---- expression solver with the laws named ---- */
function runBool(src){
  if(!String(src||'').trim()) return '<div class="empty">Type an expression.</div>';
  let r;
  try{ r=simplify(src); }
  catch(e){ return '<div style="color:#FF4D6D">'+esc(String(e))+'</div>'; }
  const vs=varsIn(r.node).length?varsIn(r.node):varsIn(parseBool(src));
  let proof='';
  try{
    const a=tableOf(parseBool(src),vs), b=tableOf(r.node,vs);
    const same=a.every((x,i)=>x.q===b[i].q);
    proof='<div class="pane" style="margin-top:14px"><h5>Truth table</h5><table class="tt"><thead><tr>'+
      vs.map(v=>'<th>'+v+'</th>').join('')+'<th>Q</th></tr></thead><tbody>'+
      a.map((row,i)=>'<tr>'+row.bits.map(x=>'<td class="'+(x?'one':'zero')+'">'+x+'</td>').join('')+
        '<td class="'+(row.q?'one':'zero')+'">'+row.q+'</td></tr>').join('')+
      '</tbody></table><div style="font-family:var(--m);font-size:12.5px;margin-top:10px;color:'+
        (same?'#7CF29B':'#FF4D6D')+'">'+
        (same?'The simplified form gives the same answer on every row.':'Something is wrong \u2014 tell sir.')+
      '</div></div>';
  }catch(e){}
  const steps=r.steps.slice(1);
  let best=r.final, note='';
  try{
    const mm=minimise(tableOf(parseBool(src),vs),vs);
    if(mm.text && mm.text.replace(/\s/g,'').length < r.final.replace(/\s/g,'').length){
      best=mm.text;
      note='<div style="font-family:var(--m);font-size:12.5px;color:#FFC93C;margin-top:9px">'+
        'The rewriting above stops at <b>'+esc(r.final)+'</b>. Grouping the truth table goes further '+
        'and reaches <b>'+esc(mm.text)+'</b> \u2014 the <b>Redundancy law</b>, where a term that is already '+
        'covered by the others can be dropped.</div>';
    }
  }catch(e){}
  return '<div class="pane"><h5>Simplest form</h5>'+
      '<div style="font-family:var(--m);font-size:clamp(20px,3.4vw,28px);color:#7CF29B">'+esc(best)+'</div>'+note+'</div>'+
    '<div class="pane" style="margin-top:14px"><h5>How it got there</h5>'+
      '<div class="step"><i>0</i><span style="flex:1"><b>'+esc(r.steps[0].expr)+'</b>'+
        '<span>what you typed</span></span></div>'+
      (steps.length?steps.map((st,k)=>'<div class="step"><i>'+(k+1)+'</i><span style="flex:1">'+
        '<b>'+esc(st.expr)+'</b><span>'+esc(st.rule)+(st.law?' \u2014 '+esc(st.law):'')+'</span></span></div>').join('')
        :'<div style="font-family:var(--m);font-size:13px;color:#93A0C8;padding:8px 0">'+
          'Already as simple as it gets.</div>')+
    '</div>'+proof;
}

/* ---- sql result as a real table ---- */
function sqlTable(rows,cols){

  return '<table class="tt"><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+

    rows.length+' row'+(rows.length===1?'':'s')+'</div>';
}

/* Quine-McCluskey: the honest minimum, which algebraic rewriting alone misses */
function minimise(rows,vars){
  const n=vars.length;
  const ones=rows.filter(r=>r.q).map(r=>r.bits.reduce((a,b)=>a*2+b,0));
  if(!ones.length) return {terms:[],text:'0'};
  if(ones.length===(1<<n)) return {terms:[],text:'1'};
  const bitsOf=(m)=>m.toString(2).padStart(n,'0');
  let groups=ones.map(m=>({mask:bitsOf(m),cov:[m],used:false}));
  const primes=[];
  while(groups.length){
    const next=[], seen=new Set();
    for(let i=0;i<groups.length;i++)
      for(let j=i+1;j<groups.length;j++){
        const a=groups[i], b=groups[j];
        let diff=-1, ok=true;
        for(let k=0;k<n;k++){
          if(a.mask[k]!==b.mask[k]){ if(diff>=0){ok=false;break;} diff=k; }
        }
        if(!ok||diff<0) continue;
        a.used=b.used=true;
        const m=a.mask.slice(0,diff)+'-'+a.mask.slice(diff+1);
        if(seen.has(m)) continue; seen.add(m);
        next.push({mask:m,cov:[...new Set([...a.cov,...b.cov])],used:false});
      }
    groups.forEach(g=>{ if(!g.used) primes.push(g); });
    groups=next;
  }
  /* essential primes first, then cover what is left */
  const chart={}; ones.forEach(m=>chart[m]=primes.filter(p=>p.cov.includes(m)));
  const chosen=[], covered=new Set();
  ones.forEach(m=>{ if(chart[m].length===1 && !chosen.includes(chart[m][0])){
    chosen.push(chart[m][0]); chart[m][0].cov.forEach(x=>covered.add(x)); }});
  while(covered.size<ones.length){
    let best=null, gain=-1;
    primes.forEach(p=>{ if(chosen.includes(p)) return;
      const g=p.cov.filter(x=>!covered.has(x)).length;
      if(g>gain){ gain=g; best=p; }});
    if(!best||gain<=0) break;
    chosen.push(best); best.cov.forEach(x=>covered.add(x));
  }
  const termText=p=>{
    const parts=[];
    for(let k=0;k<n;k++){ if(p.mask[k]==='-') continue;
      parts.push(vars[k]+(p.mask[k]==='0'?'\u2019':'')); }
    return parts.length?parts.join('.'):'1';
  };
  const terms=chosen.map(termText).sort((a,b)=>a.length-b.length||a.localeCompare(b));
  return {terms, text:terms.join(' + '), dropped:primes.length-chosen.length};
}


/* ---- signed numbers ---- */
function runTwos(v){
  return twosBench(v);
}
function twosBench(v){
  v=String(v||'').trim();
  if(!v) return '<div class="empty">Type a number, or eight bits.</div>';
  const row=(i,title,bits,why)=>'<div class="step"><i>'+i+'</i><span style="flex:1">'+
    '<b style="font-size:18px;letter-spacing:.12em">'+bits+'</b>'+
    '<span>'+title+(why?' \u2014 '+why:'')+'</span></span></div>';
  const grp=b=>b.replace(/(.{4})/g,'$1 ').trim();

  if(/^[01]{8}$/.test(v)){
    const u=parseInt(v,2), neg=v[0]==='1';
    const ones=v.split('').map(b=>b==='1'?'0':'1').join('');
    const back=(parseInt(ones,2)+1)&255;
    return '<div class="pane"><h5>Reading eight bits back</h5>'+
      row(1,'the bits you gave',grp(v),'top bit is '+v[0]+', so '+(neg?'negative':'positive'))+
      row(2,'as unsigned',String(u),'straight binary')+
      (neg?row(3,'flip every bit',grp(ones),'one\u2019s complement')+
           row(4,'add one',grp(back.toString(2).padStart(8,'0')),'gives '+back+', so the value is \u2212'+back)
        :'')+
      '<div style="font-family:var(--m);font-size:19px;color:#7CF29B;margin-top:14px">'+
        'signed value = '+(neg?'\u2212'+back:u)+'</div></div>';
  }
  const n=parseInt(v,10);
  if(!isFinite(n)) return '<div style="color:#FF4D6D">Give a denary number, or eight bits such as 11010011.</div>';
  if(n<-128||n>127) return '<div style="color:#FF4D6D">Eight bits hold \u2212128 to 127 only.</div>';
  const mag=Math.abs(n).toString(2).padStart(8,'0');
  if(n>=0) return '<div class="pane"><h5>Positive numbers need no work</h5>'+
    row(1,'the number',String(n),'')+
    row(2,'in eight bits',grp(mag),'top bit 0 marks it positive')+
    '<div style="font-family:var(--m);font-size:13px;color:#93A0C8;margin-top:12px">'+
      'One\u2019s and two\u2019s complement only differ from plain binary for negative numbers.</div></div>';
  const ones=mag.split('').map(b=>b==='1'?'0':'1').join('');
  const twos=(parseInt(ones,2)+1).toString(2).padStart(8,'0').slice(-8);
  return '<div class="pane"><h5>One\u2019s complement</h5>'+
      row(1,'take the size, ignoring the sign',grp(mag),Math.abs(n)+' in binary')+
      row(2,'flip every bit',grp(ones),'0 becomes 1, 1 becomes 0')+
      '<div style="font-family:var(--m);font-size:17px;color:#38E1FF;margin-top:10px">'+
        n+' in one\u2019s complement = '+grp(ones)+'</div></div>'+
    '<div class="pane" style="margin-top:14px"><h5>Two\u2019s complement</h5>'+
      row(3,'start from the one\u2019s complement',grp(ones),'')+
      row(4,'add one',grp(twos),'this is the form computers actually use')+
      '<div style="font-family:var(--m);font-size:19px;color:#7CF29B;margin-top:10px">'+
        n+' in two\u2019s complement = '+grp(twos)+'</div>'+
      '<div style="font-family:var(--m);font-size:12.5px;color:#93A0C8;margin-top:10px">'+
        'Check: '+grp(mag)+' + '+grp(twos)+' overflows to zero, which is what a negative should do.</div></div>';
}
/* ---- storage and transfer ---- */
function runStore(v){
  const src=String(v||'').trim();
  if(!src) return '<div class="empty">Type a size, such as 8 GB.</div>';
  const m=src.match(/^([\d.]+)\s*(bits?|bytes?|kb|mb|gb|tb|b)\b/i);
  if(!m) return '<div style="color:#FF4D6D">Try <b>8 GB</b>, <b>700 MB</b>, or <b>2 GB over 20 Mbps</b>.</div>';
  const amount=parseFloat(m[1]), unit=m[2].toLowerCase();
  const STEP={bit:-1,bits:-1,b:0,byte:0,bytes:0,kb:1,mb:2,gb:3,tb:4};
  const step=STEP[unit];
  if(step===undefined) return '<div style="color:#FF4D6D">I do not know that unit.</div>';
  /* the plain figure counts in thousands, the power of two counts in 1024s */
  const bytesDec = step<0 ? amount/8 : amount*Math.pow(1000,step);
  const bytesBin = step<0 ? amount/8 : amount*Math.pow(1024,step);

  const UNITS=[['Terabytes','TB',4],['Gigabytes','GB',3],['Megabytes','MB',2],
               ['Kilobytes','KB',1],['Bytes','bytes',0],['Bits','bits',-1]];
  const fm=x=>x>=1?x.toLocaleString(undefined,{maximumFractionDigits:3})
                  :x.toPrecision(3).replace(/0+$/,'');
  const sup={'-':'\u207B',0:'\u2070',1:'\u00B9',2:'\u00B2',3:'\u00B3',4:'\u2074',
             5:'\u2075',6:'\u2076',7:'\u2077',8:'\u2078',9:'\u2079'};
  const pw=n=>String(n).split('').map(c=>sup[c]||c).join('');

  const rows=UNITS.map(([name,abbr,k])=>{
    const dec = k<0 ? bytesDec*8 : bytesDec/Math.pow(1000,k);
    const bin = k<0 ? bytesBin*8 : bytesBin/Math.pow(1024,k);
    const e=Math.log2(bin);
    const exact=Math.abs(e-Math.round(e))<1e-9 && bin>0;
    const power = exact ? '2'+pw(Math.round(e))+' '+abbr
      : '<span style="color:#6A77A0">'+fm(bin)+' '+abbr+'</span>';
    return '<tr><td style="color:#93A0C8">'+name+'</td>'+
      '<td style="font-size:16px">'+fm(dec)+' <span style="color:#6A77A0">'+abbr+'</span></td>'+
      '<td style="font-size:17px;color:'+(exact?'#FFC93C':'#6A77A0')+'">'+power+'</td></tr>';
  }).join('');

  let out='<div class="pane"><h5>'+fm(amount)+' '+unit.toUpperCase()+'</h5>'+
    '<table class="tt"><thead><tr><th>Unit</th>'+
      '<th>Counting in thousands</th><th>As a power of two</th></tr></thead><tbody>'+
      rows+'</tbody></table>'+
    '<div style="font-family:var(--m);font-size:12.5px;color:#93A0C8;margin-top:14px;line-height:2">'+
      'The middle column divides by 1000 each step \u2014 that is what a shop writes on the box.<br>'+
      'The right column divides by 1024, so the answer lands on a clean power of two. '+
      'That is what the computer actually counts in.</div></div>';

  const sp=src.match(/(?:over|at|\/)\s*([\d.]+)\s*([kmg])?bps/i);
  if(sp){
    const mult={k:1e3,m:1e6,g:1e9}[(sp[2]||'').toLowerCase()]||1;
    const bps=parseFloat(sp[1])*mult, secs=bytesDec*8/bps;
    const t=secs<60?secs.toFixed(1)+' seconds'
      :secs<3600?Math.floor(secs/60)+' min '+Math.round(secs%60)+' s'
      :Math.floor(secs/3600)+' h '+Math.round(secs%3600/60)+' min';
    out+='<div class="pane" style="margin-top:14px"><h5>Transfer time</h5>'+
      '<div style="font-family:var(--m);font-size:26px;color:#7CF29B">'+t+'</div>'+
      '<div style="font-family:var(--m);font-size:12.5px;color:#93A0C8;margin-top:9px;line-height:2">'+
        fm(bytesDec*8)+' bits \u00f7 '+fm(bps)+' bits per second<br>'+
        'Line speeds are quoted in <b>bits</b>, file sizes in <b>bytes</b> \u2014 that factor of 8 is the usual trap.'+
      '</div></div>';
  }
  return out;
}

const SQLROWS=[
 {id:1,name:'Nimali',city:'Colombo',grade:'A',marks:88},
 {id:2,name:'Kasun', city:'Gampaha',grade:'B',marks:72},
 {id:3,name:'Dilki', city:'Colombo',grade:'C',marks:58},
 {id:4,name:'Sahan', city:'Kandy',  grade:'A',marks:91},
 {id:5,name:'Tharu', city:'Gampaha',grade:'S',marks:44},
 {id:6,name:'Ishara',city:'Colombo',grade:'B',marks:67}];
function runSql(q){
  q=String(q||'').trim().replace(/;$/,''); if(!q) return '';
  const m=q.match(/^select\s+(.+?)\s+from\s+student(?:\s+where\s+(.+?))?(?:\s+order\s+by\s+(\w+)(?:\s+(asc|desc))?)?(?:\s+limit\s+(\d+))?$/i);
  if(!m) return '<span style="color:#FF4D6D">Only SELECT \u2026 FROM student works here.</span>';
  const cols=m[1].trim()==='*'?['id','name','city','grade','marks']
    :m[1].split(',').map(c=>c.trim().toLowerCase());
  const bad=cols.find(c=>!['id','name','city','grade','marks'].includes(c));
  if(bad) return '<span style="color:#FF4D6D">There is no column called '+esc(bad)+'.</span>';
  let rows=SQLROWS.slice();
  if(m[2]){
    const parts=m[2].split(/\s+(and|or)\s+/i);
    const test=r=>{
      let acc=null, op=null;
      for(let i=0;i<parts.length;i++){
        if(/^(and|or)$/i.test(parts[i])){ op=parts[i].toLowerCase(); continue; }
        const c=parts[i].match(/^(\w+)\s*(>=|<=|<>|!=|=|>|<|like)\s*'?([^']*)'?$/i);
        if(!c) return false;
        const f=c[1].toLowerCase(), o=c[2].toLowerCase();
        let a=r[f], b=c[3].trim();
        if(a===undefined) return false;
        if(typeof a==='number') b=parseFloat(b);
        let ok = o==='='?a==b : o==='>'?a>b : o==='<'?a<b : o==='>='?a>=b : o==='<='?a<=b
          : (o==='<>'||o==='!=')?a!=b
          : new RegExp('^'+String(b).replace(/%/g,'.*')+'$','i').test(String(a));
        acc = acc===null?ok : op==='or'?(acc||ok):(acc&&ok);
      }
      return !!acc;
    };
    rows=rows.filter(test);
  }
  if(m[3]){ const k=m[3].toLowerCase(), d=(m[4]||'asc').toLowerCase()==='desc'?-1:1;
    rows.sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*d); }
  if(m[5]) rows=rows.slice(0,+m[5]);
  if(!rows.length) return '<span style="color:#93A0C8">0 rows.</span>';
  return '<b>'+cols.join(' | ')+'</b><br>'+
    rows.map(r=>cols.map(c=>r[c]).join(' | ')).join('<br>')+
    '<br><span style="color:#93A0C8">'+rows.length+' row'+(rows.length===1?'':'s')+'</span>';
}
/* ---- step through a small program ---- */
function runTrace(src){
  const lines=String(src||'').split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
  if(!lines.length) return '';
  const vars={}, out=[]; let steps=0;
  const val=e=>{
    e=e.trim();
    if(!/^[\w\s+\-*/%().<>=!]+$/.test(e)) throw 'bad expression';
    const names=[...new Set(e.match(/[a-z_]\w*/gi)||[])];
    const f=new Function(...names,'return ('+e+');');
    return f(...names.map(n=>vars[n]!==undefined?vars[n]:0));
  };
  const block=(from,to)=>{
    let i=from;
    while(i<to){
      if(++steps>4000) throw 'this runs too long';
      const L=lines[i];
      let m;
      if((m=L.match(/^(?:print|show|display)\s*\(?(.+?)\)?$/i))){
        out.push({ln:i+1,txt:String(val(m[1])),vars:{...vars}}); i++; continue; }
      if((m=L.match(/^(while|if|repeat)\s+(.+)$/i))){
        const kind=m[1].toLowerCase();
        let depth=1,j=i+1;
        while(j<to&&depth>0){ if(/^(while|if|repeat)\s+/i.test(lines[j])) depth++;
          else if(/^end$/i.test(lines[j])) depth--; if(depth>0) j++; }
        if(kind==='while'){ while(val(m[2])){ if(++steps>4000) throw 'this loops forever'; block(i+1,j); } }
        else if(kind==='repeat'){ const n=val(m[2]); for(let k=0;k<n;k++) block(i+1,j); }
        else if(val(m[2])) block(i+1,j);
        i=j+1; continue; }
      if(/^end$/i.test(L)){ i++; continue; }
      if((m=L.match(/^([a-z_]\w*)\s*=\s*(.+)$/i))){
        vars[m[1]]=val(m[2]);
        out.push({ln:i+1,txt:m[1]+' = '+vars[m[1]],vars:{...vars}}); i++; continue; }
      throw 'cannot read line '+(i+1)+': '+L;
    }
  };
  try{ block(0,lines.length); }
  catch(err){ return '<span style="color:#FF4D6D">'+esc(String(err))+'</span>'; }
  const shown=out.slice(-16);
  return shown.map(o=>'<span style="color:#6A77A0">'+String(o.ln).padStart(2)+'</span> '+esc(o.txt)).join('<br>')+
    '<br><span style="color:#93A0C8">final: '+
      Object.keys(vars).map(k=>k+'='+vars[k]).join(', ')+'</span>'+
    (out.length>16?'<br><span style="color:#6A77A0">(last 16 of '+out.length+' steps)</span>':'');
}
/* ---- SDLC order ---- */
const SDLC=['Preliminary study','Requirements analysis','Design','Development',
            'Testing','Deployment','Maintenance'];
let sdlcPick=[];
function drawSdlc(){
  const box=document.querySelector('.o-sdlc'); if(!box) return;
  const left=SDLC.filter(x=>!sdlcPick.includes(x));
  const right=sdlcPick.map((x,i)=>{
    const ok=SDLC[i]===x;
    return '<div style="padding:9px 12px;border-radius:9px;margin-bottom:6px;font-size:13.5px;'+
      'border:1px solid '+(ok?'#7CF29B':'#FF4D6D')+';background:'+(ok?'rgba(124,242,155,.12)':'rgba(255,77,109,.12)')+'">'+
      (i+1)+'. '+x+'</div>';}).join('');
  box.innerHTML='<div style="font-family:var(--m);font-size:11px;color:#6A77A0;margin-bottom:9px">'+
      'tap them in order, from first to last</div>'+
    '<div class="gates">'+left.map(x=>'<button class="sdlc-b" data-s="'+x+'">'+x+'</button>').join('')+'</div>'+
    (right?'<div style="margin-top:10px">'+right+'</div>':'')+
    (sdlcPick.length===SDLC.length
      ? (sdlcPick.every((x,i)=>SDLC[i]===x)
        ? '<div style="color:#7CF29B;font-family:var(--m);font-size:13px;margin-top:8px">All seven in order. That is the SDLC.</div>'
        : '<div style="color:#FF4D6D;font-family:var(--m);font-size:13px;margin-top:8px">Red ones are out of place.</div>')
      : '')+
    '<button class="btn b2" id="sdlcReset" style="margin-top:10px;padding:8px 14px">Start again</button>';
}

function runNet(v){
  const m=String(v).trim().match(/^(\d+)\.(\d+)\.(\d+)\.(\d+)\s*\/\s*(\d+)$/);
  if(!m) return 'Write it like 192.168.1.10/24';
  const o=m.slice(1,5).map(Number), bits=+m[5];
  if(o.some(x=>x>255)||bits>32) return 'Those numbers are out of range.';
  const ip=o.reduce((a,x)=>a*256+x,0), mask=bits===0?0:(~0<<(32-bits))>>>0;
  const net=(ip&mask)>>>0, bc=(net|(~mask>>>0))>>>0;
  const q=n=>[24,16,8,0].map(s=>(n>>>s)&255).join('.');
  const hosts=bits>=31?0:Math.pow(2,32-bits)-2;
  return 'network <b>'+q(net)+'</b><br>broadcast <b>'+q(bc)+'</b><br>mask <b>'+q(mask)+'</b><br>'+
    'first host <b>'+(hosts?q(net+1):'\u2014')+'</b><br>last host <b>'+(hosts?q(bc-1):'\u2014')+'</b><br>'+
    '<span style="color:#93A0C8">'+hosts+' usable addresses</span>';
}

function sendSheet(i){
  const w=ROAD.weeks[i]||{}, prev=SENT[i]||{};
  $('#sheetBody').innerHTML=
    '<div class="k">Mission '+String(i+1).padStart(2,'0')+'</div>'+
    '<h3>Send your answers</h3>'+
    '<div style="font-family:var(--m);font-size:12px;color:var(--dim)">'+esc(w.title||'')+'</div>'+
    '<ol style="margin:18px 0 0;padding-left:20px;line-height:2;font-size:14.6px;color:#93A0C8">'+
      '<li>Photograph every page and put them into <b style="color:#EAF0FF">one PDF</b>, in order.</li>'+
      '<li>Upload that PDF to your <b style="color:#EAF0FF">Google Drive</b>.</li>'+
      '<li>Right click it \u2192 <b style="color:#EAF0FF">Share</b> \u2192 change <i>Restricted</i> to '+
        '<b style="color:#EAF0FF">Anyone with the link</b>.</li>'+
      '<li>Change <b style="color:#EAF0FF">Viewer</b> to <b style="color:#FFC93C">Editor</b> \u2014 '+
        'sir writes your marks onto the paper itself.</li>'+
      '<li>Press <b style="color:#EAF0FF">Copy link</b> and paste it below.</li>'+
    '</ol>'+
    '<div class="tool" style="border-top:0"><input id="dl" placeholder="https://drive.google.com/file/d/..." '+
      'value="'+esc(prev.link||'')+'"></div>'+
    '<div id="dlMsg" style="font-family:var(--m);font-size:13px;margin-top:10px;line-height:1.8"></div>'+
    '<label class="task" style="border-top:0;padding-top:14px" id="edOk">'+
      '<span class="bx"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></span>'+
      '<span>Access is set to <b>Editor</b>, not Viewer</span></label>'+
    '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:6px">'+
      '<button class="btn b2" id="dlTest">Open my link to check</button>'+
      '<button class="btn b1" id="dlSend" data-i="'+i+'">Send to sir</button></div>';
  $('#ov').classList.add('on'); document.body.style.overflow='hidden';
  const box=$('#dl'); box.addEventListener('input',checkLink); checkLink();
  $('#dlTest').onclick=()=>{ const v=($('#dl').value||'').trim(); if(v) window.open(v,'_blank','noopener'); };
  $('#edOk').onclick=e=>{ e.preventDefault(); $('#edOk').classList.toggle('on'); };
}
function tidy(v){ return String(v||'').replace(/[\u200B-\u200D\uFEFF]/g,'').trim()
  .replace(/^["'<(\[]+|["'>)\].,;]+$/g,'').replace(/\s+/g,''); }
function driveId(u){ const m=u.match(/\/d\/([A-Za-z0-9_-]{10,})/)||u.match(/[?&]id=([A-Za-z0-9_-]{10,})/)
  ||u.match(/\/folders\/([A-Za-z0-9_-]{10,})/); return m?m[1]:null; }
function readLink(raw){
  let v=tidy(raw); if(!v) return {state:'empty'};
  if(!/^https?:\/\//i.test(v)){
    if(/^[\w.-]+\.[a-z]{2,}\//i.test(v)) v='https://'+v;
    else return {state:'bad',msg:'That is not a link. Use <b>Copy link</b> from the Share box in Drive.'};
  }
  let host=''; try{ host=new URL(v).hostname.toLowerCase(); }
  catch(e){ return {state:'bad',msg:'That link cannot be read.'}; }
  const google=/(^|\.)google\.com$/.test(host)||/(^|\.)googleusercontent\.com$/.test(host);
  const id=driveId(v);
  if(google&&/\/folders\//.test(v)) return {state:'ok',link:v,id,msg:'That is a folder \u2014 it works if the folder itself is shared as Editor.'};
  if(google&&id) return {state:'ok',link:v,id,msg:'Link looks right.'};
  if(google) return {state:'ok',link:v,id:'',msg:'Accepted. Sir will check it by hand.'};
  return {state:'ok',link:v,id:'',msg:'Not a Drive link. It will still be sent, but Drive is easier to mark.'};
}
function checkLink(){
  const el=$('#dl'), m=$('#dlMsg'); if(!el||!m) return true;
  const r=readLink(el.value);
  if(r.state==='empty'){ m.innerHTML=''; return true; }
  if(r.state==='bad'){ m.innerHTML='<span style="color:#FF4D6D">'+r.msg+'</span>'; return false; }
  m.innerHTML='<span style="color:'+(r.id?'#7CF29B':'#FFC93C')+'">'+r.msg+'</span>';
  return true;
}
async function doSend(i){
  const r=readLink($('#dl').value);
  if(r.state==='empty') return toast('Paste your Drive link first');
  if(r.state==='bad'){ checkLink(); return toast('That link cannot be read'); }
  if(!$('#edOk').classList.contains('on'))
    return toast('Confirm the access is set to Editor');
  const w=ROAD.weeks[i]||{};
  const late=w.paper&&w.paper.due ? Date.now()>new Date(w.paper.due).getTime()+864e5 : false;
  SENT[i]={link:r.link, at:new Date().toISOString(), late};
  save();
  if(FB&&UID){
    try{ await FB.setDoc(FB.doc(FB.db,'submissions',UID+'__JW'+i),{
      uid:UID, code:CODE, name:NAME, whatsapp:PROFILE.whatsapp||'', batch:PROFILE.batch||'',
      track:'journey', paper:'JW'+i, week:i,
      title:(w.title||('Week '+(i+1)))+' \u2014 weekend paper',
      link:r.link, fileId:r.id||'', late, at:new Date().toISOString(), marked:false });
    }catch(e){ return toast('Could not send: '+(e.code||e.message)); }
  }
  $('#ov').classList.remove('on'); document.body.style.overflow='';
  toast(late?'Sent \u2014 marked late':'Sent to sir');
  paint();
}

function openWeek(i){
  const w=ROAD.weeks[i]; if(!w) return;
  const m=MARKS[i];
  const L=(arr,t,icon)=>!(arr&&arr.length)?'':'<div class="sec"><h4>'+t+'</h4>'+
    arr.map(x=>'<a class="lnk" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+
      '<i>'+icon+'</i><span>'+esc(x.label||x.url)+'</span></a>').join('')+'</div>';
  $('#sheetBody').innerHTML=
    '<div class="k">Mission '+String(i+1).padStart(2,'0')+
      (w.from?' \u00B7 '+dshort(w.from)+' \u2013 '+dshort(w.to):'')+'</div>'+
    '<h3>'+esc(w.title||('Week '+(i+1)))+'</h3>'+
    '<div style="font-family:var(--m);font-size:12px;color:var(--dim)">'+esc(w.unit||'')+'</div>'+
    (w.brief?'<p style="color:var(--dim);margin:14px 0 0">'+esc(w.brief)+'</p>':'')+
    L(w.materials,'Study materials','\u25A4')+
    L(w.videos,'Recorded lessons','\u25B6')+
    ((w.tasks||[]).length?'<div class="sec"><h4>Exercises</h4>'+
      w.tasks.map((t,ti)=>{const k='w'+i+'t'+ti,on=DONE.has(k);
        return '<div class="task '+(on?'on':'')+'" data-k="'+k+'">'+
          '<span class="bx"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></span>'+
          '<span>'+esc(t)+'</span></div>';}).join('')+'</div>':'')+
    (w.paper&&w.paper.url?'<div class="sec"><h4>Weekend paper</h4><div class="pbox">'+
      '<b>'+esc(w.paper.title||'This week\u2019s paper')+'</b>'+
      '<div class="due">Write it on Saturday or Sunday'+
        (w.paper.due?' \u00B7 due '+dshort(w.paper.due):'')+'</div>'+
      '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:13px">'+
        '<a class="btn b1" href="'+esc(w.paper.url)+'" target="_blank" rel="noopener">Open paper</a>'+
        (m?'':'<button class="btn b2" data-send="'+i+'">'+(SENT[i]?'Change my link':'Send my answers')+'</button>')+
      '</div>'+
      (SENT[i]&&!m?'<div style="margin-top:12px;font-family:var(--m);font-size:12.5px;color:#7CF29B">'+
        'Sent '+esc(String(SENT[i].at||'').slice(0,10))+' \u00B7 waiting to be marked</div>':'')+
      (m?'<div style="margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.1)">'+
        '<div style="font-family:var(--m);font-size:13px;color:#7CF29B">Marked '+
          '<b style="font-size:19px">'+esc(m.mark)+'%</b>'+(m.onTime?' \u00B7 on time, +25 coins':' \u00B7 late')+'</div>'+
        (m.note?'<div style="color:#93A0C8;font-size:13.5px;margin-top:7px">'+esc(m.note)+'</div>':'')+
        (m.sheet?'<a class="btn b1" style="margin-top:12px" href="'+esc(m.sheet)+'" target="_blank" rel="noopener">'+
          'See my marked paper</a>':'')+
        '</div>':'')+
      '</div></div>':'');
  $('#ov').classList.add('on'); document.body.style.overflow='hidden';
}

document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-t]');
  if(tb){ tab=tb.dataset.t; $$('.tab').forEach(x=>x.classList.toggle('on',x===tb));
    $('#vMap').classList.toggle('hide',tab!=='map');
    $('#vMarks').classList.toggle('hide',tab!=='marks');
    $('#vShop').classList.toggle('hide',tab!=='shop');
    paint(); return; }
  const sd=e.target.closest('[data-send]'); if(sd) return sendSheet(+sd.dataset.send);
  if(e.target.id==='dlSend') return doSend(+e.target.dataset.i);
  const n=e.target.closest('[data-w]'); if(n) return openWeek(+n.dataset.w);
  const t=e.target.closest('[data-k]');
  if(t){ const k=t.dataset.k;
    if(DONE.has(k)) DONE.delete(k); else DONE.add(k);
    t.classList.toggle('on',DONE.has(k)); save(); paint();
    if(DONE.has(k)) coinBurst(5,'exercise done'); return; }
  const bu=e.target.closest('[data-buy]');
  if(bu){ const it=SHOP.find(x=>x.id===bu.dataset.buy); const t2=totals();
    if(!it||t2.coins<it.cost) return;
    OWNED.add(it.id); SPENT+=it.cost; save(); paint(); toast(it.n+' unlocked'); return; }
  const sb=e.target.closest('.sdlc-b');
  if(sb){ sdlcPick.push(sb.dataset.s); drawSdlc(); return; }
  if(e.target.id==='sdlcReset'){ sdlcPick=[]; drawSdlc(); return; }
  const ot=e.target.closest('[data-tool]'); if(ot) return openTool(ot.dataset.tool);
  const g=e.target.closest('.t-gate');
  if(g){ gateSel=g.dataset.g;
    if(gateSel==='NOT') gateB=0;
    drawGate(); return; }
  const pn=e.target.closest('[data-pin]');
  if(pn){ if(pn.dataset.pin==='a') gateA=gateA?0:1; else gateB=gateB?0:1; drawGate(); return; }
  if(e.target.closest('[data-close]')||e.target.classList.contains('ov')){
    $('#ov').classList.remove('on'); document.body.style.overflow=''; }
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('t-bin')) $('.o-bin').innerHTML=runBin(e.target.value);
  if(e.target.classList.contains('t-net')) $('.o-net').innerHTML=runNet(e.target.value);
  if(e.target.classList.contains('t-bool')) $('.o-bool').innerHTML=runBool(e.target.value);
  if(e.target.classList.contains('t-twos')) $('.o-twos').innerHTML=runTwos(e.target.value);
  if(e.target.classList.contains('t-store')) $('.o-store').innerHTML=runStore(e.target.value);
  if(e.target.classList.contains('t-sql')) $('.o-sql').innerHTML=runSql(e.target.value);
  if(e.target.classList.contains('t-trace')) $('.o-trace').innerHTML=runTrace(e.target.value);
  if(e.target.classList.contains('t-web')){
    const f=$('.o-web'); if(f) f.srcdoc='<style>body{font-family:system-ui;padding:14px}</style>'+e.target.value;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){
  $('#ov').classList.remove('on'); document.body.style.overflow=''; }});
