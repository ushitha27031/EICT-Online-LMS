<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:#eaf2ff;background:#071020;

*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 10% 0%,#153a62 0%,transparent 40%),radial-gradient(ellipse at 100% 100%,#3a1530 0%,transparent 35%),#071020;min-height:100vh}
.wrap{max-width:1080px;margin:auto;padding:28px 16px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{background:linear-gradient(135deg,#00d4b4,#2676ef);width:49px;height:49px;border-radius:15px;display:grid;place-items:center;color:#071020;font-weight:900;font-size:20px}
.brand strong{font-size:22px}.brand small{display:block;color:var(--dim)}
.lang{background:#172a47;color:white;border:1px solid #395476;border-radius:10px;padding:10px;cursor:pointer}
.back{color:var(--dim);font-size:13px;text-decoration:none;margin-right:10px}
.hero{padding:10px 0 22px}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.12;max-width:780px;margin:0 0 10px}
.hero p{max-width:720px;line-height:1.6;color:#b7c7de;margin:0}
.tag{color:#50e7c8;font-size:12px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase;margin-bottom:8px}
.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 40px #0003}
.chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid #2b4261}
.who{display:flex;align-items:center;gap:11px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00d4b4,#2676ef);display:grid;place-items:center;font-weight:900;color:#071020;position:relative;flex:none}
.av::after{content:'';position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#35e08f;border:2px solid var(--panel)}
.status{font-size:12px;color:#63e6bf}
.chat{height:470px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px;scroll-behavior:smooth}
.bubble{max-width:88%;padding:11px 14px;line-height:1.62;border-radius:16px;font-size:14.5px;white-space:pre-line;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.user{background:var(--user);align-self:flex-end;border-bottom-right-radius:4px}
.bubble.card{white-space:normal;width:88%}
.typing{align-self:flex-start;background:var(--bot);border-radius:16px;border-bottom-left-radius:4px;padding:12px 15px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:#8fb2d6;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.actions{padding:13px 16px 16px;border-top:1px solid #2b4261;display:flex;gap:8px;flex-wrap:wrap;min-height:74px;align-items:center}
.btn{background:#1c3555;color:#eef7ff;border:1px solid #416080;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600;text-align:left;line-height:1.35;font:inherit;font-weight:600;font-size:14px;text-decoration:none;display:inline-block}
.btn:hover,.btn:focus-visible{border-color:#54dfcb;background:#224768;outline:2px solid transparent}
.primary{background:var(--teal);color:#061b26;border-color:var(--teal)}.primary:hover{background:var(--teal-2);color:#061b26}
.big{font-size:15px;padding:13px 18px}
.side{padding:20px}.side h2{margin:0 0 14px;font-size:18px}
.price{border:1px solid #294665;border-radius:15px;padding:13px 15px;margin:9px 0;background:#122943}
.price b{display:block;font-size:15px;margin-bottom:5px}.price strong{font-size:21px;color:#66ebc9}
.price small{display:block;color:#a9bbd4;margin-top:5px;line-height:1.5}
.quick{display:grid;gap:8px;margin-top:16px}
.note{color:var(--dim);font-size:12px;line-height:1.6;margin-top:16px}
.formarea{width:100%;display:flex;gap:8px;flex-wrap:wrap}
.formarea input,.formarea textarea{flex:1 1 220px;background:#07172b;color:white;border:1px solid #4b6684;border-radius:11px;padding:11px 12px;font:inherit}
.formarea input:focus,.formarea textarea:focus{outline:none;border-color:#54dfcb}
.formarea .err{flex-basis:100%;color:#ff8a95;font-size:13px}

.slots{display:grid;gap:10px;margin-top:8px}
.sday b{display:block;font-size:13px;color:#cfe0f3;margin-bottom:6px}
.sday b span{color:var(--dim);font-weight:500}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:#122943;border:1px solid #3d6187;color:#eaf6ff;border-radius:10px;padding:8px 11px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
.chip:hover{border-color:var(--teal);background:#16405a}
.bt{border:1px solid #2f4d70;border-radius:13px;padding:11px 13px;margin-top:9px;background:#132c49}
.bt b{font-size:15px}.bt .meta{color:#b7c7de;font-size:13.5px;margin-top:3px}
.bt .code{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:800}
.vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin-top:9px;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vt{font-weight:700;margin-top:8px}.vm{color:var(--dim);font-size:12.5px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:8px;font-size:14px}
.sum span{color:var(--dim)}
.ok{color:#63e6bf;font-weight:700}
.feat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:10px 0;border-top:1px solid #2a4566}
.feat:first-of-type{border-top:0}
.feat i{font-style:normal;font-size:22px;line-height:1;width:38px;height:38px;border-radius:11px;background:#132c49;display:grid;place-items:center;grid-row:span 2}
.feat b{font-size:14.5px}.feat span{color:#b7c7de;font-size:13.5px;line-height:1.55}
.soon{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.06em;background:#3a2f12;color:var(--gold);vertical-align:middle}
.free{background:#123a2e;color:#63e6bf}
.code-big{font-size:26px;font-weight:900;letter-spacing:.06em;color:var(--gold);margin:6px 0}
footer{text-align:center;color:#7890af;font-size:12px;margin-top:22px}
a{color:#6eead0}
@media(max-width:760px){.layout{grid-template-columns:1fr}.chat{height:60vh}.side{padding:16px}.bubble,.bubble.card{max-width:94%;width:auto}}
@media(prefers-reduced-motion:reduce){.chat{scroll-behavior:auto}.bubble,.typing i{animation:none}}
html.embed body{background:#071020}html.embed .wrap{padding:14px 12px 16px}html.embed .hero,html.embed footer{display:none}
html.embed header{margin-bottom:12px;padding-right:46px}html.embed .chat{height:min(56vh,470px)}html.embed .back{display:none}
</style></head>

/* ---------------- state ---------------- */
let lang='si', medium='', st={}, LIVE={config:null,held:new Set(),samples:[]};
const t=k=>copy[lang][k];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- live data (public Firestore records) ---------------- */
function fsVal(v){ const k=Object.keys(v)[0], x=v[k];
  if(k==='mapValue') return Object.fromEntries(Object.entries(x.fields||{}).map(([a,b])=>[a,fsVal(b)]));
  if(k==='arrayValue') return (x.values||[]).map(fsVal);
  if(k==='integerValue') return +x; if(k==='nullValue') return null; return x; }
const FS=()=>{ const c=window.FIREBASE_CONFIG||{}; return c.projectId?{p:c.projectId,k:c.apiKey}:null; };
const fsBase=()=>`https://firestore.googleapis.com/v1/projects/${FS().p}/databases/(default)/documents`;
async function fsGet(path){ const r=await fetch(`${fsBase()}/${path}?key=${FS().k}`); if(!r.ok) throw new Error(r.status); return r.json(); }
async function fsAdd(coll,obj){
  const enc=v=>v===null?{nullValue:null}:typeof v==='boolean'?{booleanValue:v}:typeof v==='number'?{integerValue:String(v)}:{stringValue:String(v)};
  const fields=Object.fromEntries(Object.entries(obj).map(([a,b])=>[a,enc(b)]));
  const r=await fetch(`${fsBase()}/${coll}?key=${FS().k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});
  if(!r.ok) throw new Error(r.status); }
const ready=(async()=>{
  if(!FS()) return;
  await Promise.all([
    fsGet('site/config').then(d=>{ LIVE.config=JSON.parse(d.fields.json.stringValue); }).catch(()=>{}),
    fsGet('trials?pageSize=300').then(d=>{ (d.documents||[]).forEach(x=>{ const v=Object.fromEntries(Object.entries(x.fields||{}).map(([a,b])=>[a,fsVal(b)]));
      if(v.slot&&v.status!=='declined') LIVE.held.add(v.slot); }); }).catch(()=>{}),
    fsGet('site/samples').then(d=>{ LIVE.samples=(d.fields&&d.fields.list?fsVal(d.fields.list):[])||[]; }).catch(()=>{})
  ]);
  const w=LIVE.config&&LIVE.config.contact&&LIVE.config.contact.whatsapp;
  if(w&&/^[1-9][0-9]{7,14}$/.test(String(w))) CONFIG.whatsappNumber=String(w);
})();

/* ---------------- chat mechanics ---------------- */
let queue=Promise.resolve(), runId=0;
const scroll=()=>{ const c=$('chat'); c.scrollTop=c.scrollHeight; };
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function say(msg,who='bot',html=false){
  const my=runId;
  queue=queue.then(async()=>{
    if(my!==runId) return;
    if(who==='bot'){ const ty=document.createElement('div'); ty.className='typing'; ty.innerHTML='<i></i><i></i><i></i>';
      $('chat').appendChild(ty); scroll(); await wait(Math.min(900,300+String(msg).length*6)); ty.remove(); if(my!==runId) return; }
    const b=document.createElement('div'); b.className='bubble '+who+(html?' card':'');
    if(html) b.innerHTML=msg; else b.textContent=msg;
    $('chat').appendChild(b); scroll();
  });
  return queue;
}
function clearActions(){ $('actions').replaceChildren(); }
function buttons(items){ const my=runId; clearActions(); queue.then(()=>{ if(my!==runId) return; clearActions();
  items.forEach(([label,fn,primary])=>{ const b=document.createElement('button'); b.type='button';
    b.className='btn'+(primary?' primary':''); b.textContent=label;
    b.addEventListener('click',()=>{ say(label,'user'); fn(); }); $('actions').appendChild(b); }); }); }
function ask(ph,onOk,{skip,validate,lessons,type,secret}={}){ const my=runId; clearActions(); queue.then(()=>{ if(my!==runId) return; clearActions();
  const f=document.createElement('form'); f.className='formarea';
  const i=document.createElement('input'); i.placeholder=ph; i.maxLength=160; i.autocomplete=type==='email'?'email':type==='password'?'new-password':'off'; if(type) i.type=type;
  const go=document.createElement('button'); go.className='btn primary'; go.textContent=t('ok');
  const er=document.createElement('div'); er.className='err';
  f.append(i,go);
  if(skip){ const s=document.createElement('button'); s.type='button'; s.className='btn'; s.textContent=t('skip');
    s.onclick=()=>{ say(t('skip'),'user'); onOk(''); }; f.append(s); }
  f.append(er);
  f.onsubmit=e=>{ e.preventDefault(); const v=i.value.trim(); if(!v) return i.focus();
    const bad=validate&&validate(v); if(bad){ er.textContent=bad; return; } say(secret?'•'.repeat(v.length):v,'user'); onOk(v); };
  $('actions').append(f); setTimeout(()=>i.focus(),50);
  if(lessons){ const c=document.createElement('div'); c.className='chips'; c.style.cssText='width:100%;margin-top:4px';
    lessons.forEach(l=>{ const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=l;
      b.onclick=()=>{ say(l,'user'); onOk(l); }; c.append(b); }); $('actions').prepend(c); }
}); }

function start(){
  runId++; queue=Promise.resolve(); $('chat').replaceChildren(); clearActions(); st={};
  medium=''; say('ආයුබෝවන්! 👋 Hi! මම EICT advisor.\nමුලින්ම, ඔයා A/L ICT කරන්නේ කුමන මාධ්‍යයෙන්ද? / Which medium do you study in?');
  buttons([['සිංහල මාධ්‍යය',()=>pickMedium('si')],['English medium',()=>pickMedium('en')]]);
}
function pickMedium(m){ medium=m; lang=m; $('language').value=m; paintStatic(); say(t('askName')); ask(t('namePh'),n=>{ st.name=n; if(n) say(t('hello')(n)); menu(); },{skip:true}); }

  say(t('timesAfter'));

/* free trial */
function nextDate(day){ const D={mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sun:0}; const w=D[String(day).slice(0,3).toLowerCase()];
  if(w===undefined) return null; const n=new Date(); n.setHours(0,0,0,0); n.setDate(n.getDate()+((w-n.getDay()+7)%7)); return n; }
/* a time already gone today moves the slot to next week */
function slotDate(day,time){ const d=nextDate(day); if(!d) return null;
  const m=String(time).match(/(\d{1,2})[.:](\d{2})\s*([AP]M)?/i);
  if(m){ let h=+m[1]%12; if(/pm/i.test(m[3]||'')) h+=12; const at=new Date(d); at.setHours(h,+m[2],0,0);
    if(at-Date.now()<60*60*1000) d.setDate(d.getDate()+7); }
  return d; }
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const slotKey=(d,tm)=>`${String(d).trim()} · ${String(tm).trim()}`;
function dayLabel(d){ const n=new Date(); n.setHours(0,0,0,0); const diff=Math.round((d-n)/864e5);
  return diff===0?t('today'):diff===1?t('tomorrow'):d.toLocaleDateString(lang==='si'?'si-LK':'en-GB',{day:'numeric',month:'short'}); }
async function trial(){
  await ready;
  const T=(LIVE.config&&(LIVE.config.trial||LIVE.config.solo))||{};
  const slots=(T.slots&&T.slots.length?T.slots:FALLBACK_TRIAL);
  const away=T.blockedDates||[];
  const free=slots.filter(s=>{ const s0=s.status||(s.closed?'taken':'open'); const d=slotDate(s.day,s.time);
    return s0==='open'&&!LIVE.held.has(slotKey(s.day,s.time))&&!(d&&away.includes(iso(d))); });
  if(!free.length){ say(t('trialNone')); return buttons([[t('mContact'),contact,true],backBtn()]); }
  say(t('trialIntro'));
  free.forEach(s=>s._d=slotDate(s.day,s.time));
  free.sort((a,b)=>(a._d||0)-(b._d||0));
  const days=[...new Set(free.map(s=>s.day+'|'+(s._d?iso(s._d):'')))];
  const id='sl'+Date.now();
  await say(`<div class="slots" id="${id}">${days.map(k=>{ const [d,ds]=k.split('|'); const dt=ds?new Date(ds+'T00:00:00'):null;
    return `<div class="sday"><b>${esc(d)} <span>· ${esc(dt?dayLabel(dt):'')}</span></b><div class="chips">${
      free.filter(s=>s.day+'|'+(s._d?iso(s._d):'')===k).map(s=>`<button class="chip" type="button" data-slot="${esc(slotKey(s.day,s.time))}" data-date="${ds}">${esc(s.time)}</button>`).join('')}</div></div>`;}).join('')}</div>`,'bot',true);
  const box=$(id); if(box) box.addEventListener('click',e=>{ const b=e.target.closest('[data-slot]'); if(!b||st.slot) return;
    st.slot=b.dataset.slot; st.slotDate=b.dataset.date;
    box.querySelectorAll('.chip').forEach(c=>{ c.disabled=true; c.style.opacity=c===b?'1':'.35'; });
    say(b.closest('.sday').querySelector('b').textContent.split('·')[0].trim()+' '+b.textContent,'user');
    say(t('picked')(st.slot)); trialYear(); });
  buttons([backBtn()]);
}
function trialYear(){ say(t('yearQ')); buttons([[t('y27'),()=>{st.year='2027';trialLesson();}],[t('y28'),()=>{st.year='2028';trialLesson();}],[t('yOther'),()=>{st.year='Other';trialLesson();}]]); }
function trialLesson(){ say(t('lessonQ')); ask(t('lessonPh'),v=>{ st.lesson=v; st.name?trialPhone():(say(t('nameQ')),ask(t('namePh'),n=>{st.name=n;trialPhone();})); },{lessons:t('lessons')}); }
function trialPhone(){ say(t('phoneQ')); ask(t('phonePh'),v=>{ st.phone=v; trialSummary(); },
  {validate:v=>/^(\+?94|0)?7\d{8}$/.test(v.replace(/[\s-]/g,''))?'':t('phoneBad')}); }
function trialSummary(){
  say(`<b>${esc(t('sumT'))}</b><div class="sum"><span>${esc(t('sumSlot'))}</span><b>${esc(st.slot)}${st.slotDate?' ('+esc(st.slotDate)+')':''}</b>
    <span>${esc(t('sumYear'))}</span><b>${esc(st.year)}</b><span>${esc(t('sumLesson'))}</span><b>${esc(st.lesson)}</b>
    <span>${esc(t('sumName'))}</span><b>${esc(st.name)}</b><span>${esc(t('sumPhone'))}</span><b>${esc(st.phone)}</b></div>`,'bot',true);
  buttons([[t('confirm'),bookTrial,true],[t('change'),()=>{ st.slot=null; trial(); }]]);
}
async function bookTrial(){
  clearActions(); const at=new Date().toISOString();
  const med=medium==='si'?'Sinhala medium':'English medium';
  let ok=true;
  try{
    if(!FS()) throw new Error('no firebase');
    await fsAdd('requests',{name:st.name,whatsapp:st.phone,school:'',type:'one-to-one',batch:null,slot:st.slot,fee:'',at,
      note:`Free trial via advisor · ${med} · A/L ${st.year} · ${st.lesson}`});
    await fsAdd('trials',{name:st.name,whatsapp:st.phone,school:'',type:'one-to-one',slot:st.slot,date:st.slotDate||'',
      alYear:st.year,lesson:st.lesson,medium:med,kind:'trial',source:'advisor',status:'pending',at});
    fsAdd('holds',{slot:st.slot,at}).catch(()=>{});
    LIVE.held.add(st.slot);
  }catch(e){ ok=false; }
  const f=window.EICT_ALERTS||{}, topic=(f.ntfyTopic||'').trim();
  if(topic) try{ const q=new URLSearchParams({title:'EICT - Free trial request (advisor)',priority:'high',tags:'bell',
      message:`${st.name} · ${st.phone}\n${st.slot}${st.slotDate?' ('+st.slotDate+')':''}\nA/L ${st.year} · ${med} · wants: ${st.lesson}`});
    fetch(`https://ntfy.sh/${encodeURIComponent(topic)}/publish?${q}`,{mode:'no-cors'}); }catch(e){}
  say(ok?t('booked')(st.name):t('bookFail'));
  const msg=`Hello Sir! I booked a free trial class on the EICT website.\nName: ${st.name}\nTime: ${st.slot}${st.slotDate?' ('+st.slotDate+')':''}\nA/L: ${st.year} · ${med}\nLesson: ${st.lesson}`;
  waButtons(msg,[[t('mSample'),sample],backBtn()]);
}
function waButtons(msg,more){ const my=runId; queue.then(()=>{ if(my!==runId) return; clearActions();
  const a=document.createElement('a'); a.className='btn primary big'; a.target='_blank'; a.rel='noopener noreferrer';
  a.href='https://wa.me/'+CONFIG.whatsappNumber+'?text='+encodeURIComponent(msg); a.textContent=t('waBtn'); $('actions').append(a);
  (more||[]).forEach(([l,fn])=>{ const b=document.createElement('button'); b.type='button'; b.className='btn'; b.textContent=l;
    b.onclick=()=>{ say(l,'user'); fn(); }; $('actions').append(b); }); }); }

/* sample lessons */
function embedUrl(v){ v=String(v||'').trim();
  const d=v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([A-Za-z0-9_-]{10,})/); if(d) return 'https://drive.google.com/file/d/'+d[1]+'/preview';
  const y=v.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/)||v.match(/^([A-Za-z0-9_-]{11})$/);
  return y?'https://www.youtube-nocookie.com/embed/'+y[1]+'?rel=0':''; }
const vidCard=(s)=>{ const u=embedUrl(s.yt); return u?`<div class="vid"><iframe src="${esc(u)}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(s.title||'Sample lesson')}"></iframe></div>
  <div class="vt">${esc(s.title||'')}</div><div class="vm">${esc([s.date,s.mins?s.mins+' min':''].filter(Boolean).join(' · '))}</div>`:''; };
async function sample(){
  await ready;
  const mine=s=>medium==='si'?s.batch==='AL-27-SI':s.batch!=='AL-27-SI';
  const list=(LIVE.samples||[]).filter(s=>embedUrl(s.yt));
  let show=list.filter(mine), other=false;
  if(!show.length&&list.length){ show=list; other=true; }
  if(!show.length){ say(t('sampleNone')); say(vidCard({yt:CONFIG.introVideo,title:'EICT · Intro'}),'bot',true); }
  else{ say(t('sampleIntro')); show.slice(0,3).forEach(s=>say(vidCard(s),'bot',true)); if(other) say(t('sampleOther')); }
  say(t('sampleAfter'));
  buttons([[t('mTrial'),trial,true],[t('mReg'),register],[t('mWhat'),what],backBtn()]);
}

async function fbx(){
  if(FBX) return FBX;
  const cfg=window.FIREBASE_CONFIG; if(!cfg||!cfg.projectId) throw new Error('no firebase');
  const {initializeApp}=await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js');
  const fs=await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js');
  const au=await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js');
  const app=initializeApp(cfg);                       // default app, so the class page sees the same sign-in
  return FBX={db:fs.getFirestore(app),auth:au.getAuth(app),...fs,...au};
}

    <span>${esc(t('regAddrL'))}</span><b>${esc(r.address)}</b><span>${esc(t('regEmailL'))}</span><b>${esc(r.email)}</b></div>`,'bot',true);
  buttons([[t('regGo'),regCreate,true],[t('regRedo'),register]]);

async function regCreate(){
  const r=st.reg; clearActions(); say(t('regMaking'));
  let code='';
  try{
    const F=await fbx();
    const c=await F.createUserWithEmailAndPassword(F.auth,r.email,r.pass);
    try{
      const ref=F.doc(F.db,'meta','students');
      const n=await F.runTransaction(F.db,async tx=>{ const d=await tx.get(ref);
        const next=(d.exists()&&Number(d.data().next))?Number(d.data().next):1; tx.set(ref,{next:next+1},{merge:true}); return next; });
      code='EICT-'+String(n).padStart(4,'0');
    }catch(e){ code='EICT-'+String(Date.now()).slice(-4); }
    await F.setDoc(F.doc(F.db,'students',c.user.uid),{
      code, name:r.name, whatsapp:r.whatsapp, school:r.school, address:r.address, email:r.email, mode:r.mode,
      batch:r.batch, track:r.track, unlocked:[], watched:[], paidLive:false, shipments:[], at:F.serverTimestamp(),
      source:'advisor' });
  }catch(e){
    const c=e.code||'';
    say(/email-already-in-use/.test(c)?t('regInUse'):t('regFail')+(/network/.test(c)?t('regNet'):(c||e.message||'')));
    const a=PORTAL[r.batch][0];
    return queue.then(()=>{ clearActions(); const l=document.createElement('a'); l.className='btn primary'; l.href=a; l.target='_top'; l.textContent=t('openPortal');
      $('actions').append(l); const b=document.createElement('button'); b.className='btn'; b.type='button'; b.textContent=t('regRedo'); b.onclick=register; $('actions').append(b); });
  }
  delete r.pass;
  const f=window.EICT_ALERTS||{}, topic=(f.ntfyTopic||'').trim();
  if(topic) try{ const q=new URLSearchParams({title:'EICT - New student registered (advisor)',priority:'high',tags:'bell',
    message:`${r.name} joined ${PORTAL[r.batch][1]}.\nClass: ${r.track}${r.track==='solo'?' · '+r.mode:''}\nNumber: ${code}\nWhatsApp: ${r.whatsapp}\nSchool: ${r.school}\nEmail: ${r.email}\nSend tutes to: ${r.address}`});
    fetch(`https://ntfy.sh/${encodeURIComponent(topic)}/publish?${q}`,{mode:'no-cors'}); }catch(e){}
  say(t('regDone')(r.name.split(' ')[0]));
  say(`<div class="code-big">${esc(code)}</div><div class="vm">${esc(PORTAL[r.batch][1])}</div>`,'bot',true);
  say(t('regNext'));
  queue.then(()=>{ clearActions(); const l=document.createElement('a'); l.className='btn primary big'; l.href=PORTAL[r.batch][0]; l.target='_top';
    l.textContent=t('openPortal'); $('actions').append(l);
    const w=document.createElement('a'); w.className='btn'; w.target='_blank'; w.rel='noopener noreferrer';
    w.href='https://wa.me/'+CONFIG.whatsappNumber+'?text='+encodeURIComponent(`Hello Sir! I just registered on the EICT website.\nName: ${r.name}\nStudent number: ${code}\n${PORTAL[r.batch][1]}`);
    w.textContent=t('waBtn'); $('actions').append(w); });
}

/* ---------------- page text ---------------- */
function paintStatic(){
  document.documentElement.lang=lang;
  ['tag','headline','intro','status'].forEach(k=>$(k).textContent=t(k));
  $('restart').textContent=t('restart'); $('pricesTitle').textContent=t('prices');
  ['group','online','physical'].forEach(k=>{ $(k+'Name').textContent=t(k); $(k+'Info').textContent=t(k+'Info'); });
  $('note').textContent=t('note'); $('qTrial').textContent=t('qTrial'); $('qSample').textContent=t('qSample'); $('qTimes').textContent=t('qTimes'); $('qReg').textContent=t('qReg');
}
$('language').addEventListener('change',e=>{ lang=e.target.value; paintStatic(); if(!medium) start(); else menu(true); });
$('restart').addEventListener('click',()=>{ paintStatic(); start(); });
const quick=fn=>()=>{ if(!medium){ medium=lang; } say(document.activeElement.textContent,'user'); fn(); };
$('qTrial').addEventListener('click',quick(trial)); $('qSample').addEventListener('click',quick(sample)); $('qTimes').addEventListener('click',quick(times)); $('qReg').addEventListener('click',quick(register));
paintStatic(); start();
